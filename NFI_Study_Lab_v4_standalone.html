be hot enough to burn skin during operation and for a long time after the flame is off. Many current glass-fronted gas fireplaces ship with a protective barrier screen intended to reduce contact burns (check the model's manual for whether one is required); owners should understand that a required barrier must stay installed. Discuss children, pets, elderly occupants and furniture placement. Combustible decorations and stockings must respect mantel clearances."},{"h":"Fuel and ash","body":"Wood owners need guidance on dry fuel, never burning trash, painted or treated wood, and never using flammable liquids to start fires. Ashes can hold live embers for days: they go into a metal container with a tight lid, set on a noncombustible surface away from the house. Pellet owners need guidance on fuel grade, dry storage and burn-pot cleaning. Gas owners need to know what the odorant smells like and what to do if they smell it."},{"h":"Alarms and emergencies","body":"Every home with a fuel-burning appliance needs working carbon monoxide alarms and smoke alarms located per local code and the alarm instructions. If a CO alarm sounds, everyone leaves for fresh air and calls emergency services — this is not a troubleshooting moment. If gas is smelled: no switches, no flames, no phones inside; leave and call the gas utility or 911 from outside. Chimney fire signs — loud roaring, dense smoke, flames or sparks from the top — require leaving and calling the fire department, and a professional inspection before the next use."},{"h":"Escalating and documenting","body":"Specialists see things: scorched framing, a disconnected vent, an appliance installed outside its listing, an owner who has disabled a safety switch. The correct response is to explain the concern, recommend the system not be used until it is evaluated, route it to qualified service, and document what you observed and communicated. Never coach an owner through bypassing a safety device."}],"worked":[{"q":"Owner says the pellet stove's exhaust blower runs for 30 minutes after shutdown. Concern?","a":"Usually normal designed cool-down; confirm against the owner's manual and explain it at handoff."}],"misconceptions":["Once the flame is off the glass is safe to touch — surfaces stay hot.","A CO alarm can be silenced while the appliance is checked — evacuate first.","Owners can do all maintenance — only the tasks the manual assigns to owners."],"src":["HYPO"],"manualCheck":"Note the manual's handoff checklist items and any stated ash/disposal practice.","segments":["[Chapter 12. Communicating with owners: operation, safety and handoff.] [pause 1s]\n\nIn this lesson you will learn to: Build a model-specific owner handoff covering operation, maintenance, fuel, ash and alarms; Explain hot-surface, glass-barrier and child-safety points; Recognize conditions that require emergency action versus routine service; Document and escalate unsafe conditions appropriately. [pause 1s]\n\nThe handoff is part of the installation. [pause 0.5s] Owners operate what they understand. A strong handoff uses the actual owner's manual for the installed model: lighting and shutdown, normal sounds and smells during the first fires as paint cures, how to use the remote or thermostat, what the owner may clean and what requires a technician, the service interval, and who to call. Leave the manual with the appliance and record model, serial number, installer and date.\n\nHot surfaces and barriers. [pause 0.5s] Glass, metal surrounds, and the hearth can be hot enough to burn skin during operation and for a long time after the flame is off. Many current glass-fronted gas fireplaces ship with a protective barrier screen intended to reduce contact burns (check the model's manual for whether one is required); owners should understand that a required barrier must stay installed. Discuss children, pets, elderly occupants and furniture placement. Combustible decorations and stockings must respect mantel clearances.\n\nFuel and ash. [pause 0.5s] Wood owners need guidance on dry fuel, never burning trash, painted or treated wood, and never using flammable liquids to start fires. Ashes can hold live embers for days: they go into a metal container with a tight lid, set on a noncombustible surface away from the house. Pellet owners need guidance on fuel grade, dry storage and burn-pot cleaning. Gas owners need to know what the odorant smells like and what to do if they smell it.\n\nAlarms and emergencies. [pause 0.5s] Every home with a fuel-burning appliance needs working carbon monoxide alarms and smoke alarms located per local code and the alarm instructions. If a C-O alarm sounds, everyone leaves for fresh air and calls emergency services — this is not a troubleshooting moment. If gas is smelled: no switches, no flames, no phones inside; leave and call the gas utility or 911 from outside. Chimney fire signs — loud roaring, dense smoke, flames or sparks from the top — require leaving and calling the fire department, and a professional inspection before the next use.\n\nEscalating and documenting. [pause 0.5s] Specialists see things: scorched framing, a disconnected vent, an appliance installed outside its listing, an owner who has disabled a safety switch. The correct response is to explain the concern, recommend the system not be used until it is evaluated, route it to qualified service, and document what you observed and communicated. Never coach an owner through bypassing a safety device.\n\nWorked example 1. Owner says the pellet stove's exhaust blower runs for 30 minutes after shutdown. Concern? [pause 3s — try it before the answer] Here is the solution. Usually normal designed cool-down; confirm against the owner's manual and explain it at handoff.\n\nCommon misconceptions. Misconception: Once the flame is off the glass is safe to touch — surfaces stay hot. Misconception: A C-O alarm can be silenced while the appliance is checked — evacuate first. Misconception: Owners can do all maintenance — only the tasks the manual assigns to owners.\n\nQuick check. Pause the audio and answer: Build a model-specific owner handoff covering operation, maintenance, fuel, ash and alarms. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":615,"estSecs":264},{"id":"ch13-01","chapter":13,"title":"Wood systems: fuel, technology, creosote and chimneys","objectives":["Measure and interpret wood moisture (wet vs. dry basis) and explain seasoning.","State cord volume and estimate stacked fuel volumes.","Compare noncatalytic, catalytic and hybrid stove technology.","Explain creosote formation stages and chimney inspection levels.","Apply EPA emission limits and installation requirements in planning."],"sections":[{"h":"Fuel moisture","body":"Freshly cut wood can be half water by weight. Energy spent boiling water is not available to heat the room, keeps the firebox cool, and produces smoke and creosote. EPA guidance is that wood burns best below 20 percent moisture, tested on a freshly split interior face with a moisture meter. Splitting, stacking off the ground with air flow, covering the top and allowing roughly six months for softwoods and a year for hardwoods are common seasoning guidelines. Always state the basis of a moisture figure: wet basis divides water by total weight; dry basis divides water by oven-dry wood weight, so it gives a larger number for the same log."},{"h":"Measuring fuel","body":"A full cord is a stack 4 feet high, 4 feet deep and 8 feet long — 128 cubic feet including air space. A 'face cord' or 'rick' is one row of shorter pieces and is only a fraction of a cord. Heat content per cord depends mainly on species density and moisture: dense hardwoods hold more energy per cord than light softwoods, though per pound of dry wood the energy is similar."},{"h":"Clean-burn technologies","body":"A noncatalytic stove achieves clean combustion with an insulated firebox, a baffle that lengthens the gas path and keeps heat in, and preheated secondary air that burns the smoke above the fire. A catalytic stove routes smoke through a coated ceramic or metal combustor that lets the smoke oxidize at a lower temperature; it needs a bypass damper for startup and periodic inspection and eventual replacement. Hybrid designs combine both. All are certified to the same EPA limits: 2.0 grams per hour with crib wood or 2.5 grams per hour with cord wood for room heaters sold since the 2020 step."},{"h":"Creosote","body":"Creosote forms when unburned tars and vapors condense on flue surfaces cooler than their dew point. It appears as a light, flaky soot, then a crunchy or tar-like deposit, and in its worst form a hard glazed coating that is very difficult to remove. All forms are combustible. Contributing factors include wet wood, smoldering low-air burns, oversized or exterior flues that run cold, and long horizontal connectors. Chimney fires can damage liners and ignite surrounding structure."},{"h":"Chimney inspection levels","body":"NFPA 211 defines three levels for existing chimneys. Level I covers readily accessible portions and is appropriate for routine annual service when nothing has changed. Level II adds accessible attics, crawl spaces and a video or equivalent internal inspection, and is required for events such as a change in appliance or fuel, sale or transfer of the property, relining, or after an operating malfunction or event like a chimney fire. Level III involves removal of components or building materials to reach concealed areas, when a hazard is suspected that cannot be evaluated otherwise."},{"h":"Fitting the system","body":"Wood stoves need the listed floor protection, clearances, connector and a chimney rated for solid fuel. Inserts usually need a full stainless liner sized to the insert outlet, and many listings or codes require the liner to run to the top of the chimney. Factory-built wood fireplaces must use their listed chimney. Outside air, house pressure and the owner's fuel supply belong in the planning conversation."}],"worked":[{"q":"A 12 lb split weighs 9 lb when oven-dried. Moisture wet and dry basis?","a":"Water = 3 lb. Wet basis = 3 ÷ 12 = 25%. Dry basis = 3 ÷ 9 = 33.3%."},{"q":"Stack 8 ft long, 4 ft high, 16 in. pieces. Fraction of a cord?","a":"8 × 4 × 1.333 = 42.7 ft³ ÷ 128 = 0.33 cord."}],"misconceptions":["A face cord is a cord — it is about one-third when pieces are 16 in.","Catalytic stoves need no maintenance — the combustor must be inspected and eventually replaced.","Creosote only forms in old stoves — any appliance burning wet wood slowly into a cold flue can form it."],"src":["S05","S06","S11","HYPO"],"manualCheck":"Note the manual's energy-per-cord or Btu/lb values and its stage names for creosote.","segments":["[Chapter 13. Wood systems: fuel, technology, creosote and chimneys.] [pause 1s]\n\nIn this lesson you will learn to: Measure and interpret wood moisture (wet vs. dry basis) and explain seasoning; State cord volume and estimate stacked fuel volumes; Compare noncatalytic, catalytic and hybrid stove technology; Explain creosote formation stages and chimney inspection levels; Apply E-P-A emission limits and installation requirements in planning. [pause 1s]\n\nFuel moisture. [pause 0.5s] Freshly cut wood can be half water by weight. Energy spent boiling water is not available to heat the room, keeps the firebox cool, and produces smoke and creosote. E-P-A guidance is that wood burns best below 20 percent moisture, tested on a freshly split interior face with a moisture meter. Splitting, stacking off the ground with air flow, covering the top and allowing roughly six months for softwoods and a year for hardwoods are common seasoning guidelines. Always state the basis of a moisture figure: wet basis divides water by total weight; dry basis divides water by oven-dry wood weight, so it gives a larger number for the same log.\n\nMeasuring fuel. [pause 0.5s] A full cord is a stack 4 feet high, 4 feet deep and 8 feet long — 128 cubic feet including air space. A 'face cord' or 'rick' is one row of shorter pieces and is only a fraction of a cord. Heat content per cord depends mainly on species density and moisture: dense hardwoods hold more energy per cord than light softwoods, though per pound of dry wood the energy is similar.\n\nClean-burn technologies. [pause 0.5s] A noncatalytic stove achieves clean combustion with an insulated firebox, a baffle that lengthens the gas path and keeps heat in, and preheated secondary air that burns the smoke above the fire. A catalytic stove routes smoke through a coated ceramic or metal combustor that lets the smoke oxidize at a lower temperature; it needs a bypass damper for startup and periodic inspection and eventual replacement. Hybrid designs combine both. All are certified to the same E-P-A limits: 2.0 grams per hour with crib wood or 2.5 grams per hour with cord wood for room heaters sold since the 2020 step.\n\nCreosote. [pause 0.5s] Creosote forms when unburned tars and vapors condense on flue surfaces cooler than their dew point. It appears as a light, flaky soot, then a crunchy or tar-like deposit, and in its worst form a hard glazed coating that is very difficult to remove. All forms are combustible. Contributing factors include wet wood, smoldering low-air burns, oversized or exterior flues that run cold, and long horizontal connectors. Chimney fires can damage liners and ignite surrounding structure.\n\nChimney inspection levels. [pause 0.5s] N-F-P-A 211 defines three levels for existing chimneys. Level I covers readily accessible portions and is appropriate for routine annual service when nothing has changed. Level II adds accessible attics, crawl spaces and a video or equivalent internal inspection, and is required for events such as a change in appliance or fuel, sale or transfer of the property, relining, or after an operating malfunction or event like a chimney fire. Level III involves removal of components or building materials to reach concealed areas, when a hazard is suspected that cannot be evaluated otherwise.\n\nFitting the system. [pause 0.5s] Wood stoves need the listed floor protection, clearances, connector and a chimney rated for solid fuel. Inserts usually need a full stainless liner sized to the insert outlet, and many listings or codes require the liner to run to the top of the chimney. Factory-built wood fireplaces must use their listed chimney. Outside air, house pressure and the owner's fuel supply belong in the planning conversation.\n\nWorked example 1. A 12 pounds split weighs 9 pounds when oven-dried. Moisture wet and dry basis? [pause 3s — try it before the answer] Here is the solution. Water = 3 pounds. Wet basis = 3 divided by 12 = 25 percent. Dry basis = 3 divided by 9 = 33.3 percent.\n\nWorked example 2. Stack 8 feet long, 4 feet high, 16 inches pieces. Fraction of a cord? [pause 3s — try it before the answer] Here is the solution. 8 times 4 times 1.333 = 42.7 cubic feet divided by 128 = 0.33 cord.","Common misconceptions. Misconception: A face cord is a cord — it is about one-third when pieces are 16 inches Misconception: Catalytic stoves need no maintenance — the combustor must be inspected and eventually replaced. Misconception: Creosote only forms in old stoves — any appliance burning wet wood slowly into a cold flue can form it.\n\nQuick check. Pause the audio and answer: Measure and interpret wood moisture (wet vs. dry basis) and explain seasoning. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":824,"estSecs":353},{"id":"ch14-01","chapter":14,"title":"Gas systems: fuels, pressure, controls and safety","objectives":["Compare natural gas and propane: composition, specific gravity, heating value and supply.","Convert between psi and inches of water column; define inlet, manifold, static and operating pressure.","Calculate fuel consumption from input and heating value.","Explain regulators, orifices, standing pilots, thermocouples, thermopiles, electronic ignition, flame proving and ODS.","Identify venting categories and safety responses."],"sections":[{"h":"Two fuels, different behavior","body":"Natural gas is mostly methane; it is lighter than air with a specific gravity around 0.6, so leaks tend to rise and disperse. Propane vapor is about 1.5 times as heavy as air, so leaks can settle in low spaces such as basements and window wells. US average heating values are about 1,036 Btu per cubic foot for natural gas and about 91,452 Btu per gallon of liquid propane; propane vapor is roughly two and a half times as energy-dense per cubic foot as natural gas. Because propane carries more energy per volume and is delivered at higher pressure, its orifices are much smaller. Appliances are fuel-specific; conversion requires the manufacturer's approved kit and a qualified technician."},{"h":"Pressure units and measurement points","body":"Appliance gas pressures are low, so they are expressed in inches of water column — the height a pressure would push a column of water in a U-tube manometer. One psi equals about 27.7 inches of water column. Inlet (supply) pressure is measured at the appliance valve inlet; manifold (outlet) pressure is measured after the valve's regulator, at the burner manifold. Static pressure is measured with no gas flowing; operating (dynamic) pressure is measured with appliances firing. A large drop from static to operating pressure suggests undersized piping, a restriction or an inadequate supply. Typical appliance labels list a minimum and maximum inlet pressure and a manifold pressure for each fuel; always read the rating plate."},{"h":"Regulators and orifices","body":"Regulators reduce and stabilize pressure: propane systems commonly use two-stage regulation from the tank; natural gas arrives regulated by the utility; the appliance valve contains its own regulator setting manifold pressure. The orifice is a precisely drilled opening that meters gas into the burner; for a given pressure, its size sets the input. Air shutters adjust primary air on some burners. Changing orifices, pressures or air shutters outside the manufacturer's instructions changes combustion and can create carbon monoxide or flame problems."},{"h":"Ignition and flame proving","body":"A standing pilot burns continuously. A thermocouple placed in the pilot flame produces a small voltage (millivolts) that holds the safety valve open; if the pilot goes out, the voltage drops and the valve closes. A thermopile is many thermocouple junctions in series producing a higher voltage — enough to power a millivolt valve and wall switch or thermostat without household electricity. Intermittent pilot ignition lights a pilot only on demand; direct spark ignition lights the main burner directly. Electronic systems prove flame, often by flame rectification — a small current passed through the flame — and lock out if flame isn't proven within the timed sequence."},{"h":"Oxygen depletion sensing","body":"Vent-free appliances use an ODS pilot: if oxygen in the room drops below a set point, the pilot flame lifts away from its thermocouple and the gas valve shuts off. An ODS responds to oxygen depletion; it is not a carbon monoxide detector and does not replace CO alarms."},{"h":"Venting and piping overview","body":"Natural-draft gas appliances vent through listed Type B vent or approved lined chimneys; direct-vent appliances use their specific listed systems; vent-free units release products into the room within strict limits. Gas piping is sized for the total connected load, the pipe length, allowable pressure drop and fuel, using tables in the fuel gas code; the specialist gathers load and distance information for the qualified installer."},{"h":"Safety responses","body":"If gas is smelled, do not light anything, operate switches or use phones in the area; leave and call the utility or emergency services from outside. Never test for leaks with a flame. Altitude reduces air density; above 2,000 feet many US instructions call for reducing input about 4 percent per 1,000 feet or using a specified high-altitude orifice — follow the listing."}],"worked":[{"q":"Convert 11 in. w.c. to psi.","a":"11 ÷ 27.7 ≈ 0.40 psi."},{"q":"A 40,000 Btu/h propane fireplace runs 5 h. Liquid propane used (EIA value)?","a":"200,000 Btu ÷ 91,452 Btu/gal ≈ 2.19 gal."},{"q":"35,000 Btu/h on natural gas at 1,036 Btu/ft³. Gas flow?","a":"35,000 ÷ 1,036 ≈ 33.8 ft³/h."}],"misconceptions":["An ODS pilot protects against carbon monoxide — it senses oxygen depletion only.","Static pressure equal to the label minimum guarantees adequate supply — check operating pressure under load.","Propane and natural gas appliances differ only in the regulator — orifices, settings and sometimes valves differ."],"src":["S10","S13","S14","HYPO"],"manualCheck":"Record the manual's stated specific gravities, heating values and example pressures; exam answers will follow those values.","segments":["[Chapter 14. Gas systems: fuels, pressure, controls and safety.] [pause 1s]\n\nIn this lesson you will learn to: Compare natural gas and propane: composition, specific gravity, heating value and supply; Convert between P-S-I and inches of water column; define inlet, manifold, static and operating pressure; Calculate fuel consumption from input and heating value; Explain regulators, orifices, standing pilots, thermocouples, thermopiles, electronic ignition, flame proving and O-D-S; Identify venting categories and safety responses. [pause 1s]\n\nTwo fuels, different behavior. [pause 0.5s] Natural gas is mostly methane; it is lighter than air with a specific gravity around 0.6, so leaks tend to rise and disperse. Propane vapor is about 1.5 times as heavy as air, so leaks can settle in low spaces such as basements and window wells. US average heating values are about 1,036 B-T-U per cubic foot for natural gas and about 91,452 B-T-U per gallon of liquid propane; propane vapor is roughly two and a half times as energy-dense per cubic foot as natural gas. Because propane carries more energy per volume and is delivered at higher pressure, its orifices are much smaller. Appliances are fuel-specific; conversion requires the manufacturer's approved kit and a qualified technician.\n\nPressure units and measurement points. [pause 0.5s] Appliance gas pressures are low, so they are expressed in inches of water column — the height a pressure would push a column of water in a U-tube manometer. One P-S-I equals about 27.7 inches of water column. Inlet (supply) pressure is measured at the appliance valve inlet; manifold (outlet) pressure is measured after the valve's regulator, at the burner manifold. Static pressure is measured with no gas flowing; operating (dynamic) pressure is measured with appliances firing. A large drop from static to operating pressure suggests undersized piping, a restriction or an inadequate supply. Typical appliance labels list a minimum and maximum inlet pressure and a manifold pressure for each fuel; always read the rating plate.\n\nRegulators and orifices. [pause 0.5s] Regulators reduce and stabilize pressure: propane systems commonly use two-stage regulation from the tank; natural gas arrives regulated by the utility; the appliance valve contains its own regulator setting manifold pressure. The orifice is a precisely drilled opening that meters gas into the burner; for a given pressure, its size sets the input. Air shutters adjust primary air on some burners. Changing orifices, pressures or air shutters outside the manufacturer's instructions changes combustion and can create carbon monoxide or flame problems.\n\nIgnition and flame proving. [pause 0.5s] A standing pilot burns continuously. A thermocouple placed in the pilot flame produces a small voltage (millivolts) that holds the safety valve open; if the pilot goes out, the voltage drops and the valve closes. A thermopile is many thermocouple junctions in series producing a higher voltage — enough to power a millivolt valve and wall switch or thermostat without household electricity. Intermittent pilot ignition lights a pilot only on demand; direct spark ignition lights the main burner directly. Electronic systems prove flame, often by flame rectification — a small current passed through the flame — and lock out if flame isn't proven within the timed sequence.\n\nOxygen depletion sensing. [pause 0.5s] Vent-free appliances use an O-D-S pilot: if oxygen in the room drops below a set point, the pilot flame lifts away from its thermocouple and the gas valve shuts off. An O-D-S responds to oxygen depletion; it is not a carbon monoxide detector and does not replace C-O alarms.\n\nVenting and piping overview. [pause 0.5s] Natural-draft gas appliances vent through listed Type B vent or approved lined chimneys; direct-vent appliances use their specific listed systems; vent-free units release products into the room within strict limits. Gas piping is sized for the total connected load, the pipe length, allowable pressure drop and fuel, using tables in the fuel gas code; the specialist gathers load and distance information for the qualified installer.","Safety responses. [pause 0.5s] If gas is smelled, do not light anything, operate switches or use phones in the area; leave and call the utility or emergency services from outside. Never test for leaks with a flame. Altitude reduces air density; above 2,000 feet many US instructions call for reducing input about 4 percent per 1,000 feet or using a specified high-altitude orifice — follow the listing.\n\nWorked example 1. Convert 11 inches of water column to P-S-I. [pause 3s — try it before the answer] Here is the solution. 11 divided by 27.7 about 0.40 P-S-I.\n\nWorked example 2. A 40,000 B-T-U per hour propane fireplace runs 5 hours. Liquid propane used (EIA value)? [pause 3s — try it before the answer] Here is the solution. 200,000 B-T-U divided by 91,452 B-T-U per gallon about 2.19 gal.\n\nWorked example 3. 35,000 B-T-U per hour on natural gas at 1,036 B-T-U per cubic foot. Gas flow? [pause 3s — try it before the answer] Here is the solution. 35,000 divided by 1,036 about 33.8 cubic feet per hour.\n\nCommon misconceptions. Misconception: An O-D-S pilot protects against carbon monoxide — it senses oxygen depletion only. Misconception: Static pressure equal to the label minimum guarantees adequate supply — check operating pressure under load. Misconception: Propane and natural gas appliances differ only in the regulator — orifices, settings and sometimes valves differ.\n\nQuick check. Pause the audio and answer: Compare natural gas and propane: composition, specific gravity, heating value and supply. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":936,"estSecs":401},{"id":"ch15-01","chapter":15,"title":"Pellet systems: fuel, feed, airflow and venting","objectives":["Interpret PFI fuel grades and fuel quality effects (ash, fines, moisture).","Calculate input and burn time from feed rate and heating value.","Explain hopper, auger, burn pot, combustion and convection blowers, sensors and switches.","Explain pellet venting, equivalent length, altitude and power-outage considerations.","Explain cleaning and shutdown sequences."],"sections":[{"h":"Fuel quality","body":"The Pellet Fuels Institute grades residential pellets as Premium, Standard and Utility. Premium allows no more than 1 percent inorganic ash, Standard 2 percent and Utility 6 percent; moisture is limited to 8 percent for Premium and 10 percent for the others; fines at the mill gate are limited to half a percent for Premium and 1 percent for the others. Bulk density, diameter and durability are also specified. Heating value has no grade limit, but quality-marked bags state a guaranteed minimum. High ash fills burn pots and can form clinkers; fines can jam augers and change feed rate; wet pellets swell and crumble. Always use the fuel grade the appliance manufacturer specifies."},{"h":"Feed and combustion","body":"Pellets are stored in a hopper and metered by an auger driven by a gear motor into the burn pot. The controller sets feed rate — often by cycling the auger — to set heat output. Input equals feed rate times fuel heating value, and run time equals hopper contents divided by feed rate. Ignition is usually by an electric hot-air igniter. The combustion (exhaust) blower draws combustion air through the burn pot and pushes exhaust out the vent; the convection (room-air) blower moves room air across the heat exchanger. They are different blowers with different jobs."},{"h":"Sensors and safeties","body":"A vacuum or pressure switch proves that the combustion blower is moving air through the system; if the door is open, the vent is blocked or the blower fails, the switch opens and the controller stops feeding fuel. Temperature sensors and high-limit switches stop feed on overheating. Many units monitor exhaust temperature to confirm ignition and flame-out. These devices are safeties and must never be bypassed."},{"h":"Venting","body":"Pellet appliances produce exhaust under positive pressure, so the vent must be gas-tight: the manufacturer specifies a listed pellet vent of a particular diameter. Vent tables limit equivalent length — each elbow and tee counts as several feet of straight pipe — and many manufacturers require a vertical rise to provide natural draft if power fails, reducing smoke spillage. Higher altitude and longer runs may require the larger diameter. Terminations need clearances to doors, windows, grade and walkways per the listing and code."},{"h":"Power, cleaning and shutdown","body":"Without electricity there is no feed and no combustion blower; some owners add battery backup units approved by the manufacturer. Owners clean the burn pot and ash pan as directed — daily or by fuel use — while service technicians clean blowers, heat exchanger passages and the vent annually or by tonnage. On shutdown the auger stops first and the combustion blower keeps running to burn out the remaining fuel and cool the unit."}],"worked":[{"q":"40-lb bag, feed 1.6 lb/h, pellets 8,200 Btu/lb (HYPO). Input and run time?","a":"Input = 1.6 × 8,200 = 13,120 Btu/h. Time = 40 ÷ 1.6 = 25 h."},{"q":"Same stove at 70% efficiency. Output?","a":"13,120 × 0.70 ≈ 9,184 Btu/h."}],"misconceptions":["The combustion blower and convection blower are the same — exhaust vs. room air.","Because pellets are powered, any vent route length is fine — EVL limits apply.","Utility-grade pellets work in any stove — high ash may not suit the appliance."],"src":["S09","HYPO"],"manualCheck":"Record the manual's fuel grade table (it may predate the 2017 PFI spec) and any example vent table.","segments":["[Chapter 15. Pellet systems: fuel, feed, airflow and venting.] [pause 1s]\n\nIn this lesson you will learn to: Interpret P-F-I fuel grades and fuel quality effects (ash, fines, moisture); Calculate input and burn time from feed rate and heating value; Explain hopper, auger, burn pot, combustion and convection blowers, sensors and switches; Explain pellet venting, equivalent length, altitude and power-outage considerations; Explain cleaning and shutdown sequences. [pause 1s]\n\nFuel quality. [pause 0.5s] The Pellet Fuels Institute grades residential pellets as Premium, Standard and Utility. Premium allows no more than 1 percent inorganic ash, Standard 2 percent and Utility 6 percent; moisture is limited to 8 percent for Premium and 10 percent for the others; fines at the mill gate are limited to half a percent for Premium and 1 percent for the others. Bulk density, diameter and durability are also specified. Heating value has no grade limit, but quality-marked bags state a guaranteed minimum. High ash fills burn pots and can form clinkers; fines can jam augers and change feed rate; wet pellets swell and crumble. Always use the fuel grade the appliance manufacturer specifies.\n\nFeed and combustion. [pause 0.5s] Pellets are stored in a hopper and metered by an auger driven by a gear motor into the burn pot. The controller sets feed rate — often by cycling the auger — to set heat output. Input equals feed rate times fuel heating value, and run time equals hopper contents divided by feed rate. Ignition is usually by an electric hot-air igniter. The combustion (exhaust) blower draws combustion air through the burn pot and pushes exhaust out the vent; the convection (room-air) blower moves room air across the heat exchanger. They are different blowers with different jobs.\n\nSensors and safeties. [pause 0.5s] A vacuum or pressure switch proves that the combustion blower is moving air through the system; if the door is open, the vent is blocked or the blower fails, the switch opens and the controller stops feeding fuel. Temperature sensors and high-limit switches stop feed on overheating. Many units monitor exhaust temperature to confirm ignition and flame-out. These devices are safeties and must never be bypassed.\n\nVenting. [pause 0.5s] Pellet appliances produce exhaust under positive pressure, so the vent must be gas-tight: the manufacturer specifies a listed pellet vent of a particular diameter. Vent tables limit equivalent length — each elbow and tee counts as several feet of straight pipe — and many manufacturers require a vertical rise to provide natural draft if power fails, reducing smoke spillage. Higher altitude and longer runs may require the larger diameter. Terminations need clearances to doors, windows, grade and walkways per the listing and code.\n\nPower, cleaning and shutdown. [pause 0.5s] Without electricity there is no feed and no combustion blower; some owners add battery backup units approved by the manufacturer. Owners clean the burn pot and ash pan as directed — daily or by fuel use — while service technicians clean blowers, heat exchanger passages and the vent annually or by tonnage. On shutdown the auger stops first and the combustion blower keeps running to burn out the remaining fuel and cool the unit.\n\nWorked example 1. 40-lb bag, feed 1.6 pounds per hour, pellets 8,200 B-T-U per pound (hypothetical). Input and run time? [pause 3s — try it before the answer] Here is the solution. Input = 1.6 times 8,200 = 13,120 B-T-U per hour. Time = 40 divided by 1.6 = 25 hours.\n\nWorked example 2. Same stove at 70 percent efficiency. Output? [pause 3s — try it before the answer] Here is the solution. 13,120 times 0.70 about 9,184 B-T-U per hour.\n\nCommon misconceptions. Misconception: The combustion blower and convection blower are the same — exhaust vs. room air. Misconception: Because pellets are powered, any vent route length is fine — E-V-L limits apply. Misconception: Utility-grade pellets work in any stove — high ash may not suit the appliance.\n\nQuick check. Pause the audio and answer: Interpret P-F-I fuel grades and fuel quality effects (ash, fines, moisture). [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":714,"estSecs":306},{"id":"ch16-01","chapter":16,"title":"Other appliances and accessories","objectives":["Calculate electric heat output and current for simple resistive loads.","Explain electric fireplace listings, circuit and clearance considerations.","Apply media, door, screen and barrier compatibility rules.","Explain heat-management kits and indoor/outdoor listing limits."],"sections":[{"h":"Electric hearth products","body":"Electric fireplaces have no combustion, but their heaters, motors and lights draw current. A typical 120-volt plug-in heater is limited to around 1,500 watts, about 5,100 Btu per hour; hard-wired 240-volt units can deliver more. Current equals power divided by voltage, so 1,500 watts at 120 volts is 12.5 amps. Electric room heaters are listed to standards such as UL 1278 (movable or wall-hung) or UL 2021 (fixed). The installation manual specifies circuit, clearances, framing and whether the unit may be installed in a wall or under a television."},{"h":"Media, logs and doors","body":"Gas logs, glass, stones and embers are part of the gas appliance's tested configuration. Changing media type, quantity or placement can change flame pattern, cause sooting or carbon monoxide, or overheat components. Use only media listed for that appliance. Glass doors and screens for wood fireplaces must be listed or approved for that fireplace; some factory-built fireplaces specify which doors may be used and whether the doors must be open or closed in operation."},{"h":"Heat management","body":"Heat-management kits and fans relocate heat — through ducts to other rooms or up and out of the room's upper wall area — to reduce wall and mantel temperatures above a fireplace. Only kits listed for that model maintain the listing, and they work within, not instead of, its clearances."},{"h":"Indoor versus outdoor","body":"Outdoor gas fireplaces and fire features are listed for open-air use (for example, under ANSI Z21.97 for outdoor decorative gas appliances). An enclosed porch, sunroom or conservatory is not 'outdoors' unless the listing and code definitions of open space are met. Indoor appliances, conversely, are not built for weather exposure. Accessory choices — covers, wind guards, glass — must be compatible with the specific listing."}],"worked":[{"q":"A 240 V electric insert draws 4,000 W at full heat. Current and Btu/h?","a":"I = 4,000 ÷ 240 ≈ 16.7 A (teaching value — the electrician sizes the circuit). Heat = 4,000 × 3.412 ≈ 13,648 Btu/h."}],"misconceptions":["Electric fireplaces need no planning — circuits, clearances and framing still apply.","Glass media is interchangeable with logs — only if listed for that burner.","A screened porch counts as outdoors for any outdoor appliance — check the listing and code definition."],"src":["S12","S13","S16","HYPO"],"manualCheck":"Find the manual's examples of electric output and accessory guidance.","segments":["[Chapter 16. Other appliances and accessories.] [pause 1s]\n\nIn this lesson you will learn to: Calculate electric heat output and current for simple resistive loads; Explain electric fireplace listings, circuit and clearance considerations; Apply media, door, screen and barrier compatibility rules; Explain heat-management kits and indoor/outdoor listing limits. [pause 1s]\n\nElectric hearth products. [pause 0.5s] Electric fireplaces have no combustion, but their heaters, motors and lights draw current. A typical 120-volt plug-in heater is limited to around 1,500 watts, about 5,100 B-T-U per hour; hard-wired 240-volt units can deliver more. Current equals power divided by voltage, so 1,500 watts at 120 volts is 12.5 amps. Electric room heaters are listed to standards such as U-L 1278 (movable or wall-hung) or U-L 2021 (fixed). The installation manual specifies circuit, clearances, framing and whether the unit may be installed in a wall or under a television.\n\nMedia, logs and doors. [pause 0.5s] Gas logs, glass, stones and embers are part of the gas appliance's tested configuration. Changing media type, quantity or placement can change flame pattern, cause sooting or carbon monoxide, or overheat components. Use only media listed for that appliance. Glass doors and screens for wood fireplaces must be listed or approved for that fireplace; some factory-built fireplaces specify which doors may be used and whether the doors must be open or closed in operation.\n\nHeat management. [pause 0.5s] Heat-management kits and fans relocate heat — through ducts to other rooms or up and out of the room's upper wall area — to reduce wall and mantel temperatures above a fireplace. Only kits listed for that model maintain the listing, and they work within, not instead of, its clearances.\n\nIndoor versus outdoor. [pause 0.5s] Outdoor gas fireplaces and fire features are listed for open-air use (for example, under ANSI Z21.97 for outdoor decorative gas appliances). An enclosed porch, sunroom or conservatory is not 'outdoors' unless the listing and code definitions of open space are met. Indoor appliances, conversely, are not built for weather exposure. Accessory choices — covers, wind guards, glass — must be compatible with the specific listing.\n\nWorked example 1. A 240 volts electric insert draws 4,000 watts at full heat. Current and B-T-U per hour? [pause 3s — try it before the answer] Here is the solution. I = 4,000 divided by 240 about 16.7 amps (teaching value — the electrician sizes the circuit). Heat = 4,000 times 3.412 about 13,648 B-T-U per hour.\n\nCommon misconceptions. Misconception: Electric fireplaces need no planning — circuits, clearances and framing still apply. Misconception: Glass media is interchangeable with logs — only if listed for that burner. Misconception: A screened porch counts as outdoors for any outdoor appliance — check the listing and code definition.\n\nQuick check. Pause the audio and answer: Calculate electric heat output and current for simple resistive loads. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":514,"estSecs":220}],"formulas":[{"id":"F01","chapter":7,"name":"Useful output from input","formula":"Output (Btu/h) = Input (Btu/h) × Efficiency (decimal)","units":"Btu/h","assumptions":"Efficiency must be the overall (steady-state or tested) value on the same heating-value basis as the input.","example":"Input 30,000 Btu/h at 72% → 30,000 × 0.72 = 21,600 Btu/h.","source":"HYPO","status":"General principle; example hypothetical"},{"id":"F02","chapter":7,"name":"Required input for a target output","formula":"Input = Output ÷ Efficiency","units":"Btu/h","assumptions":"Same basis as F01. Rounding up is conservative for sizing discussions; real sizing uses a heat-loss calculation.","example":"Need 18,000 Btu/h delivered at 60% → 18,000 ÷ 0.60 = 30,000 Btu/h input.","source":"HYPO","status":"General principle; example hypothetical"},{"id":"F03","chapter":7,"name":"Efficiency from measured values","formula":"Efficiency (%) = Output ÷ Input × 100","units":"%","assumptions":"Both values must be rates (Btu/h) or both quantities (Btu) over the same period.","example":"14,000 Btu/h out of 20,000 Btu/h in → 70%.","source":"HYPO","status":"General principle"},{"id":"F04","chapter":7,"name":"Overall efficiency","formula":"Overall = Combustion efficiency × Heat-transfer efficiency","units":"decimal","assumptions":"Teaching model used in hearth training; official test methods define efficiency differently — compare only like-for-like ratings.","example":"0.90 combustion × 0.80 transfer = 0.72 overall (72%).","source":"MANUAL","status":"Check manual's exact definition and wording"},{"id":"F05","chapter":7,"name":"Electric resistance heat","formula":"Btu/h = Watts × 3.412 (1 kW = 3,412 Btu/h)","units":"Btu/h","assumptions":"Resistive heating converts essentially all electrical input to heat in the room.","example":"1,500 W × 3.412 = 5,118 Btu/h.","source":"S13","status":"Verified conversion"},{"id":"F06","chapter":16,"name":"Power, voltage and current (resistive load)","formula":"P (W) = V × I ;  I = P ÷ V","units":"W, V, A","assumptions":"Teaching relationship for a simple resistive load. Not circuit design; follow the electrical code and listing for circuit sizing.","example":"1,500 W ÷ 120 V = 12.5 A.","source":"HYPO","status":"General principle"},{"id":"F07","chapter":7,"name":"Thermal resistance in series","formula":"R_total = R1 + R2 + … ;  R of a layer = thickness ÷ k (k per inch, consistent units)","units":"h·ft²·°F/Btu (per inch for k)","assumptions":"Only for layers in series with compatible units. A floor-protector requirement is satisfied only by the R-value the appliance listing specifies, using materials whose k or R is documented.","example":"Board with k = 0.84 per inch, 1/2 in. thick → R = 0.5 ÷ 0.84 ≈ 0.60. Two such boards → ≈ 1.19.","source":"HYPO","status":"Method general; material values hypothetical — use manufacturer data"},{"id":"F08","chapter":7,"name":"Btu definition","formula":"1 Btu = heat to raise 1 lb of water 1 °F","units":"Btu","assumptions":"Btu is a quantity of energy; Btu/h is a rate. 1 therm = 100,000 Btu.","example":"An appliance at 40,000 Btu/h for 3 h uses 120,000 Btu = 1.2 therms of fuel energy.","source":"S13","status":"Verified definition"},{"id":"F09","chapter":14,"name":"Gas consumption","formula":"Fuel rate = Input (Btu/h) ÷ Heating value (Btu per unit)","units":"ft³/h or gal/h","assumptions":"Use the supplier's actual heating value. US averages: natural gas ≈ 1,036 Btu/ft³; propane ≈ 91,452 Btu/gal (liquid). Training texts often round NG to 1,000 and propane vapor to ≈ 2,500 Btu/ft³.","example":"40,000 Btu/h ÷ 91,452 Btu/gal ≈ 0.44 gal/h propane.","source":"S13","status":"Verified EIA averages; rounded training values must be checked against the manual"},{"id":"F10","chapter":14,"name":"Pressure conversion","formula":"1 psi ≈ 27.7 in. w.c. ;  in. w.c. = psi × 27.7","units":"in. w.c., psi","assumptions":"Standard water column at room temperature.","example":"0.5 psi × 27.7 ≈ 13.9 in. w.c.","source":"HYPO","status":"Standard physical conversion (27.68)"},{"id":"F11","chapter":14,"name":"High-altitude input derate (common US practice)","formula":"Derated input = Sea-level input × (1 − 0.04 × elevation in thousands of ft)  — applied above 2,000 ft","units":"Btu/h","assumptions":"Only where the appliance instructions direct a derate. Many listings specify their own altitude method, orifice or kit; some utilities already reduce gas heating value.","example":"40,000 Btu/h at 5,000 ft → 40,000 × (1 − 0.20) = 32,000 Btu/h.","source":"S14","status":"Secondary source; listing governs"},{"id":"F12","chapter":13,"name":"Wood moisture — wet basis","formula":"MC_wet (%) = water mass ÷ total (wet) mass × 100","units":"%","assumptions":"Most fuel literature and many meters report a dry-basis value; always state the basis.","example":"10 lb log containing 2 lb water → 20% wet basis.","source":"HYPO","status":"General principle"},{"id":"F13","chapter":13,"name":"Wood moisture — dry basis","formula":"MC_dry (%) = water mass ÷ oven-dry wood mass × 100","units":"%","assumptions":"Same sample: 2 lb water in 8 lb dry wood is 25% dry basis but 20% wet basis.","example":"2 ÷ 8 × 100 = 25% dry basis.","source":"HYPO","status":"General principle"},{"id":"F14","chapter":13,"name":"Converting between moisture bases","formula":"MC_dry = MC_wet ÷ (1 − MC_wet) ;  MC_wet = MC_dry ÷ (1 + MC_dry)  (decimals)","units":"decimal","assumptions":"Derived from the two definitions.","example":"20% wet → 0.20 ÷ 0.80 = 25% dry.","source":"HYPO","status":"Derived algebra"},{"id":"F15","chapter":13,"name":"Cord volume","formula":"Full cord = 4 ft × 4 ft × 8 ft = 128 ft³ (stacked, including air space)","units":"ft³","assumptions":"'Face cord' / 'rick' are regional and NOT a legal full cord.","example":"A 4 × 8 ft stack of 16-in. pieces = 4 × 8 × 1.33 ≈ 43 ft³ ≈ 1/3 cord.","source":"MANUAL","status":"Standard definition — confirm wording in manual"},{"id":"F16","chapter":15,"name":"Pellet input from feed rate","formula":"Input (Btu/h) = Feed rate (lb/h) × Heating value (Btu/lb)","units":"Btu/h","assumptions":"Heating value varies by fuel; PFI sets no grade limit but bags state a guaranteed minimum HHV.","example":"2.0 lb/h × 8,000 Btu/lb = 16,000 Btu/h input.","source":"S09","status":"Method general; 8,000 Btu/lb is hypothetical"},{"id":"F17","chapter":15,"name":"Pellet burn time","formula":"Hours = Fuel mass (lb) ÷ Feed rate (lb/h)","units":"h","assumptions":"Constant feed; real controls modulate.","example":"60 lb hopper ÷ 2.5 lb/h = 24 h.","source":"HYPO","status":"General principle"},{"id":"F18","chapter":11,"name":"Equivalent vent length","formula":"EVL = Σ straight lengths + Σ (fitting count × manufacturer allowance per fitting)","units":"ft","assumptions":"Allowances and maximums are model-specific (e.g., some pellet tables count a 90° elbow as several feet). Altitude may require a larger diameter.","example":"HYPO table: 90° = 5 ft, 45° = 3 ft. 6 ft pipe + 2 × 90° + 1 tee(5 ft) → 6 + 10 + 5 = 21 ft.","source":"HYPO","status":"Method general; allowances hypothetical"},{"id":"F19","chapter":10,"name":"Masonry fireplace hearth extension (IRC)","formula":"Opening < 6 ft²: 16 in. front, 8 in. each side ;  Opening ≥ 6 ft²: 20 in. front, 12 in. each side","units":"in.","assumptions":"Applies to masonry fireplaces under the adopted IRC. Factory-built fireplaces, stoves and inserts follow their listing.","example":"Opening 36 in. × 26 in. = 6.5 ft² → 20 in. front / 12 in. sides.","source":"S07","status":"Verified (model code; confirm local adoption)"},{"id":"F20","chapter":11,"name":"Masonry chimney termination ('3-2-10')","formula":"Top ≥ 3 ft above highest point of roof penetration AND ≥ 2 ft above any part of the building within 10 ft horizontally","units":"ft","assumptions":"Masonry/solid-fuel chimneys. Gas B-vent and direct-vent terminations follow different tables and the listing.","example":"Ridge is 8 ft above the penetration and 6 ft away → chimney must reach ≥ 10 ft above penetration (8 + 2).","source":"S08","status":"Verified via secondary summary of IRC R1003.9"},{"id":"F21","chapter":11,"name":"Masonry flue sizing ratio (teaching rule)","formula":"Flue area ≈ 1/10 (rectangular) or 1/12 (round) of fireplace opening area","units":"in²","assumptions":"Historic IRC/NFPA ratio method for site-built masonry fireplaces; code also offers table methods. Not used for factory-built systems.","example":"Opening 36 × 28 = 1,008 in² → round flue ≥ 84 in² (≈ 10.3 in. dia).","source":"MANUAL","status":"NOT verified this session — check manual/adopted code"},{"id":"F22","chapter":10,"name":"Area of a floor protector","formula":"Area = (stove depth + front extension + rear) × (stove width + 2 × side extension)","units":"in² or ft²","assumptions":"Extensions come only from the appliance listing (and for loading doors, the door opening). Convert in² ÷ 144 = ft².","example":"HYPO stove 24 × 24 in., listing: 16 in. front, 8 in. sides, 0 rear → (24+16) × (24+16) = 1,600 in² ≈ 11.1 ft².","source":"HYPO","status":"Method general; dimensions hypothetical"}],"flashcards":[{"id":"FQ-T0001","chapter":6,"front":"In complete combustion of methane, which products are expected?","back":"Carbon dioxide and water — Complete oxidation of methane produces CO₂ and H₂O; heat is released.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0002","chapter":6,"front":"Which equation balances complete methane combustion?","back":"CH₄ + 2O₂ → CO₂ + 2H₂O — The balanced reaction conserves one carbon, four hydrogen and four oxygen atoms.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0003","chapter":6,"front":"What is theoretical combustion air?","back":"Minimum air needed for complete combustion of the fuel — Theoretical air supplies the stoichiometric oxygen requirement.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0004","chapter":6,"front":"Which effect can excessive combustion air have?","back":"Increase heat lost with exhaust — Additional air can carry heat out of the system; adequate mixing and temperature still matter.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0005","chapter":6,"front":"What is the main role of secondary air in a wood appliance?","back":"Support oxidation of unburned combustible gases — Secondary air helps burn gases released above the fuel bed.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0006","chapter":6,"front":"What is pyrolysis?","back":"Thermal decomposition that releases combustible gases from wood — Heating wood breaks down its constituents and produces gases and char.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0007","chapter":6,"front":"Which condition most directly promotes incomplete combustion?","back":"Poor fuel-air mixing and inadequate oxygen — Incomplete combustion can produce CO and soot.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0008","chapter":6,"front":"How does autoignition differ from flash point?","back":"Autoignition occurs without an external ignition source — Flash point concerns ignitable vapor from a liquid with an ignition source; autoignition concerns spontaneous ignition under specified conditions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0009","chapter":6,"front":"Why does a wet wood charge often lower combustion temperature?","back":"Energy is consumed evaporating water — Evaporation requires energy that would otherwise heat the system.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0010","chapter":7,"front":"What distinguishes HHV from LHV?","back":"HHV includes heat recoverable by condensing combustion water vapor — Heating value basis changes the denominator of an efficiency calculation.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0011","chapter":7,"front":"Heat through a steel fastener into framing is primarily what mode?","back":"Conduction — Conduction transfers energy through a material by temperature difference.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0012","chapter":7,"front":"A hot glass panel warms someone several feet away primarily by what mode?","back":"Radiation — Radiant energy travels across space without requiring contact.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0013","chapter":7,"front":"What is the role of a room-air convection blower?","back":"Distribute heat by moving air — A convection blower circulates room air across heated surfaces.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0014","chapter":7,"front":"Which value is needed alongside fuel input to calculate useful heat output?","back":"Overall efficiency on a compatible basis — Output equals input multiplied by overall efficiency as a decimal.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0015","chapter":7,"front":"When can two published efficiency percentages be directly compared?","back":"When test definitions and heating-value bases are compatible — Different rating methods may yield different percentages for similar performance.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0016","chapter":7,"front":"What does a higher R-value indicate?","back":"Greater thermal resistance — R measures resistance to heat flow; for layers in series, compatible R-values add.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0017","chapter":8,"front":"What distinguishes a freestanding stove from an insert?","back":"An insert is designed for an approved existing fireplace opening — The installation form and listing determine how and where it may be used.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0018","chapter":8,"front":"Which description best fits a factory-built fireplace?","back":"A manufactured listed assembly with specified compatible components — Factory-built systems must retain their evaluated configurations.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0019","chapter":8,"front":"Which appliance generally uses separate paths for outside combustion air and exhaust?","back":"Direct vent gas fireplace — Direct vent systems are designed to isolate combustion air from room air.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0020","chapter":8,"front":"A customer wants to use a decorative gas log set as primary heat. What should be compared?","back":"Its tested intended use and useful heat output versus a listed heater — Decorative products and heaters have different design and rating purposes.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0021","chapter":8,"front":"Which feature distinguishes an electric resistance fireplace from gas equipment?","back":"No fuel combustion exhaust — Electric appliances may need electrical and clearance checks but do not combust fuel.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0022","chapter":9,"front":"Which standard addresses fuel gas installation?","back":"NFPA 54 — NFPA 54 is the National Fuel Gas Code; confirm the locally adopted code and edition.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0023","chapter":9,"front":"Which standard addresses chimneys, fireplaces, vents and solid fuel-burning appliances?","back":"NFPA 211 — NFPA 211 addresses these systems; exact requirements depend on adoption and application.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0024","chapter":9,"front":"Which safety standard is associated with factory-built fireplaces?","back":"UL 127 — UL 127 covers factory-built fireplaces.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0025","chapter":9,"front":"Which safety standard is associated with solid-fuel room heaters?","back":"UL 1482 — UL 1482 concerns solid-fuel room heaters.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0026","chapter":9,"front":"Which safety standard is associated with factory-built chimneys?","back":"UL 103 — UL 103 addresses factory-built chimneys.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0027","chapter":9,"front":"Which standard is associated with gas vents?","back":"UL 441 — UL 441 covers gas vents; select a vent approved for the appliance.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0028","chapter":9,"front":"Which distinction is correct?","back":"EPA emissions certification is not a safety listing — Emissions and safety evaluation serve separate purposes.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0029","chapter":9,"front":"What is an AHJ?","back":"Authority having jurisdiction — The AHJ administers applicable local requirements.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0030","chapter":9,"front":"What makes a model listing different from a building code?","back":"A listing evaluates a product for defined conditions of use — Codes regulate installation; listings establish evaluated product conditions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0031","chapter":10,"front":"What is the primary difference between ember and thermal floor protection?","back":"Ember protection blocks sparks; thermal protection limits heat transfer — A model may require one or both; verify construction and dimensions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0032","chapter":10,"front":"Why must framing be evaluated behind stone facing?","back":"Combustible framing remains combustible even if covered — Clearance requirements may apply to concealed combustible material.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0033","chapter":10,"front":"Which information is essential to gas pipe sizing?","back":"Total connected load, supply pressure, allowable drop, fuel and developed length — Use applicable fuel gas tables and qualified design; demand and pressure losses matter.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0034","chapter":10,"front":"What is a hearth extension intended to protect?","back":"Floor area outside the firebox opening from heat and embers — Requirements depend on construction, opening and listing.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0035","chapter":10,"front":"Why should mantel projection be documented?","back":"Projection can change required separation from hot surfaces — Use the model's approved mantel clearance diagram.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0036","chapter":10,"front":"A clearance is generally measured to what?","back":"The nearest combustible material specified by the applicable rule — Confirm the specific reference point in the installation documents.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0037","chapter":11,"front":"What generates natural chimney draft?","back":"Density difference between warm flue gases and surrounding air — Buoyancy drives a pressure difference influenced by height and temperature.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0038","chapter":11,"front":"Why can a very cold flue weaken draft?","back":"It cools flue gases and reduces buoyancy — Cooling reduces the density difference and may encourage condensation.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0039","chapter":11,"front":"What is backdrafting?","back":"Reversal of intended exhaust flow — Reverse flow can draw combustion products into occupied space.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0040","chapter":11,"front":"Which building condition may increase the risk of spillage?","back":"A powerful exhaust hood with inadequate makeup air — Building depressurization can compete with natural draft.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0041","chapter":11,"front":"What does the common 3-2-10 roof termination rule express?","back":"3 ft above penetration and 2 ft above building portions within 10 horizontal ft — This is a common chimney roof rule; verify exact applicability and exceptions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0042","chapter":11,"front":"Why is chimney connector not a substitute for listed chimney?","back":"Its tested function and penetration conditions differ — Connector and chimney serve different purposes; use approved penetration assemblies.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0043","chapter":11,"front":"What is a coaxial direct vent pipe?","back":"Nested passages for combustion air and exhaust — Coaxial venting uses concentric paths, as specified by the listing.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0044","chapter":11,"front":"Why do elbows matter when planning a vent route?","back":"They add flow resistance and may count toward equivalent length — Manufacturer vent tables account for fittings and layout.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0045","chapter":11,"front":"Which vent family is intended only for compatible gas appliances?","back":"Type B gas vent — Type B vent is not a universal vent for all fuels.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0046","chapter":12,"front":"Which condition requires emergency action rather than routine appliance maintenance?","back":"A sounding carbon monoxide alarm — Leave for fresh air and follow emergency guidance; do not troubleshoot an active CO hazard.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0047","chapter":12,"front":"Why can damaged sealed glass on a direct vent appliance be significant?","back":"It may compromise the combustion enclosure — The glass and gasket can be functional parts of the tested assembly.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0048","chapter":12,"front":"Which instruction belongs in a pellet owner handoff?","back":"How to clean the burn pot and dispose of ash as specified — Owner service must remain within prescribed operating and maintenance tasks.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0049","chapter":13,"front":"What is the volume of a full cord of stacked firewood?","back":"128 cubic feet — A nominal 4 × 4 × 8 ft stack has 128 cubic feet including air spaces.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0050","chapter":13,"front":"Which measurement location is recommended for assessing firewood moisture?","back":"Freshly split interior surface — EPA advises testing the interior of freshly split wood using the meter instructions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0051","chapter":13,"front":"What is the EPA general target for best wood burning?","back":"Below 20% moisture — EPA Burn Wise recommends dry firewood below 20%; follow fuel and meter guidance.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0052","chapter":13,"front":"What is the purpose of a catalytic combustor?","back":"Promote oxidation of combustible smoke at lower temperature — A coated catalyst lowers the temperature needed for oxidation of combustible gases and particles.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0053","chapter":13,"front":"How does a typical noncatalytic stove improve combustion?","back":"Insulated firebox, baffles and secondary air — These features promote hot, mixed gas-phase combustion.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0054","chapter":13,"front":"What is creosote?","back":"Combustible deposits associated with wood smoke — Unburned organic compounds can condense or deposit in cool flue passages.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0055","chapter":13,"front":"What can increase creosote formation?","back":"Cool flue gases and incomplete combustion — Moisture and low temperatures can favor deposits.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0056","chapter":13,"front":"What is measured by a wood heater emission rate in grams per hour?","back":"Mass of emitted pollutants per time — An emission rate is not a heat rating.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0057","chapter":13,"front":"Which chimney inspection level generally involves concealed areas when a hazard cannot otherwise be evaluated?","back":"Level 3 — Level 3 may require removal of concealed components; consult NFPA 211 for exact scope.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0058","chapter":14,"front":"What is the predominant constituent of typical natural gas?","back":"Methane — Natural gas composition varies, but methane usually predominates.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0059","chapter":14,"front":"What is approximate specific gravity of propane vapor relative to air?","back":"1.5 — Propane vapor is heavier than air; natural gas is typically around 0.6.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0060","chapter":14,"front":"Which approximate value represents 1 psi in inches of water column?","back":"27.7 in. w.c. — 1 psi is about 27.7 inches of water column under standard conversion conditions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0061","chapter":14,"front":"What instrument measures low gas pressures?","back":"Manometer — A manometer measures pressure difference.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0062","chapter":14,"front":"What is inlet pressure?","back":"Gas supply pressure at the appliance connection — Inlet and manifold pressures are distinct measurement points.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0063","chapter":14,"front":"Why is operating pressure under load informative?","back":"It can reveal supply pressure drop during flow — Pressure can drop when gas demand exposes supply or piping limitations.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0064","chapter":14,"front":"What does a burner orifice do?","back":"Meters fuel through a specified opening — The orifice is selected for the approved fuel and burner design.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0065","chapter":14,"front":"Which ignition method lights the main burner directly using a spark?","back":"Direct spark ignition — DSI uses spark at the main burner on approved designs.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0066","chapter":14,"front":"Which control produces a small voltage from a heated junction?","back":"Thermocouple — A thermocouple uses the thermoelectric effect; a thermopile combines multiple junctions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0067","chapter":14,"front":"What distinguishes a thermopile from a single thermocouple?","back":"Multiple junctions typically produce greater voltage — Thermopiles are used in some millivolt control systems.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0068","chapter":14,"front":"What is flame rectification used for?","back":"Electronic flame proving — A small current through the flame is used to confirm ignition in suitable electronic systems.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0069","chapter":14,"front":"What does an ODS pilot respond to?","back":"Specified oxygen depletion conditions — An oxygen depletion sensing pilot is not a CO detector.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0070","chapter":14,"front":"Which appliance typically releases combustion products into the room?","back":"Vent-free gas appliance — Vent-free appliances require their specific listing and jurisdictional permission.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0071","chapter":14,"front":"Which arrangement has separate parallel vent passages?","back":"Co-linear direct vent — Co-linear uses distinct passages, commonly in approved insert configurations.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0072","chapter":14,"front":"What can cause an electronic ignition control to enter lockout?","back":"Failure to prove flame within the designed sequence — Control logic may stop fuel or require reset when a required proof fails.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0073","chapter":15,"front":"What is the auger's primary function?","back":"Meter pellet fuel into the combustion area — Feed mechanisms meter solid fuel from the hopper.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0074","chapter":15,"front":"What is the combustion blower's main role?","back":"Move combustion air and exhaust through the intended path — It is distinct from the convection blower.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0075","chapter":15,"front":"What is the primary purpose of a pellet vacuum or pressure switch?","back":"Prove an expected pressure differential or draft condition — The switch is a safety interlock, not a gas analyzer.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0076","chapter":15,"front":"What are fines in a pellet fuel supply?","back":"Small loose particles from broken pellets — Fines can affect fuel handling and feeding.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0077","chapter":15,"front":"What are clinkers?","back":"Hardened or fused ash deposits — Fuel properties and combustion conditions may contribute to clinker formation.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0078","chapter":15,"front":"Why may an exhaust blower continue after fuel feeding stops?","back":"The controller is completing its designed cooling or shutdown cycle — Shutdown may include a controlled cool-down period.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0079","chapter":15,"front":"Which statement about equivalent vent length is accurate?","back":"Fitting allowances and limits are model-specific — Use the actual approved vent sizing instructions.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0080","chapter":15,"front":"How may dirty heat-exchange surfaces affect a pellet stove?","back":"Reduce useful heat transfer — Ash and deposits can insulate surfaces and reduce transfer.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0081","chapter":16,"front":"What is the primary purpose of an approved heat management kit?","back":"Redirect heat within the evaluated configuration — Only the listed design establishes permissible heat routing and clearances.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0082","chapter":16,"front":"Which relationship applies to a simple resistive electrical load?","back":"Power = voltage × current — Watts equal volts multiplied by amperes for a resistive load.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0083","chapter":16,"front":"Why is an outdoor listing not automatically appropriate for indoor use?","back":"The intended environment and ventilation requirements differ — Product approval is conditional on intended environment.","src":"legacy v3 drill","origin":"v3"},{"id":"FQ-T0084","chapter":16,"front":"What is a critical distinction between a glass wind guard and a contact barrier?","back":"A wind guard is not automatically an approved contact barrier — A protective barrier must meet the actual appliance's requirements.","src":"legacy v3 drill","origin":"v3"},{"id":"FC001","chapter":6,"front":"Fire triangle","back":"Fuel, oxygen and heat present together; remove or starve any one and combustion stops or degrades.","src":"HYPO","origin":"v4"},{"id":"FC002","chapter":6,"front":"Complete combustion of methane","back":"CH₄ + 2 O₂ → CO₂ + 2 H₂O + heat.","src":"HYPO","origin":"v4"},{"id":"FC003","chapter":6,"front":"Complete combustion of propane","back":"C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O + heat.","src":"HYPO","origin":"v4"},{"id":"FC004","chapter":6,"front":"Theoretical (stoichiometric) air","back":"The exact amount of air containing just enough oxygen for complete combustion.","src":"HYPO","origin":"v4"},{"id":"FC005","chapter":6,"front":"Excess air","back":"Air supplied beyond theoretical air to ensure complete combustion; too much carries heat up the vent.","src":"HYPO","origin":"v4"},{"id":"FC006","chapter":6,"front":"Primary air","back":"Air mixed with fuel before or at the point of ignition (venturi air; air into a wood fuel bed).","src":"HYPO","origin":"v4"},{"id":"FC007","chapter":6,"front":"Secondary air","back":"Air introduced after the primary flame zone to burn remaining gases (e.g., tubes under a stove baffle).","src":"HYPO","origin":"v4"},{"id":"FC008","chapter":6,"front":"Pyrolysis","back":"Thermal decomposition of wood into combustible gases, tars and char when heated.","src":"HYPO","origin":"v4"},{"id":"FC009","chapter":6,"front":"Char / coal stage","back":"After volatiles are released, carbon burns at the surface as glowing coals with little flame.","src":"HYPO","origin":"v4"},{"id":"FC010","chapter":6,"front":"Flash point","back":"Lowest temperature at which a liquid gives off enough vapor to ignite briefly with an ignition source present.","src":"HYPO","origin":"v4"},{"id":"FC011","chapter":6,"front":"Autoignition temperature","back":"Temperature at which a material ignites with no external flame or spark.","src":"HYPO","origin":"v4"},{"id":"FC012","chapter":6,"front":"Incomplete combustion","back":"Combustion stopped part-way by lack of oxygen, temperature, mixing or time; produces CO, soot, unburned hydrocarbons.","src":"HYPO","origin":"v4"},{"id":"FC013","chapter":6,"front":"Carbon monoxide (CO)","back":"Colorless, odorless toxic gas from partial oxidation of carbon; binds hemoglobin. Not detectable by sight or smell.","src":"HYPO","origin":"v4"},{"id":"FC014","chapter":6,"front":"The three Ts","back":"Temperature, turbulence (mixing) and time — conditions for complete combustion.","src":"HYPO","origin":"v4"},{"id":"FC015","chapter":6,"front":"Flame impingement","back":"Flame striking a cooler surface; quenches combustion, causing soot and possibly CO.","src":"HYPO","origin":"v4"},{"id":"FC016","chapter":6,"front":"Air composition (approx.)","back":"≈ 21% oxygen, ≈ 78% nitrogen by volume.","src":"HYPO","origin":"v4"},{"id":"FC017","chapter":7,"front":"Btu","back":"Heat to raise 1 lb of water by 1 °F — a quantity of energy.","src":"S13","origin":"v4"},{"id":"FC018","chapter":7,"front":"Btu/h","back":"A rate of energy use or delivery; the unit of appliance input and output ratings.","src":"S13","origin":"v4"},{"id":"FC019","chapter":7,"front":"Therm","back":"100,000 Btu.","src":"S13","origin":"v4"},{"id":"FC020","chapter":7,"front":"1 kWh in Btu","back":"3,412 Btu (so 1 kW ≈ 3,412 Btu/h).","src":"S13","origin":"v4"},{"id":"FC021","chapter":7,"front":"Input","back":"Rate at which fuel energy enters the appliance (Btu/h).","src":"HYPO","origin":"v4"},{"id":"FC022","chapter":7,"front":"Output","back":"Rate at which useful heat is delivered to the space = input × efficiency.","src":"HYPO","origin":"v4"},{"id":"FC023","chapter":7,"front":"Combustion efficiency","back":"How completely fuel is burned.","src":"HYPO","origin":"v4"},{"id":"FC024","chapter":7,"front":"Heat-transfer efficiency","back":"Share of produced heat transferred to the room rather than exhausted.","src":"HYPO","origin":"v4"},{"id":"FC025","chapter":7,"front":"Overall efficiency (teaching model)","back":"Combustion efficiency × heat-transfer efficiency.","src":"MANUAL","origin":"v4"},{"id":"FC026","chapter":7,"front":"HHV vs LHV","back":"HHV includes latent heat of condensing water vapor; LHV excludes it. Same performance looks higher on LHV basis.","src":"HYPO","origin":"v4"},{"id":"FC027","chapter":7,"front":"Conduction","back":"Heat transfer through or between materials in contact.","src":"HYPO","origin":"v4"},{"id":"FC028","chapter":7,"front":"Convection","back":"Heat carried by a moving fluid (air); natural (buoyancy) or forced (fan).","src":"HYPO","origin":"v4"},{"id":"FC029","chapter":7,"front":"Radiation","back":"Infrared energy crossing space and warming surfaces it strikes, without heating the air first.","src":"HYPO","origin":"v4"},{"id":"FC030","chapter":7,"front":"k-value","back":"Thermal conductivity, usually per inch; higher k = conducts more heat.","src":"HYPO","origin":"v4"},{"id":"FC031","chapter":7,"front":"R-value","back":"Thermal resistance; R = thickness ÷ k. Higher R = better insulator. Series layers add.","src":"HYPO","origin":"v4"},{"id":"FC032","chapter":7,"front":"Why ventilated shields work","back":"They block radiation and let air in the gap carry absorbed heat away by convection.","src":"HYPO","origin":"v4"},{"id":"FC033","chapter":8,"front":"Masonry fireplace","back":"Site-built of brick/block/stone; requirements come from the adopted building code.","src":"HYPO","origin":"v4"},{"id":"FC034","chapter":8,"front":"Factory-built fireplace","back":"Manufactured, listed system tested with specific components and clearances (solid fuel: UL 127).","src":"S16","origin":"v4"},{"id":"FC035","chapter":8,"front":"Fireplace insert","back":"Appliance designed and listed to install into an existing approved fireplace, usually with a liner.","src":"HYPO","origin":"v4"},{"id":"FC036","chapter":8,"front":"Freestanding stove","back":"Room heater on a protected floor connected to a chimney; wood units listed e.g. UL 1482 or UL 737.","src":"S16","origin":"v4"},{"id":"FC037","chapter":8,"front":"Direct vent","back":"Sealed combustion: outside air in and exhaust out through a sealed coaxial or co-linear system.","src":"HYPO","origin":"v4"},{"id":"FC038","chapter":8,"front":"Coaxial vent","back":"Pipe within a pipe: exhaust inside, combustion air in the outer annulus.","src":"HYPO","origin":"v4"},{"id":"FC039","chapter":8,"front":"Co-linear vent","back":"Two parallel passages (e.g., two liners) for intake and exhaust.","src":"HYPO","origin":"v4"},{"id":"FC040","chapter":8,"front":"Natural-draft vented gas","back":"Uses room air for combustion; vents via B-vent or approved lined chimney by buoyancy.","src":"HYPO","origin":"v4"},{"id":"FC041","chapter":8,"front":"Vent-free gas appliance","back":"Releases combustion products into the room; uses ODS pilot; restricted in some jurisdictions.","src":"HYPO","origin":"v4"},{"id":"FC042","chapter":8,"front":"Decorative gas log set","back":"Gas burner/log assembly for an existing fireplace; generally decorative, not a rated heater.","src":"HYPO","origin":"v4"},{"id":"FC043","chapter":8,"front":"Radiant appliance","back":"Delivers heat mainly by radiation from hot surfaces.","src":"HYPO","origin":"v4"},{"id":"FC044","chapter":8,"front":"Circulating appliance","back":"Room air passes through a jacket/heat exchanger (often with a blower) delivering convective heat.","src":"HYPO","origin":"v4"},{"id":"FC04
