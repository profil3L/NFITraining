5","chapter":8,"front":"Electric fireplace","back":"No combustion or vent; still has electrical, clearance and listing requirements.","src":"HYPO","origin":"v4"},{"id":"FC046","chapter":9,"front":"Code","back":"Minimum requirements written to be adopted into law (e.g., IRC, IFGC).","src":"HYPO","origin":"v4"},{"id":"FC047","chapter":9,"front":"Standard","back":"Document defining how to build, test or install; enforceable only when adopted or referenced.","src":"HYPO","origin":"v4"},{"id":"FC048","chapter":9,"front":"AHJ","back":"Authority having jurisdiction — the official/office that enforces requirements and approves installations.","src":"HYPO","origin":"v4"},{"id":"FC049","chapter":9,"front":"Listing","back":"Publication by a testing lab that a product meets a standard for conditions in its instructions.","src":"HYPO","origin":"v4"},{"id":"FC050","chapter":9,"front":"Label","back":"Mark on the product identifying listing and ratings.","src":"HYPO","origin":"v4"},{"id":"FC051","chapter":9,"front":"NFPA 211","back":"Standard for Chimneys, Fireplaces, Vents, and Solid Fuel-Burning Appliances (current edition 2027).","src":"S11","origin":"v4"},{"id":"FC052","chapter":9,"front":"NFPA 54 / ANSI Z223.1","back":"National Fuel Gas Code (current edition 2024).","src":"S10","origin":"v4"},{"id":"FC053","chapter":9,"front":"UL 127","back":"Factory-built fireplaces.","src":"S16","origin":"v4"},{"id":"FC054","chapter":9,"front":"UL 1482","back":"Solid-fuel type room heaters.","src":"S16","origin":"v4"},{"id":"FC055","chapter":9,"front":"UL 737","back":"Fireplace stoves (Ed. 11, 2025).","src":"S16","origin":"v4"},{"id":"FC056","chapter":9,"front":"UL 103","back":"Factory-built chimneys (residential and building heating appliance).","src":"S16","origin":"v4"},{"id":"FC057","chapter":9,"front":"UL 441","back":"Gas vents (Type B).","src":"S16","origin":"v4"},{"id":"FC058","chapter":9,"front":"UL 1777","back":"Chimney liners.","src":"S16","origin":"v4"},{"id":"FC059","chapter":9,"front":"UL 1618","back":"Wall protectors, floor protectors and hearth extensions.","src":"S15","origin":"v4"},{"id":"FC060","chapter":9,"front":"ASTM E1509","back":"Pellet fuel-burning room heaters.","src":"S16","origin":"v4"},{"id":"FC061","chapter":9,"front":"CSA/ANSI Z21.88 / CSA 2.33","back":"Vented gas fireplace heaters.","src":"S12","origin":"v4"},{"id":"FC062","chapter":9,"front":"CSA/ANSI Z21.50 / CSA 2.22","back":"Vented gas fireplaces.","src":"S12","origin":"v4"},{"id":"FC063","chapter":9,"front":"CSA/ANSI Z21.60 / CSA 2.26","back":"Decorative gas appliances for installation in solid-fuel burning fireplaces.","src":"S12","origin":"v4"},{"id":"FC064","chapter":9,"front":"EPA 2020 wood heater limit","back":"2.0 g/h (crib wood test) or 2.5 g/h (cord wood test) particulate.","src":"S05","origin":"v4"},{"id":"FC065","chapter":9,"front":"EPA certification vs listing","back":"Emissions certification ≠ safety listing; a wood heater needs both.","src":"S05","origin":"v4"},{"id":"FC066","chapter":9,"front":"Adopted edition rule","back":"Only the code edition (and amendments) adopted by the jurisdiction is enforceable.","src":"HYPO","origin":"v4"},{"id":"FC067","chapter":10,"front":"Clearance to combustibles","back":"Minimum air space from a specified reference point of an appliance/vent to the nearest combustible.","src":"HYPO","origin":"v4"},{"id":"FC068","chapter":10,"front":"Combustible behind noncombustible facing","back":"Still combustible — heat conducts through facing; framing clearances still apply.","src":"HYPO","origin":"v4"},{"id":"FC069","chapter":10,"front":"Type 1 floor protector","back":"Ember protection — continuous noncombustible surface.","src":"S15","origin":"v4"},{"id":"FC070","chapter":10,"front":"Type 2 floor protector","back":"Thermal protection of the combustible floor, often specified by R-value.","src":"S15","origin":"v4"},{"id":"FC071","chapter":10,"front":"IRC hearth extension < 6 ft² opening","back":"16 in. in front, 8 in. beyond each side (masonry fireplaces).","src":"S07","origin":"v4"},{"id":"FC072","chapter":10,"front":"IRC hearth extension ≥ 6 ft² opening","back":"20 in. in front, 12 in. beyond each side (masonry fireplaces).","src":"S07","origin":"v4"},{"id":"FC073","chapter":10,"front":"IRC masonry hearth slab thickness","back":"4 in.","src":"S07","origin":"v4"},{"id":"FC074","chapter":10,"front":"Hearth extension for factory-built","back":"Per the appliance listing, not the masonry table.","src":"S07","origin":"v4"},{"id":"FC075","chapter":10,"front":"Reduced-clearance shield","back":"Noncombustible shield on noncombustible spacers with ventilated air gap, as code/listing permits.","src":"HYPO","origin":"v4"},{"id":"FC076","chapter":10,"front":"Mantel clearance diagram","back":"Allowable projection usually increases with height above the opening — read the exact diagram.","src":"HYPO","origin":"v4"},{"id":"FC077","chapter":10,"front":"Service access","back":"Required access to valves, blowers, controls — design it in before finishes.","src":"HYPO","origin":"v4"},{"id":"FC078","chapter":10,"front":"Gas pipe sizing inputs","back":"Total connected load, developed length, fuel, supply pressure, allowable drop.","src":"HYPO","origin":"v4"},{"id":"FC079","chapter":10,"front":"Structural load check","back":"Heavy masonry/stone on framed floors may need engineering review.","src":"HYPO","origin":"v4"},{"id":"FC080","chapter":11,"front":"Natural draft","back":"Pressure difference from buoyant hot flue gases vs cooler outside air.","src":"HYPO","origin":"v4"},{"id":"FC081","chapter":11,"front":"Draft increases with","back":"Taller chimney, hotter flue gases, colder outside air, properly sized warm flue.","src":"HYPO","origin":"v4"},{"id":"FC082","chapter":11,"front":"Stack effect","back":"Warm indoor air rising and leaking out high; lower house levels become negative in cold weather.","src":"HYPO","origin":"v4"},{"id":"FC083","chapter":11,"front":"Spillage","back":"Temporary escape of flue products into the room (often at startup).","src":"HYPO","origin":"v4"},{"id":"FC084","chapter":11,"front":"Backdrafting","back":"Reversal of the intended vent flow, pulling products into the house.","src":"HYPO","origin":"v4"},{"id":"FC085","chapter":11,"front":"Makeup air","back":"Air supplied to replace air removed by exhaust equipment; reduces depressurization.","src":"HYPO","origin":"v4"},{"id":"FC086","chapter":11,"front":"3-2-10 rule","back":"Masonry chimney ≥ 3 ft above roof penetration and ≥ 2 ft above any building part within 10 ft.","src":"S08","origin":"v4"},{"id":"FC087","chapter":11,"front":"Chimney connector","back":"Pipe from solid-fuel appliance to chimney; not a chimney; needs listed pass-throughs.","src":"HYPO","origin":"v4"},{"id":"FC088","chapter":11,"front":"Type B vent","back":"Gas vent for listed Category I gas appliances only; never wood or pellets.","src":"S16","origin":"v4"},{"id":"FC089","chapter":11,"front":"Pellet vent","back":"Sealed, gas-tight vent specified by the pellet appliance maker; exhaust is positive pressure.","src":"HYPO","origin":"v4"},{"id":"FC090","chapter":11,"front":"Equivalent vent length","back":"Straight lengths plus fitting allowances; compare with the listed maximum.","src":"HYPO","origin":"v4"},{"id":"FC091","chapter":11,"front":"Oversized flue","back":"Gases slow and cool → weak draft, condensation, creosote.","src":"HYPO","origin":"v4"},{"id":"FC092","chapter":11,"front":"Manometer","back":"Instrument measuring small pressure differences (draft, gas pressure) in in. w.c.","src":"HYPO","origin":"v4"},{"id":"FC093","chapter":12,"front":"CO alarm sounding","back":"Evacuate to fresh air and call emergency services; don't troubleshoot.","src":"HYPO","origin":"v4"},{"id":"FC094","chapter":12,"front":"Gas odor response","back":"No switches, flames or phones in the area; leave and call utility/911 from outside.","src":"HYPO","origin":"v4"},{"id":"FC095","chapter":12,"front":"Ash disposal","back":"Metal can with tight lid, on noncombustible surface, away from the building; embers can last days.","src":"HYPO","origin":"v4"},{"id":"FC096","chapter":12,"front":"Chimney fire signs","back":"Roaring sound, dense smoke, sparks/flames at top — evacuate, call fire dept, Level II inspection before reuse.","src":"S11","origin":"v4"},{"id":"FC097","chapter":12,"front":"Hot surfaces","back":"Glass and surrounds remain hot after shutdown; barriers required by the model must stay installed.","src":"HYPO","origin":"v4"},{"id":"FC098","chapter":12,"front":"Owner handoff essentials","back":"Model-specific manual, operation, maintenance tasks, fuel, alarms, service contacts, model/serial record.","src":"HYPO","origin":"v4"},{"id":"FC099","chapter":12,"front":"Safety device bypass","back":"Never coach or perform; route to qualified service.","src":"HYPO","origin":"v4"},{"id":"FC100","chapter":13,"front":"Full cord","back":"4 × 4 × 8 ft = 128 ft³ stacked.","src":"MANUAL","origin":"v4"},{"id":"FC101","chapter":13,"front":"Face cord / rick","back":"One row of a stack 4 ft high × 8 ft long × piece length; a fraction of a cord.","src":"HYPO","origin":"v4"},{"id":"FC102","chapter":13,"front":"EPA firewood moisture target","back":"Below 20% moisture; test a freshly split face.","src":"S06","origin":"v4"},{"id":"FC103","chapter":13,"front":"Seasoning time (EPA guidance)","back":"About 6 months for softwoods and at least 12 months for hardwoods, split and stacked.","src":"S06","origin":"v4"},{"id":"FC104","chapter":13,"front":"Wet-basis moisture","back":"Water ÷ total wet mass × 100.","src":"HYPO","origin":"v4"},{"id":"FC105","chapter":13,"front":"Dry-basis moisture","back":"Water ÷ oven-dry mass × 100 (larger number than wet basis).","src":"HYPO","origin":"v4"},{"id":"FC106","chapter":13,"front":"Noncatalytic stove","back":"Insulated firebox, baffle and preheated secondary air burn smoke in the firebox.","src":"HYPO","origin":"v4"},{"id":"FC107","chapter":13,"front":"Catalytic combustor","back":"Coated element that lets smoke oxidize at lower temperature; needs bypass damper and replacement over time.","src":"HYPO","origin":"v4"},{"id":"FC108","chapter":13,"front":"Hybrid stove","back":"Combines catalytic and secondary-air (noncatalytic) combustion.","src":"HYPO","origin":"v4"},{"id":"FC109","chapter":13,"front":"Creosote","back":"Combustible condensed tars/deposits from wood smoke on cool flue surfaces.","src":"HYPO","origin":"v4"},{"id":"FC110","chapter":13,"front":"Glazed creosote","back":"Hard, shiny, tar-like stage; hardest to remove; serious chimney-fire fuel.","src":"HYPO","origin":"v4"},{"id":"FC111","chapter":13,"front":"Level I inspection","back":"Readily accessible portions; routine annual check when nothing changed.","src":"S11","origin":"v4"},{"id":"FC112","chapter":13,"front":"Level II inspection","back":"Adds accessible attics/crawlspaces and internal (video) inspection; e.g., sale/transfer, relining, appliance/fuel change, after a chimney fire.","src":"S11","origin":"v4"},{"id":"FC113","chapter":13,"front":"Level III inspection","back":"Removal of components/building materials to reach concealed areas when a hazard is suspected.","src":"S11","origin":"v4"},{"id":"FC114","chapter":13,"front":"Insert liner","back":"Full-length listed liner sized to the insert outlet is commonly required.","src":"HYPO","origin":"v4"},{"id":"FC115","chapter":14,"front":"Natural gas composition","back":"Mostly methane.","src":"HYPO","origin":"v4"},{"id":"FC116","chapter":14,"front":"Natural gas specific gravity","back":"≈ 0.6 (lighter than air).","src":"HYPO","origin":"v4"},{"id":"FC117","chapter":14,"front":"Propane specific gravity","back":"≈ 1.5 (heavier than air; collects low).","src":"HYPO","origin":"v4"},{"id":"FC118","chapter":14,"front":"NG heating value (US avg)","back":"≈ 1,036 Btu/ft³ (training texts often round to 1,000).","src":"S13","origin":"v4"},{"id":"FC119","chapter":14,"front":"Propane heating value (liquid)","back":"≈ 91,452 Btu/gal (EIA); older texts use ≈ 91,500.","src":"S13","origin":"v4"},{"id":"FC120","chapter":14,"front":"Propane vapor heating value","back":"≈ 2,500 Btu/ft³ (rounded training value).","src":"MANUAL","origin":"v4"},{"id":"FC121","chapter":14,"front":"1 psi","back":"≈ 27.7 in. w.c.","src":"HYPO","origin":"v4"},{"id":"FC122","chapter":14,"front":"Inches of water column","back":"Pressure that supports a column of water that many inches high in a manometer.","src":"HYPO","origin":"v4"},{"id":"FC123","chapter":14,"front":"Inlet (supply) pressure","back":"Measured upstream of the appliance valve.","src":"HYPO","origin":"v4"},{"id":"FC124","chapter":14,"front":"Manifold (outlet) pressure","back":"Measured downstream of the valve regulator at the burner manifold.","src":"HYPO","origin":"v4"},{"id":"FC125","chapter":14,"front":"Static vs operating pressure","back":"No flow vs. with appliances firing; large drop indicates supply/piping limitation.","src":"HYPO","origin":"v4"},{"id":"FC126","chapter":14,"front":"Orifice","back":"Precisely sized opening metering gas into the burner; fuel-specific.","src":"HYPO","origin":"v4"},{"id":"FC127","chapter":14,"front":"Regulator","back":"Reduces and stabilizes gas pressure.","src":"HYPO","origin":"v4"},{"id":"FC128","chapter":14,"front":"Standing pilot","back":"Pilot that burns continuously.","src":"HYPO","origin":"v4"},{"id":"FC129","chapter":14,"front":"Thermocouple","back":"Single junction producing millivolts in flame; holds safety valve open.","src":"HYPO","origin":"v4"},{"id":"FC130","chapter":14,"front":"Thermopile","back":"Many thermocouple junctions in series; powers millivolt valve/switch without house power.","src":"HYPO","origin":"v4"},{"id":"FC131","chapter":14,"front":"Intermittent pilot ignition","back":"Pilot lit only on call for heat, then lights main burner.","src":"HYPO","origin":"v4"},{"id":"FC132","chapter":14,"front":"Direct spark ignition","back":"Spark lights main burner directly; flame then proven.","src":"HYPO","origin":"v4"},{"id":"FC133","chapter":14,"front":"Flame rectification","back":"Small current through flame proves ignition to an electronic control.","src":"HYPO","origin":"v4"},{"id":"FC134","chapter":14,"front":"Lockout","back":"Control shuts off gas and requires reset when flame isn't proven in time.","src":"HYPO","origin":"v4"},{"id":"FC135","chapter":14,"front":"ODS","back":"Oxygen depletion sensing pilot: shuts off when room O₂ drops; NOT a CO detector.","src":"HYPO","origin":"v4"},{"id":"FC136","chapter":14,"front":"Altitude derate (common US)","back":"≈ 4% per 1,000 ft (from sea level) when above 2,000 ft — only as the listing directs.","src":"S14","origin":"v4"},{"id":"FC137","chapter":14,"front":"Gas conversion","back":"Only with the manufacturer's listed kit by a qualified technician; relabel.","src":"HYPO","origin":"v4"},{"id":"FC138","chapter":15,"front":"PFI grades","back":"Premium, Standard, Utility (2017 spec).","src":"S09","origin":"v4"},{"id":"FC139","chapter":15,"front":"PFI ash limits","back":"Premium ≤ 1.0%, Standard ≤ 2.0%, Utility ≤ 6.0%.","src":"S09","origin":"v4"},{"id":"FC140","chapter":15,"front":"PFI moisture limits","back":"Premium ≤ 8%, Standard/Utility ≤ 10%.","src":"S09","origin":"v4"},{"id":"FC141","chapter":15,"front":"PFI fines limits","back":"Premium ≤ 0.50%, Standard/Utility ≤ 1.0% (at mill gate).","src":"S09","origin":"v4"},{"id":"FC142","chapter":15,"front":"PFI bulk density","back":"Premium 40–48 lb/ft³; Standard/Utility 38–48 lb/ft³.","src":"S09","origin":"v4"},{"id":"FC143","chapter":15,"front":"PFI pellet diameter","back":"0.230–0.285 in.","src":"S09","origin":"v4"},{"id":"FC144","chapter":15,"front":"Pellet heating value","back":"No grade limit; bag states guaranteed minimum HHV.","src":"S09","origin":"v4"},{"id":"FC145","chapter":15,"front":"Hopper","back":"Pellet storage feeding the auger.","src":"HYPO","origin":"v4"},{"id":"FC146","chapter":15,"front":"Auger","back":"Motor-driven screw metering pellets to the burn pot; feed rate sets heat.","src":"HYPO","origin":"v4"},{"id":"FC147","chapter":15,"front":"Burn pot","back":"Where pellets burn; air holes must stay clear.","src":"HYPO","origin":"v4"},{"id":"FC148","chapter":15,"front":"Combustion (exhaust) blower","back":"Pulls air through burn pot and pushes exhaust out the vent.","src":"HYPO","origin":"v4"},{"id":"FC149","chapter":15,"front":"Convection (room) blower","back":"Moves room air across the heat exchanger.","src":"HYPO","origin":"v4"},{"id":"FC150","chapter":15,"front":"Vacuum / pressure switch","back":"Proves combustion airflow/draft; opens to stop feed if lost.","src":"HYPO","origin":"v4"},{"id":"FC151","chapter":15,"front":"Clinker","back":"Fused ash lump that blocks burn-pot air holes.","src":"HYPO","origin":"v4"},{"id":"FC152","chapter":15,"front":"Fines","back":"Dust and broken pellet fragments that can disrupt feed.","src":"HYPO","origin":"v4"},{"id":"FC153","chapter":15,"front":"Pellet shutdown","back":"Auger stops; combustion blower runs to burn out fuel and cool the unit.","src":"HYPO","origin":"v4"},{"id":"FC154","chapter":15,"front":"Pellet input","back":"Feed rate (lb/h) × heating value (Btu/lb).","src":"HYPO","origin":"v4"},{"id":"FC155","chapter":16,"front":"Watts to Btu/h","back":"× 3.412.","src":"S13","origin":"v4"},{"id":"FC156","chapter":16,"front":"Current","back":"I = P ÷ V (resistive load).","src":"HYPO","origin":"v4"},{"id":"FC157","chapter":16,"front":"Typical 120 V plug-in heater","back":"≈ 1,500 W ≈ 5,100 Btu/h; ≈ 12.5 A.","src":"HYPO","origin":"v4"},{"id":"FC158","chapter":16,"front":"UL 1278","back":"Movable and wall- or ceiling-hung electric room heaters.","src":"S16","origin":"v4"},{"id":"FC159","chapter":16,"front":"UL 2021","back":"Fixed and location-dedicated electric room heaters.","src":"S16","origin":"v4"},{"id":"FC160","chapter":16,"front":"Gas media","back":"Logs, glass, stones are part of the tested configuration; only listed media/placement.","src":"HYPO","origin":"v4"},{"id":"FC161","chapter":16,"front":"Heat-management kit","back":"Listed kit relocating heat within a model's configuration; doesn't remove clearances.","src":"HYPO","origin":"v4"},{"id":"FC162","chapter":16,"front":"Outdoor vs indoor listing","back":"Outdoor-listed appliances are not approved for enclosed spaces; indoor not for weather.","src":"HYPO","origin":"v4"},{"id":"FC163","chapter":16,"front":"ANSI Z21.97","back":"Outdoor decorative gas appliances.","src":"S12","origin":"v4"},{"id":"FC164","chapter":16,"front":"Fireplace doors","back":"Only doors listed/approved for that fireplace model.","src":"HYPO","origin":"v4"},{"id":"FF01","chapter":7,"front":"Formula: Useful output from input","back":"Output (Btu/h) = Input (Btu/h) × Efficiency (decimal) — e.g. Input 30,000 Btu/h at 72% → 30,000 × 0.72 = 21,600 Btu/h.","src":"HYPO","origin":"v4"},{"id":"FF02","chapter":7,"front":"Formula: Required input for a target output","back":"Input = Output ÷ Efficiency — e.g. Need 18,000 Btu/h delivered at 60% → 18,000 ÷ 0.60 = 30,000 Btu/h input.","src":"HYPO","origin":"v4"},{"id":"FF03","chapter":7,"front":"Formula: Efficiency from measured values","back":"Efficiency (%) = Output ÷ Input × 100 — e.g. 14,000 Btu/h out of 20,000 Btu/h in → 70%.","src":"HYPO","origin":"v4"},{"id":"FF04","chapter":7,"front":"Formula: Overall efficiency","back":"Overall = Combustion efficiency × Heat-transfer efficiency — e.g. 0.90 combustion × 0.80 transfer = 0.72 overall (72%).","src":"MANUAL","origin":"v4"},{"id":"FF05","chapter":7,"front":"Formula: Electric resistance heat","back":"Btu/h = Watts × 3.412 (1 kW = 3,412 Btu/h) — e.g. 1,500 W × 3.412 = 5,118 Btu/h.","src":"S13","origin":"v4"},{"id":"FF06","chapter":16,"front":"Formula: Power, voltage and current (resistive load)","back":"P (W) = V × I ;  I = P ÷ V — e.g. 1,500 W ÷ 120 V = 12.5 A.","src":"HYPO","origin":"v4"},{"id":"FF07","chapter":7,"front":"Formula: Thermal resistance in series","back":"R_total = R1 + R2 + … ;  R of a layer = thickness ÷ k (k per inch, consistent units) — e.g. Board with k = 0.84 per inch, 1/2 in. thick → R = 0.5 ÷ 0.84 ≈ 0.60. Two such boards → ≈ 1.19.","src":"HYPO","origin":"v4"},{"id":"FF08","chapter":7,"front":"Formula: Btu definition","back":"1 Btu = heat to raise 1 lb of water 1 °F — e.g. An appliance at 40,000 Btu/h for 3 h uses 120,000 Btu = 1.2 therms of fuel energy.","src":"S13","origin":"v4"},{"id":"FF09","chapter":14,"front":"Formula: Gas consumption","back":"Fuel rate = Input (Btu/h) ÷ Heating value (Btu per unit) — e.g. 40,000 Btu/h ÷ 91,452 Btu/gal ≈ 0.44 gal/h propane.","src":"S13","origin":"v4"},{"id":"FF10","chapter":14,"front":"Formula: Pressure conversion","back":"1 psi ≈ 27.7 in. w.c. ;  in. w.c. = psi × 27.7 — e.g. 0.5 psi × 27.7 ≈ 13.9 in. w.c.","src":"HYPO","origin":"v4"},{"id":"FF11","chapter":14,"front":"Formula: High-altitude input derate (common US practice)","back":"Derated input = Sea-level input × (1 − 0.04 × elevation in thousands of ft)  — applied above 2,000 ft — e.g. 40,000 Btu/h at 5,000 ft → 40,000 × (1 − 0.20) = 32,000 Btu/h.","src":"S14","origin":"v4"},{"id":"FF12","chapter":13,"front":"Formula: Wood moisture — wet basis","back":"MC_wet (%) = water mass ÷ total (wet) mass × 100 — e.g. 10 lb log containing 2 lb water → 20% wet basis.","src":"HYPO","origin":"v4"},{"id":"FF13","chapter":13,"front":"Formula: Wood moisture — dry basis","back":"MC_dry (%) = water mass ÷ oven-dry wood mass × 100 — e.g. 2 ÷ 8 × 100 = 25% dry basis.","src":"HYPO","origin":"v4"},{"id":"FF14","chapter":13,"front":"Formula: Converting between moisture bases","back":"MC_dry = MC_wet ÷ (1 − MC_wet) ;  MC_wet = MC_dry ÷ (1 + MC_dry)  (decimals) — e.g. 20% wet → 0.20 ÷ 0.80 = 25% dry.","src":"HYPO","origin":"v4"},{"id":"FF15","chapter":13,"front":"Formula: Cord volume","back":"Full cord = 4 ft × 4 ft × 8 ft = 128 ft³ (stacked, including air space) — e.g. A 4 × 8 ft stack of 16-in. pieces = 4 × 8 × 1.33 ≈ 43 ft³ ≈ 1/3 cord.","src":"MANUAL","origin":"v4"},{"id":"FF16","chapter":15,"front":"Formula: Pellet input from feed rate","back":"Input (Btu/h) = Feed rate (lb/h) × Heating value (Btu/lb) — e.g. 2.0 lb/h × 8,000 Btu/lb = 16,000 Btu/h input.","src":"S09","origin":"v4"},{"id":"FF17","chapter":15,"front":"Formula: Pellet burn time","back":"Hours = Fuel mass (lb) ÷ Feed rate (lb/h) — e.g. 60 lb hopper ÷ 2.5 lb/h = 24 h.","src":"HYPO","origin":"v4"},{"id":"FF18","chapter":11,"front":"Formula: Equivalent vent length","back":"EVL = Σ straight lengths + Σ (fitting count × manufacturer allowance per fitting) — e.g. HYPO table: 90° = 5 ft, 45° = 3 ft. 6 ft pipe + 2 × 90° + 1 tee(5 ft) → 6 + 10 + 5 = 21 ft.","src":"HYPO","origin":"v4"},{"id":"FF19","chapter":10,"front":"Formula: Masonry fireplace hearth extension (IRC)","back":"Opening < 6 ft²: 16 in. front, 8 in. each side ;  Opening ≥ 6 ft²: 20 in. front, 12 in. each side — e.g. Opening 36 in. × 26 in. = 6.5 ft² → 20 in. front / 12 in. sides.","src":"S07","origin":"v4"},{"id":"FF20","chapter":11,"front":"Formula: Masonry chimney termination ('3-2-10')","back":"Top ≥ 3 ft above highest point of roof penetration AND ≥ 2 ft above any part of the building within 10 ft horizontally — e.g. Ridge is 8 ft above the penetration and 6 ft away → chimney must reach ≥ 10 ft above penetration (8 + 2).","src":"S08","origin":"v4"},{"id":"FF21","chapter":11,"front":"Formula: Masonry flue sizing ratio (teaching rule)","back":"Flue area ≈ 1/10 (rectangular) or 1/12 (round) of fireplace opening area — e.g. Opening 36 × 28 = 1,008 in² → round flue ≥ 84 in² (≈ 10.3 in. dia).","src":"MANUAL","origin":"v4"},{"id":"FF22","chapter":10,"front":"Formula: Area of a floor protector","back":"Area = (stove depth + front extension + rear) × (stove width + 2 × side extension) — e.g. HYPO stove 24 × 24 in., listing: 16 in. front, 8 in. sides, 0 rear → (24+16) × (24+16) = 1,600 in² ≈ 11.1 ft².","src":"HYPO","origin":"v4"}],"sources":[{"id":"S01","kind":"official-exam","title":"NFI Hearth Design Specialist (certification page)","publisher":"National Fireplace Institute","url":"https://www.nficertified.org/industry/nfi-hearth-design-specialist/","verified":"Describes the role and training topics; does NOT list question count, time limit, passing score or knowledge statements."},{"id":"S02","kind":"official-exam","title":"NFI Policy Handbook 2026 (PDF, no revision date printed)","publisher":"National Fireplace Institute","url":"https://www.nficertified.org/wp-content/uploads/2026/10/NFI-Policy-Handbook-2026.pdf","verified":"HDS is a stand-alone certification; exams are multiple choice, closed book, remotely proctored online; hand-held non-programmable calculator only (online calculator provided); pass/fail, no overall numerical score reported; feedback report shows percent correct by knowledge category; retest wait 10 days; certification valid 3 years. Question count and time limit 'vary' and are not stated for HDS. Index of Knowledge Statements is printed in each reference manual (Section I.D)."},{"id":"S03","kind":"official-exam","title":"NFI product page: HDS Reference Manual, First Edition (published fall 2017)","publisher":"National Fireplace Institute","url":"https://www.nficertified.org/product/schpba-gas-review-certification-exam-no-manual-6-9-2024/","verified":"States the HDS Reference Manual First Edition was published fall 2017 and covers combustion, heat transfer, safety and venting for wood, gas and pellet appliances."},{"id":"S04","kind":"official-exam","title":"NFI industry page","publisher":"National Fireplace Institute","url":"https://www.nficertified.org/industry/","verified":"HDS manual and exam designed for sales personnel; links Policy Handbook 2026."},{"id":"S05","kind":"regulation","title":"EPA Certified Wood Stoves (Burn Wise archive)","publisher":"U.S. EPA","url":"https://epa.gov/burnwise/epa-certified-wood-stoves","verified":"2020 NSPS limit for new room heaters: 2.0 g/h (crib wood test) or 2.5 g/h (cord wood test). Burn Wise is an archived program (no updates after Oct 30 2025)."},{"id":"S06","kind":"regulation","title":"EPA Burn Wise: best wood-burning practices / moisture meter flyer","publisher":"U.S. EPA","url":"https://www.epa.gov/node/93297","verified":"Wood burns best at moisture content below 20%; test with a meter on a freshly split face."},{"id":"S07","kind":"model-code","title":"IRC Chapter 10 Table R1001.1 (as adopted in 2018 Seattle Residential Code)","publisher":"ICC / City of Seattle","url":"https://seattle.gov/Documents/Departments/SDCI/Codes/SeattleResidentialCode/2018SRCChapter10.pdf","verified":"Masonry fireplace hearth slab 4 in.; hearth extension 16 in. front / 8 in. each side for openings < 6 sq ft; 20 in. / 12 in. for openings >= 6 sq ft. Masonry fireplaces only; factory-built follow listing."},{"id":"S08","kind":"model-code","title":"IRC R1003.9 chimney termination ('3-2-10')","publisher":"ICC (via Jaspector IRC 2024 summary; CT DAS training slides)","url":"https://www.jaspector.com/codes/irc-2024/ch10-chimneys-fireplaces/chimney-height-requirements-irc-2024/","verified":"Masonry chimney at least 3 ft above highest roof penetration point AND at least 2 ft higher than any portion of the building within 10 ft horizontally. Secondary source: confirm in your adopted code."},{"id":"S09","kind":"standard","title":"PFI Standard Specification for Residential/Commercial Densified Fuel (Nov 3, 2017), Table 1","publisher":"Pellet Fuels Institute","url":"https://pellet.memberclicks.net/assets/docs/2017/Standard Specification - 2017-11-3.pdf","verified":"Premium/Standard/Utility: ash <=1.0/<=2.0/<=6.0%; moisture <=8/<=10/<=10%; fines <=0.50/<=1.0/<=1.0%; bulk density 40-48 / 38-48 / 38-48 lb/ft3; diameter 0.230-0.285 in; PDI >=96.5/95/95; chloride <=300 ppm; heating value: no grade limit (minimum HHV guaranteed on bag)."},{"id":"S10","kind":"standard","title":"ASC Z223 / National Fuel Gas Code status","publisher":"American Gas Association","url":"https://www.aga.org/asc-z223-on-national-fuel-gas-code/","verified":"Current edition: 2024 National Fuel Gas Code (ANSI Z223.1 / NFPA 54); next edition 2027 in progress."},{"id":"S11","kind":"standard","title":"NFPA 211 edition status","publisher":"NFPA (via standards.ie / ANSI webstore)","url":"https://shop.standards.ie/en-ie/standards/nfpa-211-2027-829142_saig_nfpa_nfpa_4018297/","verified":"NFPA 211 (Chimneys, Fireplaces, Vents, and Solid Fuel-Burning Appliances) 2027 edition listed as current (published 2026); 2024 edition superseded. Chapter 15 defines Level I/II/III inspections of existing chimneys. The HDS First Edition (2017) predates both."},{"id":"S12","kind":"standard","title":"CSA/ANSI Z21.88-19 (R2024) / CSA 2.33 Vented gas fireplace heaters; Z21.50/CSA 2.22 Vented gas fireplaces; Z21.60/CSA 2.26 Decorative gas appliances for installation in solid-fuel burning fireplaces","publisher":"CSA Group / ANSI webstore","url":"https://webstore.ansi.org/standards/csa/csaansiz218819r202433","verified":"Titles and scope (inputs up to 400,000 Btu/h; NG or propane) as listed on ANSI webstore."},{"id":"S13","kind":"reference-data","title":"EIA: Btu conversion factors","publisher":"U.S. Energy Information Administration","url":"https://www.eia.gov/energyexplained/units-and-calculators/british-thermal-units.php","verified":"1 kWh = 3,412 Btu; 1 ft3 natural gas = 1,036 Btu (US average, 2023 prelim.); 1 gal propane = 91,452 Btu; 1 therm = 100,000 Btu. Btu = heat to raise 1 lb water 1 F."},{"id":"S14","kind":"secondary","title":"High-altitude derate practice (manufacturer manuals citing ANSI Z223.1/NFPA 54)","publisher":"Rheem / Bryant / Goodman installation manuals (manualslib)","url":"https://www.manualslib.com/manual/1203282/Nordyne-Tc.html?page=22","verified":"Common practice: reduce input 4% per 1,000 ft of elevation above 2,000 ft (US); Canada uses 10% for 2,000-4,500 ft. Secondary source: appliance listing/manual governs."},{"id":"S15","kind":"standard","title":"UL 1618 Wall Protectors, Floor Protectors, and Hearth Extensions; UL code-authority note on Type 1/Type 2 floor protectors","publisher":"UL Standards & Engagement / UL Solutions","url":"https://code-authorities.ul.com/about/blog/floor-protectors-and-wall-shields/","verified":"UL 1618 covers wall/floor protectors and hearth extensions for fireplaces, fireplace stoves, inserts and solid-fuel room heaters. Type 1 = ember protection; Type 2 = thermal protection of combustible floor."},{"id":"S16","kind":"standard","title":"Standards list: UL 127, UL 1482, UL 1278, UL 2021, UL 1777, ASTM E1509, UL 737 (2025), UL 641 Type L","publisher":"WA L&I lab scope list; ANSI webstore; GlobalSpec","url":"https://webstore.ansi.org/standards/ul/ul737ed112025","verified":"UL 127 factory-built fireplaces; UL 1482 solid-fuel type room heaters; UL 737 fireplace stoves (Ed. 11, 2025); UL 1278 movable/wall-hung electric room heaters; UL 2021 fixed electric room heaters; UL 1777 chimney liners; ASTM E1509 pellet room heaters; UL 641 Type L low-temperature venting systems; UL 103 factory-built chimneys; UL 441 gas vents."},{"id":"MANUAL","kind":"pending","title":"NFI Hearth Design Specialist Reference Manual, First Edition (2017) — user's scanned copy","publisher":"HPBEF / NFI","url":"","verified":"NOT RECEIVED in this session. Required for knowledge-statement crosswalk, page references and exam-reference values."},{"id":"HYPO","kind":"label","title":"Hypothetical worked example","publisher":"Course author","url":"","verified":"Numbers chosen to teach the method. Not a product value, code value or installation authorization."}],"stats":{"questionsTotal":560,"questionsLegacy":438,"questionsNew":122,"uniqueConceptsTotal":340,"uniqueConceptsLegacy":218,"calcVariants":234,"calcTemplates":14,"legacyBasicExcludedFromExams":88,"examEligible":432,"holdout":40,"flashcards":270,"flashcardsLegacy":84,"lessons":11,"scriptWords":8708,"scriptMinutes":62,"quickReviewSecs":2796,"formOverlap":{"AB":{"identicalItems":54,"sharedConcepts":58},"AC":{"identicalItems":17,"sharedConcepts":17},"AD":{"identicalItems":15,"sharedConcepts":17},"AE":{"identicalItems":53,"sharedConcepts":58},"BC":{"identicalItems":57,"sharedConcepts":58},"BD":{"identicalItems":19,"sharedConcepts":19},"BE":{"identicalItems":15,"sharedConcepts":16},"CD":{"identicalItems":56,"sharedConcepts":60},"CE":{"identicalItems":18,"sharedConcepts":19},"DE":{"identicalItems":54,"sharedConcepts":58}},"answerPositions":{"1":127,"2":133,"0":115,"3":97}}};</script>
<script>/* NFI Study Lab v4 — Technical Mastery Edition. Vanilla JS, no dependencies. */
'use strict';
let D, Q, QBY, CH, TRACKS, PLAYLIST, LESSONS, CARDS, CARDBY;
const L4 = ['A', 'B', 'C', 'D'];
const KEY = 'nfi-studylab-v4', OLD_KEY = 'nfi-studylab-v3-tori';
const SAND = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const h = x => String(x ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const $ = id => document.getElementById(id);
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------------- state ---------------- */
const BLANK = () => ({ v: 4, drills: {}, missed: {}, attempts: [], activeExam: null, completedAudio: {}, lastTrack: null, positions: {}, autoNext: true, rate: 1, srs: {}, migratedFrom: null });
let S = BLANK();
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (raw && typeof raw === 'object') { S = Object.assign(BLANK(), raw); return; }
  try { const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); if (old && typeof old === 'object') { S = migrate(old); save(); } } catch (e) {}
}
function migrate(old) {
  const n = BLANK();
  n.drills = old.drills || {}; n.missed = old.missed || {}; n.attempts = (old.attempts || []).map(a => Object.assign({ minutes: 150, flagged: {} }, a));
  n.activeExam = old.activeExam ? Object.assign({ minutes: 150, flagged: {} }, old.activeExam) : null;
  n.completedAudio = old.completedAudio || {}; n.autoNext = old.autoNext !== false;
  if (typeof old.lastTrack === 'number' && D.tracks[old.lastTrack]) n.lastTrack = D.tracks[old.lastTrack].id;
  n.migratedFrom = 'v3 (' + OLD_KEY + ')';
  return n;
}
let saveTimer = null;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 800); }

/* ---------------- boot ---------------- */
async function boot() {
  try {
    D = window.COURSE_DATA || await fetch('data/course.json').then(r => { if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); });
  } catch (e) { $('app').innerHTML = `<div class="panel"><h2>Course data could not load</h2><p>${h(e.message)}</p></div>`; return; }
  Q = D.questions; QBY = Object.fromEntries(Q.map(q => [q.id, q])); CH = D.chapters; LESSONS = Object.fromEntries(D.lessons.map(l => [l.chapter, l]));
  CARDS = D.flashcards; CARDBY = Object.fromEntries(CARDS.map(c => [c.id, c]));
  TRACKS = D.tracks.concat(D.masteryTracks);
  // Playlist: by chapter (1..16), quick review first, then mastery lesson; final review last.
  PLAYLIST = [];
  for (let c = 1; c <= 16; c++) { TRACKS.filter(t => t.chapter === c && t.kind === 'quick-review').forEach(t => PLAYLIST.push(t)); TRACKS.filter(t => t.chapter === c && t.kind === 'mastery').forEach(t => PLAYLIST.push(t)); }
  TRACKS.filter(t => t.chapter === 0).forEach(t => PLAYLIST.push(t));
  load(); initPlayer(); renderNav(); routeFromHash(); window.addEventListener('hashchange', routeFromHash);
  setInterval(tick, 1000);
}

/* ---------------- routing ---------------- */
let VIEW = 'home', P = {};
const NAV = [['home', 'Dashboard'], ['learn', 'Learn'], ['exams', 'Exams'], ['missed', 'Missed'], ['cards', 'Flashcards'], ['formulas', 'Formulas'], ['progress', 'Mastery'], ['audit', 'Source audit'], ['tools', 'Tools']];
function route(v, params) { VIEW = v; P = params || {}; const top = NAV.find(n => n[0] === v); if (top && location.hash !== '#' + v) { try { history.replaceState(null, '', '#' + v); } catch (e) {} } renderNav(); render(); window.scrollTo(0, 0); }
function routeFromHash() { const v = (location.hash || '').slice(1); if (NAV.some(n => n[0] === v)) { VIEW = v; P = {}; } renderNav(); render(); }
function renderNav() { $('nav').innerHTML = NAV.map(([id, l]) => `<button class="${VIEW === id ? 'active' : ''}" onclick="route('${id}')">${l}</button>`).join(''); }
function render() {
  const map = { home, learn, chapter: chapterView, drill, exams, active: examQuestion, results: examResults, missed: missedPage, cards: cardsPage, formulas: formulasPage, progress: progressPage, audit: auditPage, tools: toolsPage };
  (map[VIEW] || home)();
  if (VIEW === 'home') paintLibrary();
}
function modal(html, buttons) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${html}<div class="actions" style="margin-top:14px">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${h(b.label)}</button>`).join('')}</div></div>`;
  m.addEventListener('click', e => { const i = e.target.getAttribute && e.target.getAttribute('data-i'); if (i !== null && i !== undefined) { m.remove(); const f = buttons[+i].fn; if (f) f(); } });
  document.body.append(m);
}
function confirmBox(msg, yesLabel, fn) { modal(`<p>${msg}</p>`, [{ label: yesLabel, fn, cls: 'teal' }, { label: 'Cancel', cls: 'ghost' }]); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }

/* ---------------- helpers ---------------- */
const drillQs = c => Q.filter(q => q.chapter === c && !q.holdout);
const doneCount = c => drillQs(c).filter(q => S.drills[q.id]).length;
const correctCount = c => drillQs(c).filter(q => S.drills[q.id] && S.drills[q.id].selected === q.answer).length;
function scoreOf(a) { return a.order.filter(id => QBY[id] && a.responses[id] === QBY[id].answer).length; }
const rateOf = a => pct(scoreOf(a), a.order.length);
const chTitle = c => (CH.find(x => x.id === c) || {}).title || 'Final review';

  </section>
  <section class="panel" style="margin-top:16px;border-color:#786344" id="libpanel">
   <div class="row"><div><span class="eyebrow">Tori · Warm &amp; Engaging</span><h2 style="margin:4px 0 0">Audio course</h2></div><span class="pill" id="audprog"></span></div>

     <button class="btn" onclick="resumeAudio()">${resume ? '▶ Resume: ' + h(resume.title.slice(0, 38)) + (resume.title.length > 38 ? '…' : '') : '▶ Start lesson 1'}</button>
     <label class="small"><input type="checkbox" id="autonext" ${S.autoNext ? 'checked' : ''} onchange="S.autoNext=this.checked;save()"> Auto-play next lesson</label>
   </div>

   <p class="caption">Quick-review recordings (22, ≈${Math.round(st.quickReviewSecs / 60)} min) stream from HeyGen. Technical mastery lessons (${st.lessons}) have finished scripts; their Tori audio has <b>not been generated yet</b> — tap one to read its script. ${SAND ? '<b>You are inside Claude\'s viewer, which blocks outside audio.</b> Use “Open MP3” links or the standalone file to listen.' : ''}</p>
  </section>
  <div class="stats">
   <div class="stat"><strong>${Object.keys(S.drills).length}/${Q.length - D.holdout.length}</strong><span>Chapter questions attempted</span></div>
   <div class="stat"><strong>${best === null ? '—' : best + '%'}</strong><span>Best practice exam</span></div>
   <div class="stat"><strong>${missed}</strong><span>Questions to revisit</span></div>
   <div class="stat"><strong>${due}</strong><span>Flashcards due</span></div></div>
  <div class="section-title"><div><h2>Chapters</h2><p>Chapters 1–5: consultative review. Chapters 6–16: full technical lessons + quizzes.</p></div></div>

}
function chapterCard(c) {
  const n = drillQs(c.id).length, d = doneCount(c.id);
  return `<div class="card chapter"><div class="row"><span class="ch-num">CHAPTER ${c.id}</span><span class="pill">${d}/${n}</span></div><h3 style="margin:0">${h(c.title)}</h3><p class="small subtle" style="margin:0">${h(c.focus)}.</p><div class="bar"><b style="width:${pct(d, n)}%"></b></div>
  <div class="actions"><button class="btn sm" onclick="route('chapter',{c:${c.id}})">${LESSONS[c.id] ? 'Lesson + quiz' : 'Review + quiz'}</button><button class="btn ghost sm" onclick="playChapter(${c.id})">▶ Listen</button></div></div>`;
}

/* ---------------- audio library (dashboard) ---------------- */
function paintLibrary() {
  const el = $('library'); if (!el) return;
  const cur = currentTrack();
  const groups = {};
  PLAYLIST.forEach((t, i) => { (groups[t.chapter] = groups[t.chapter] || []).push([t, i]); });
  el.innerHTML = Object.keys(groups).sort((a, b) => (+a || 99) - (+b || 99)).map(c => {
    const items = groups[c], done = items.filter(([t]) => S.completedAudio[t.id]).length, open = cur ? cur.chapter === +c : +c === 1;
    return `<details class="chgroup" ${open ? 'open' : ''}><summary><span>${+c ? 'Ch ' + c + ' · ' + h(chTitle(+c)) : 'Final review'}</span><span class="mini">${done}/${items.length}</span></summary>${items.map(([t, i]) => {
      const playable = !!srcFor(t), playing = cur && cur.id === t.id;
      return `<button class="trk ${playing ? 'playing' : ''} ${playable ? '' : 'na'}" onclick="${playable ? `playIndex(${i},true)` : `showScript('${t.lessonId}')`}"><span class="st">${S.completedAudio[t.id] ? '✓' : playing ? (A.paused ? '❚❚' : '♪') : (t.kind === 'mastery' ? 'M' : 'Q')}</span><span><b>${h(t.title)}</b><br><span class="caption">${t.kind === 'mastery' ? 'Technical mastery · script ready, audio not generated' : 'Quick review · Tori'}${playing ? ' · now playing' : ''}</span></span><span class="caption">${t.kind === 'mastery' ? '~' : ''}${mmss(t.secs)}</span></button>`;
    }).join('')}</details>`;
  }).join('');
  const pr = $('audprog'); if (pr) pr.textContent = PLAYLIST.filter(t => S.completedAudio[t.id]).length + '/' + PLAYLIST.length + ' complete';
}
function showScript(lessonId) {
  const L = D.lessons.find(l => l.id === lessonId); if (!L) return;
  modal(`<span class="eyebrow">Tori script · ${h(L.id)} · ${L.words} words · ~${Math.round(L.estSecs / 60)} min</span><h3>${h(L.title)}</h3><p class="caption">Audio not generated yet. Narration script below (${L.segments.length} segment${L.segments.length > 1 ? 's' : ''}).</p><div style="max-height:50vh;overflow:auto;white-space:pre-wrap;font-size:13px;background:var(--navy);padding:10px;border-radius:8px">${h(L.segments.join('\n\n— segment break —\n\n'))}</div>`,
    [{ label: 'Open full lesson', cls: 'teal', fn: () => route('chapter', { c: L.chapter, tab: 'mastery' }) }, { label: 'Close', cls: 'ghost' }]);
}

/* ---------------- persistent player ---------------- */
let A, curIdx = -1, triedRemote = false, lastPosSave = 0;
function srcFor(t) { if (!t) return null; if (D.config && D.config.localAudio && t.file && t.status !== 'script-ready-audio-not-generated') return t.file; return t.remoteUrl || t.url || null; }
function currentTrack() { return curIdx >= 0 ? PLAYLIST[curIdx] : (S.lastTrack ? PLAYLIST.find(t => t.id === S.lastTrack) : null); }
function playableIdx(from, dir) { for (let i = from; i >= 0 && i < PLAYLIST.length; i += dir) if (srcFor(PLAYLIST[i])) return i; return -1; }
function initPlayer() {
  A = $('player');
  A.addEventListener('timeupdate', () => { paintDock(false); const t = PLAYLIST[curIdx]; if (t && Date.now() - lastPosSave > 4000) { S.positions[t.id] = A.currentTime; lastPosSave = Date.now(); saveSoon(); } });
  A.addEventListener('loadedmetadata', () => { const t = PLAYLIST[curIdx]; const p = t && S.positions[t.id]; if (p && p < A.duration - 5) { try { A.currentTime = p; } catch (e) {} } A.playbackRate = S.rate || 1; paintDock(true); });
  A.addEventListener('play', () => { msg(''); paintDock(true); paintLibrary(); });
  A.addEventListener('pause', () => { paintDock(true); paintLibrary(); const t = PLAYLIST[curIdx]; if (t) { S.positions[t.id] = A.currentTime; save(); } });
  A.addEventListener('ended', () => {
    const t = PLAYLIST[curIdx]; if (t) { S.completedAudio[t.id] = true; S.positions[t.id] = 0; save(); }
    const n = playableIdx(curIdx + 1, 1);
    if (S.autoNext && n >= 0) playIndex(n, true); else { paintDock(true); paintLibrary(); if (n < 0) msg('That was the last recorded lesson.', 'tap'); }
  });
  A.addEventListener('error', () => {
    const t = PLAYLIST[curIdx]; if (!t) return;
    if (!triedRemote && t.remoteUrl && A.getAttribute('src') !== t.remoteUrl) { triedRemote = true; A.src = t.remoteUrl; A.load(); A.play().catch(tapPrompt); return; }
    msg(`Could not load this recording${SAND ? ' (Claude\'s viewer blocks outside audio)' : ''}. <button class="btn sm ghost" onclick="playIndex(${curIdx},true)">Retry</button> <a href="${h(t.remoteUrl || '')}" target="_blank" rel="noopener">Open MP3 directly</a>`, 'err');
  });
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    try { ms.setActionHandler('previoustrack', () => prevTrack()); ms.setActionHandler('nexttrack', () => nextTrack()); ms.setActionHandler('play', () => togglePlay()); ms.setActionHandler('pause', () => togglePlay()); ms.setActionHandler('seekbackward', () => skip(-15)); ms.setActionHandler('seekforward', () => skip(15)); } catch (e) {}
  }
  const t = currentTrack(); if (t) { curIdx = PLAYLIST.indexOf(t); setSrc(t); }
  paintDock(true);
}
function setSrc(t) { triedRemote = false; const s = srcFor(t); if (s && A.getAttribute('src') !== s) { A.src = s; A.load(); } }
function playIndex(i, autoplay) {
  if (i < 0 || i >= PLAYLIST.length) return;
  const t = PLAYLIST[i];
  if (!srcFor(t)) { showScript(t.lessonId); return; }
  if (curIdx >= 0 && PLAYLIST[curIdx] && curIdx !== i) { S.positions[PLAYLIST[curIdx].id] = A.currentTime || 0; }
  curIdx = i; S.lastTrack = t.id; save();
  setSrc(t); A.playbackRate = S.rate || 1;
  if (autoplay) { const p = A.play(); if (p && p.catch) p.catch(tapPrompt); }
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: 'Tori · NFI Study Lab', album: t.chapter ? 'Chapter ' + t.chapter : 'Final review' }); } catch (e) {} }
  paintDock(true); paintLibrary();
}
function tapPrompt(err) { if (err && err.name === 'AbortError') return; msg('Tap ▶ Play to start audio (your browser needs a tap).', 'tap'); paintDock(true); }
let DMSG = ['', ''];
function msg(html, kind) { DMSG = [html || '', kind || '']; const m = $('dockmsg'); if (!m) return; m.className = 'msg' + (html ? ' on ' + (kind || '') : ''); m.innerHTML = html || ''; }
function togglePlay() { if (curIdx < 0) { resumeAudio(); return; } if (A.paused) { const p = A.play(); if (p && p.catch) p.catch(tapPrompt); } else A.pause(); }
function nextTrack() { const n = playableIdx(Math.max(curIdx, -1) + 1, 1); if (n < 0) { msg('You are on the last recorded lesson.', 'tap'); return; } playIndex(n, true); }
function prevTrack() { if (curIdx >= 0 && A.currentTime > 5) { A.currentTime = 0; return; } const n = playableIdx(curIdx - 1, -1); if (n < 0) { msg('You are on the first lesson.', 'tap'); return; } playIndex(n, true); }
function skip(s) { if (curIdx < 0) return; try { A.currentTime = Math.max(0, Math.min((A.duration || 1e9) - 0.5, A.currentTime + s)); } catch (e) {} }
function resumeAudio() { const t = currentTrack(); const i = t ? PLAYLIST.indexOf(t) : playableIdx(0, 1); playIndex(i >= 0 && srcFor(PLAYLIST[i]) ? i : playableIdx(0, 1), true); }
function playChapter(c) { const i = PLAYLIST.findIndex(t => t.chapter === c && srcFor(t)); if (i >= 0) playIndex(i, true); else { const m = PLAYLIST.find(t => t.chapter === c); if (m) showScript(m.lessonId); } }
function setRate(r) { S.rate = +r; A.playbackRate = S.rate; save(); }
function seekTo(v) { if (A.duration) A.currentTime = v / 1000 * A.duration; }
function paintDock(full) {
  const d = $('dock'), t = PLAYLIST[curIdx] || currentTrack();
  if (!t) { d.classList.add('hidden'); document.documentElement.style.setProperty('--dock', '0px'); return; }
  d.classList.remove('hidden');
  if (full || !$('dockseek')) {
    const pi = playableIdx(curIdx - 1, -1), ni = playableIdx(curIdx + 1, 1);
    $('dockinner').innerHTML = `<div class="row"><div class="t">${h(t.chapter ? 'Ch ' + t.chapter + ' · ' : '')}${h(t.title)}</div><span class="caption">${curIdx + 1}/${PLAYLIST.length}${S.completedAudio[t.id] ? ' · ✓' : ''}</span></div>
     <input type="range" id="dockseek" min="0" max="1000" value="0" aria-label="Seek" oninput="seekTo(this.value)">
     <div class="tm"><span id="dockcur">0:00</span><span id="docktot">${mmss(A.duration || t.secs)}</span></div>
     <div class="ctl"><button onclick="prevTrack()" ${pi < 0 && !(A.currentTime > 5) ? 'disabled' : ''} aria-label="Previous lesson">⏮</button><button onclick="skip(-15)" aria-label="Back 15 seconds">−15</button><button class="main" onclick="togglePlay()" aria-label="Play or pause">${A.paused ? '▶' : '❚❚'}</button><button onclick="skip(15)" aria-label="Forward 15 seconds">+15</button><button class="next" onclick="nextTrack()" ${ni < 0 ? 'disabled' : ''} aria-label="Next lesson">Next ⏭</button>
     <select onchange="setRate(this.value)" aria-label="Playback speed">${[0.75, 1, 1.25, 1.5, 1.75, 2].map(r => `<option value="${r}" ${+S.rate === r ? 'selected' : ''}>${r}×</option>`).join('')}</select></div>
     <div class="actions" style="margin-top:4px"><a class="caption" href="${h(t.remoteUrl || '')}" target="_blank" rel="noopener">Open MP3 directly</a><span class="caption">·</span><button class="caption" style="background:none;border:0;color:#edc785;padding:0;min-height:0" onclick="showTranscript()">Transcript</button></div>
     <div id="dockmsg" class="msg${DMSG[0] ? ' on ' + DMSG[1] : ''}">${DMSG[0]}</div>`;
    document.documentElement.style.setProperty('--dock', d.offsetHeight + 'px');
  }
  const seek = $('dockseek'); if (seek && A.duration && document.activeElement !== seek) seek.value = Math.round(A.currentTime / A.duration * 1000);
  const c = $('dockcur'); if (c) c.textContent = mmss(A.currentTime); const tt = $('docktot'); if (tt && A.duration) tt.textContent = mmss(A.duration);
}
function showTranscript() {
  const t = PLAYLIST[curIdx]; if (!t) return;
  if (t.lessonId) return showScript(t.lessonId);
  const c = CH.find(x => x.id === t.chapter);
  modal(`<h3>${h(t.title)}</h3><p class="caption">The original narration scripts for the 22 quick-review recordings were not included in the handoff, so a verbatim transcript is not available. Chapter study notes that the recording summarizes:</p><ul class="small">${c ? c.points.map(p => `<li>${h(p)}</li>`).join('') : '<li>Final review: see Exams.</li>'}</ul>`, [{ label: 'Close', cls: 'ghost' }]);
}

/* ---------------- learn ---------------- */
function learn() {
  $('app').innerHTML = `<div class="section-title"><div><span class="eyebrow">Learn</span><h2>Chapters and lessons</h2><p>Mastery mode = full technical lesson. Concise mode = quick review notes.</p></div></div><div class="grid">${CH.map(chapterCard).join('')}</div>`;
}
function chapterView() {
  const c = P.c || 1, meta = CH.find(x => x.id === c), L = LESSONS[c]; const tab = P.tab || (L ? 'mastery' : 'concise');
  const tabs = [['mastery', 'Mastery lesson', !!L], ['concise', 'Concise review', true], ['quiz', 'Quiz (' + drillQs(c).length + ')', true]].filter(x => x[2]);
  let body = '';
  if (tab === 'mastery' && L) body = lessonHTML(L);
  else if (tab === 'concise') body = `<div class="panel"><h3>${h(meta.focus)}</h3><ul>${meta.points.map(p => `<li>${h(p)}</li>`).join('')}</ul><div class="callout small"><b>Check this:</b> ${h(meta.caution)}</div></div>`;
  else { route('drill', { c }); return; }
  $('app').innerHTML = `<div class="row no-print"><button class="btn ghost sm" onclick="route('learn')">← Chapters</button><div class="actions"><button class="btn ghost sm" onclick="playChapter(${c})">▶ Listen</button><button class="btn sm" onclick="route('drill',{c:${c}})">Start quiz</button></div></div>
   <div style="margin-top:12px"><span class="eyebrow">Chapter ${c} / 16</span><h2>${h(meta.title)}</h2></div>
   <div class="tabs no-print">${tabs.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="route('chapter',{c:${c},tab:'${k}'})">${l}</button>`).join('')}</div>${body}
   <div class="row no-print" style="margin-top:14px"><button class="btn ghost sm" ${c <= 1 ? 'disabled' : ''} onclick="route('chapter',{c:${c - 1}})">← Ch ${c - 1}</button><button class="btn ghost sm" ${c >= 16 ? 'disabled' : ''} onclick="route('chapter',{c:${c + 1}})">Ch ${c + 1} →</button></div>`;
}
function lessonHTML(L) {
  const src = L.src.map(id => D.sources.find(s => s.id === id)).filter(Boolean);
  return `<article class="panel lesson"><span class="pill gold">Technical mastery · ~${Math.round(L.estSecs / 60)} min read/listen · Tori audio not yet generated</span>
   <h3>Learning objectives</h3><ul>${L.objectives.map(o => `<li>${h(o)}</li>`).join('')}</ul>
   ${L.sections.map(s => `<h3>${h(s.h)}</h3><p>${h(s.body)}</p>`).join('')}
   <h3>Worked examples</h3>${L.worked.map((w, i) => `<div class="worked"><b>Example ${i + 1}.</b> ${h(w.q)}<details style="margin-top:6px"><summary class="small" style="cursor:pointer;color:var(--gold)">Show solution</summary><p>${h(w.a)}</p></details></div>`).join('')}
   <h3>Common misconceptions</h3><ul>${L.misconceptions.map(m => `<li>${h(m)}</li>`).join('')}</ul>
   <div class="callout small"><b>Sources for numbers in this lesson:</b> ${src.map(s => `${h(s.id)} — ${h(s.title)}`).join('; ')}.<br><b>Manual check needed:</b> ${h(L.manualCheck)}</div></article>`;
}

/* ---------------- chapter quiz ---------------- */
function drill() {
  const c = P.c || 1, meta = CH.find(x => x.id === c), filt = P.f || 'all';
  let qs = drillQs(c);
  if (filt === 'open') qs = qs.filter(q => !S.drills[q.id]); if (filt === 'missed') qs = qs.filter(q => S.missed[q.id]); if (filt === 'v4') qs = qs.filter(q => q.origin === 'v4');
  if (!qs.length) { $('app').innerHTML = `<button class="btn ghost sm" onclick="route('drill',{c:${c}})">← All questions</button><div class="empty" style="margin-top:14px">No questions match this filter.</div>`; return; }
  let i = Math.max(0, Math.min(qs.length - 1, P.i ?? qs.findIndex(q => !S.drills[q.id]))); if (i < 0) i = 0; P.i = i;
  const q = qs[i], g = S.drills[q.id];
  $('app').innerHTML = `<div class="row no-print"><button class="btn ghost sm" onclick="route('chapter',{c:${c}})">← Ch ${c} lesson</button><span class="pill">${correctCount(c)} correct · ${doneCount(c)}/${drillQs(c).length} answered</span></div>
  <div style="margin-top:10px"><span class="eyebrow">Chapter ${c} quiz</span><h2>${h(meta.title)}</h2></div>
  <div class="tabs no-print">${[['all', 'All'], ['open', 'Unanswered'], ['missed', 'Missed'], ['v4', 'New v4 items']].map(([k, l]) => `<button class="${k === filt ? 'on' : ''}" onclick="route('drill',{c:${c},f:'${k}'})">${l}</button>`).join('')}</div>
  <div class="quiz-layout"><section class="panel"><div class="row"><span class="eyebrow">Question ${i + 1} of ${qs.length} · ${h(q.difficulty)}</span><span class="caption">${h(q.id)}</span></div>
   <div class="prompt">${h(q.prompt)}</div>
   <div class="choices">${q.choices.map((t, k) => `<button class="choice ${g ? (k === q.answer ? 'correct' : k === g.selected ? 'incorrect' : '') : ''}" ${g ? 'disabled' : ''} onclick="chooseDrill('${q.id}',${k})"><span class="letter">${L4[k]}</span><span>${h(t)}${g && q.why && q.why[k] ? `<span class="why">${h(q.why[k])}</span>` : ''}</span></button>`).join('')}</div>
   ${g ? explainHTML(q, g.selected) : '<p class="caption">Choose an answer to see the explanation.</p>'}
   <div class="row no-print" style="margin-top:12px"><button class="btn ghost sm" ${i === 0 ? 'disabled' : ''} onclick="P.i=${i - 1};render()">← Previous</button><div class="actions"><button class="btn ghost sm" ${g ? '' : 'disabled'} onclick="delete S.drills['${q.id}'];save();render()">Try again</button><button class="btn sm" ${i === qs.length - 1 ? 'disabled' : ''} onclick="P.i=${i + 1};render()">Next →</button></div></div>
   <div class="numbergrid no-print">${qs.map((x, k) => `<button class="qnum ${S.drills[x.id] ? 'answered' : ''} ${k === i ? 'current' : ''}" onclick="P.i=${k};render()">${k + 1}</button>`).join('')}</div></section>
   <aside class="sidebox"><span class="eyebrow">Key notes</span><ul>${meta.points.slice(0, 6).map(p => `<li>${h(p)}</li>`).join('')}</ul><div class="callout small">${h(meta.caution)}</div></aside></div>`;
}
function explainHTML(q, sel) {
  const ok = sel === q.answer;
  return `<div class="explain"><span class="pill ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : sel === undefined ? 'Unanswered' : 'Review this'}</span><p><b style="color:var(--teal)">Answer: ${L4[q.answer]} — ${h(q.choices[q.answer])}</b></p><p>${h(q.explanation)}</p><p class="caption">${h(q.source)} · ${h(q.ref)}</p></div>`;
}

  <div class="grid"><div class="panel"><h3>Export progress</h3><p class="small subtle">Includes quiz answers, exams, flags, audio positions and flashcard schedule.</p><div class="actions"><button class="btn sm" onclick="exportProgress()">Download backup</button><button class="btn ghost sm" onclick="copyProgress()">Copy backup text</button></div><textarea id="exportbox" class="input hidden" rows="5" readonly style="margin-top:10px"></textarea></div>
  <div class="panel"><h3>Import progress</h3><p class="small subtle">Accepts v4 backups and v3 (“NFI_StudyLab_Progress.json”, version 2) backups.</p><input type="file" accept=".json,application/json" onchange="importFile(event)" class="input"><textarea id="importbox" class="input" rows="4" placeholder="…or paste backup JSON here" style="margin-top:8px"></textarea><button class="btn ghost sm" style="margin-top:8px" onclick="importText($('importbox').value)">Import pasted text</button></div></div>
  <div class="panel" style="margin-top:14px"><h3>Printable coursework</h3><div class="actions"><button class="btn sm" onclick="printPack('lessons')">Mastery lessons (ch 6–16)</button><button class="btn ghost sm" onclick="printPack('notes')">Concise notes</button><button class="btn ghost sm" onclick="printPack('worksheet')">Formula worksheet + key</button><button class="btn ghost sm" onclick="printPack('bank')">Question bank + key</button>${'ABCDE'.split('').map(k => `<button class="btn ghost sm" onclick="printPack('${k}')">Exam ${k} + key</button>`).join('')}</div><p class="caption">${SAND ? 'Printing is blocked inside Claude\'s viewer — open the standalone HTML file in Safari/Chrome to print or save as PDF.' : 'Uses your browser\'s Print / Save as PDF.'}</p></div>
  <div class="panel" style="margin-top:14px"><h3>Reset</h3><button class="btn red sm" onclick="confirmBox('Delete all saved progress in this browser? Export a backup first if you might need it.','Delete everything',()=>{S=BLANK();save();route('home')})">Reset all progress</button></div>`;
}
function backupJSON() { return JSON.stringify({ app: 'nfi-studylab', version: 4, exportedAt: new Date().toISOString(), data: S }, null, 1); }
function exportProgress() { try { const b = new Blob([backupJSON()], { type: 'application/json' }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'NFI_StudyLab_Progress_v4.json'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('Backup downloaded (if your browser allows downloads)'); } catch (e) {} copyProgressBox(); }
function copyProgressBox() { const t = $('exportbox'); if (t) { t.value = backupJSON(); t.classList.remove('hidden'); } }
function copyProgress() { copyProgressBox(); const txt = backupJSON(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup copied to clipboard'), () => toast('Select the text box and copy manually')); }
function importFile(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(f); }
function importText(txt) {
  let p; try { p = JSON.parse(txt); } catch (e) { return toast('Not valid JSON'); }
  const data = p && p.data; if (!data || typeof data !== 'object' || !data.drills) return toast('Not an NFI Study Lab backup');
  confirmBox('Replace current progress with this backup?', 'Replace', () => { S = (p.version === 4 || data.v === 4) ? Object.assign(BLANK(), data) : migrate(data); save(); toast('Progress imported'); route('home'); });
}
function doPrint() { try { window.print(); } catch (e) {} if (SAND) toast('Printing is blocked in Claude\'s viewer — use the standalone file'); }
function printPack(kind) {
  VIEW = 'print'; renderNav();
  const head = t => `<div class="no-print actions" style="margin-bottom:12px"><button class="btn ghost sm" onclick="route('tools')">← Tools</button><button class="btn sm" onclick="doPrint()">Print / Save PDF</button></div><h1>${t}</h1><p class="caption">NFI Study Lab v${h(D.version)} · original study material, not official NFI content · printed ${new Date().toLocaleDateString()}</p>`;
  const qblock = (qs, title) => head(title) + qs.map((q, i) => `<div class="print-q"><b>${i + 1}. ${h(q.prompt)}</b><ol type="A">${q.choices.map(c => `<li>${h(c)}</li>`).join('')}</ol></div>`).join('') + `<h2 class="pb">Answer key</h2>` + qs.map((q, i) => `<p class="small"><b>${i + 1}. ${L4[q.answer]}</b> (${h(q.id)}) — ${h(q.explanation)}</p>`).join('');
  let html = '';
  if (kind === 'lessons') html = head('Technical mastery lessons') + D.lessons.map(L => `<h2 class="pb">Chapter ${L.chapter}: ${h(L.title)}</h2>${lessonHTML(L)}`).join('');
  else if (kind === 'notes') html = head('Concise chapter notes') + CH.map(c => `<h2>Chapter ${c.id}: ${h(c.title)}</h2><ul>${c.points.map(p => `<li>${h(p)}</li>`).join('')}</ul><p class="small"><b>Check:</b> ${h(c.caution)}</p>`).join('');
  else if (kind === 'worksheet') { const qs = Q.filter(q => (q.kind === 'calculation' || q.quality === 'legacy-calc-variant') && !q.holdout); const pick = []; const seen = {}; qs.forEach(q => { seen[q.topicId] = (seen[q.topicId] || 0) + 1; if (seen[q.topicId] <= 2) pick.push(q); });
    html = head('Formula worksheet') + `<table class="t">${D.formulas.map(f => `<tr><td><b>${h(f.name)}</b></td><td>${h(f.formula)}</td><td class="small">${h(f.units)}</td></tr>`).join('')}</table><h2 class="pb">Practice problems (show your work)</h2>` + pick.map((q, i) => `<div class="print-q"><b>${i + 1}.</b> ${h(q.prompt)}<div style="height:54px;border-bottom:1px dotted #999"></div></div>`).join('') + `<h2 class="pb">Answer key</h2>` + pick.map((q, i) => `<p class="small"><b>${i + 1}.</b> ${h(q.choices[q.answer])} — ${h(q.explanation)}</p>`).join(''); }
  else if (kind === 'bank') html = qblock(Q.filter(q => !q.holdout), 'Question bank (holdout items withheld)');
  else if (D.exams[kind]) html = qblock(D.exams[kind].map(id => QBY[id]), 'Practice Exam ' + kind);
  $('app').innerHTML = html; window.scrollTo(0, 0);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body></html>
