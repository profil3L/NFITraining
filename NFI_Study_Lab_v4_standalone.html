<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-capable" content="yes"><title>NFI Study Lab · Technical Mastery v4</title>
<style>:root{--bg:#0b1423;--panel:#152338;--panel2:#1b2d44;--line:#2d4159;--fg:#edf4ff;--muted:#a8bacf;--gold:#f7bf6b;--teal:#55d5bc;--red:#ff8b91;--navy:#0d192a;--shadow:0 12px 35px #02071247;--dock:0px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.55;padding-bottom:calc(var(--dock) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}
a{color:#edc785}
header{border-bottom:1px solid var(--line);background:#101c2f;position:sticky;top:0;z-index:8;padding-top:env(safe-area-inset-top)}
.head{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:14px}
.brandmark{display:flex;align-items:center;gap:12px}.seal{width:38px;height:38px;border:1px solid #c38b3b;border-radius:9px;display:grid;place-items:center;color:#f7bf6b;font-size:14px;font-weight:900;background:#2b2930}
.brand{font-size:13px;font-weight:900;letter-spacing:2.5px;color:var(--gold)}.brand small{display:block;color:var(--muted);letter-spacing:0;font-size:11px;font-weight:600}
.topnav{display:flex;gap:2px;flex-wrap:wrap}.topnav button{color:var(--muted);border:0;border-radius:9px;background:transparent;padding:10px 10px;font-weight:700;font-size:13px;min-height:40px}.topnav button.active{background:#293c56;color:var(--gold)}
.wrap{max-width:1160px;margin:auto;padding:22px 18px 40px}
.hero{border-radius:18px;padding:26px;background:linear-gradient(119deg,#1b314a 0%,#132238 65%,#2c2a2e 100%);border:1px solid #37516a;box-shadow:var(--shadow)}
.eyebrow{text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:900;letter-spacing:1.8px}
h1{font-size:clamp(26px,4vw,40px);margin:8px 0;line-height:1.14;letter-spacing:-1.2px}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 8px}h3{font-size:17px;margin:0 0 8px}
.hero p{max-width:760px;color:#c3d2e4;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px}.stat strong{display:block;font-size:26px;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted);font-weight:700}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}.section-title p{color:var(--muted);font-size:13px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.chapter{display:flex;flex-direction:column;gap:8px}.ch-num{font-size:12px;letter-spacing:.7px;color:var(--gold);font-weight:900}
.mini{font-size:11px;color:var(--muted);font-weight:700}.bar{height:6px;border-radius:6px;background:#35465d;overflow:hidden;width:100%}.bar b{display:block;height:100%;background:var(--teal)}
.btn{border-radius:10px;background:var(--gold);color:#142238;border:1px solid var(--gold);padding:10px 15px;font-weight:800;min-height:44px}.btn.ghost{color:var(--fg);background:transparent;border:1px solid #4b627c}.btn.teal{background:var(--teal);border-color:var(--teal);color:#0f2c2c}.btn.sm{padding:6px 11px;font-size:13px;min-height:36px}.btn.red{color:var(--red);border-color:#ae5b66;background:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.subtle{color:var(--muted)}.small{font-size:13px}.caption{font-size:12px;color:var(--muted);line-height:1.55}
.pill{display:inline-block;border-radius:40px;color:#cbd9e9;background:#253b54;padding:3px 10px;font-size:12px;font-weight:800}.pill.gold{color:#e8b767;background:#4a3a28}.pill.good{color:var(--teal);background:#153e3c}.pill.bad{color:var(--red);background:#492a36}
.quiz-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
.prompt{font-size:19px;line-height:1.38;font-weight:800;margin:12px 0 18px}
.choices{display:grid;gap:9px}.choice{width:100%;border:1px solid #40556b;border-radius:12px;background:#1c3048;text-align:left;padding:12px 14px;color:var(--fg);display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;min-height:48px}
.choice .letter{font-weight:900;color:#f5c178;border:1px solid #5c7590;background:#17243a;border-radius:8px;padding:3px 9px;min-width:30px;text-align:center}
.choice.selected{border-color:#e7b36a;background:#3c3b38}.choice.correct{border-color:#4dbb9f;background:#21453f}.choice.incorrect{border-color:#ef777c;background:#4e303c}
.why{display:block;font-size:12.5px;color:#c9d6e6;margin-top:4px}
.explain{border-top:1px solid #4a5c70;margin-top:16px;padding-top:14px}.explain p{margin:7px 0}
.sidebox{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:14px;align-self:start}.sidebox li{margin:5px 0;color:#c4d4e6;font-size:13px}
.numbergrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:12px 0}.qnum{height:34px;border:1px solid var(--line);border-radius:7px;background:#24374d;color:#eaf0fa;font-size:12px;font-weight:700;position:relative}
.qnum.answered{background:#264e4d;border-color:#398577}.qnum.current{outline:2px solid var(--gold);outline-offset:1px}.qnum.flagged::after{content:'';position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.timer{font-variant-numeric:tabular-nums;font-size:21px;font-weight:900;color:var(--gold)}.resultbig{font-size:52px;font-weight:900;letter-spacing:-2px;color:var(--gold);line-height:1}

.empty{border:1px dashed #5d758b;border-radius:12px;color:var(--muted);padding:22px;text-align:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px;padding:8px 12px;font-weight:700;min-height:40px}.tabs button.on{color:var(--gold);border-color:var(--gold)}
/* Audio library */
.chgroup{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}.chgroup summary{padding:12px 14px;cursor:pointer;font-weight:800;background:var(--panel2);list-style:none;display:flex;justify-content:space-between;gap:8px}
.trk{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:left;min-height:52px}
.trk.playing{box-shadow:inset 4px 0 var(--gold);background:#22364f}.trk .st{font-weight:900;color:var(--gold)}.trk.na{opacity:.75}
/* Dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0e1a2b;border-top:1px solid #3a5270;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #0008}
#dock .in{max-width:1160px;margin:auto}
#dock .t{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .ctl{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:6px;margin-top:6px;align-items:center}
#dock .ctl button{min-height:46px;border-radius:10px;border:1px solid #4b627c;background:#1b2d44;color:var(--fg);font-weight:800;font-size:15px}
#dock .ctl button.main{background:var(--gold);color:#142238;border-color:var(--gold)}
#dock .ctl button.next{background:#24434a;border-color:var(--teal);color:var(--teal)}
#dock input[type=range]{width:100%;accent-color:var(--gold);height:28px}
#dock .tm{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
#dock select{background:#1b2d44;color:var(--fg);border:1px solid #4b627c;border-radius:10px;min-height:46px;padding:0 6px}
#dock .msg{font-size:13px;margin-top:6px;display:none}#dock .msg.on{display:block}
#dock .msg.err{color:var(--red)}#dock .msg.tap{color:var(--gold)}
#dock.hidden{display:none}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:18px}.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:520px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock) + 16px);background:#24434a;color:#dff;border:1px solid var(--teal);padding:10px 16px;border-radius:10px;z-index:40;font-weight:700}
.foot{color:#879ab0;font-size:12px;margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.hidden{display:none!important}
@media(max-width:900px){.quiz-layout{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.head{display:block;padding:10px 12px}.brandmark{margin-bottom:8px}.topnav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.topnav button{white-space:nowrap}.wrap{padding:14px 11px 30px}.hero{padding:18px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.grid,.grid3{grid-template-columns:1fr}.prompt{font-size:17px}.choice{font-size:14px}.numbergrid{grid-template-columns:repeat(8,1fr)}}
@media print{header,#dock,.no-print,.btn,.topnav,.toast,.modal{display:none!important}body{background:#fff;color:#000;padding:0;font-size:11.5pt}.wrap{max-width:none;padding:0}.panel,.card,.hero,.stat,.sidebox{background:#fff;color:#000;border:1px solid #bbb;box-shadow:none}h1,h2,h3,.prompt{color:#000}.subtle,.caption,.lesson p{color:#222}.lesson h3{color:#000}.print-q{break-inside:avoid;margin:10px 0}.pb{break-before:page}table.t th{color:#000}.choice{background:#fff;color:#000}}

not opened in a signed-in browser by me."],["6","≥ 500 questions with 4 choices, rationales, tags, difficulty, topic IDs","implemented and tested (partial)","560 total, 340 unique concepts; KS tags pending manual."],["6","Five 100-question forms + holdout readiness check","implemented and tested","Forms rebuilt from exam-eligible pool by proposed weights; 40-item holdout."],["6","Flags, unanswered scoring, topic performance, remediation","implemented and tested","Scoring checked with automated tests."],["6","≥ 250 flashcards with spaced repetition","implemented and tested","270 cards; Leitner boxes."],["6","Progress export/import with migration from v3","implemented and tested","Auto-migrates v3 localStorage; imports v3 and v4 backups."],["7","Deployable source files, data, instructions","implemented and tested","Source tree + single-file build + README/CHANGELOG."]],"chapters":[[6,"17 items; 8 basic 3-choice. Covered fire triangle, CO; little on stoichiometry, air types, pyrolysis.","Full lesson; 10 new items incl. propane balancing, primary/secondary/excess air, impingement."],[7,"79 items but 64 are 6 calculation templates; concepts sound (3.412, HHV/LHV, R in series).","Lesson + 14 new items (therms, kW, overall efficiency, k vs R, comparative output)."],[8,"12 items, 5 basic; thin on direct-vent geometry and host-fireplace approval.","Lesson + 9 items (coaxial/co-linear, UL 127, inserts in factory-built units, log-set damper)."],[9,"17 items; standards mapping correct (NFPA 54/211, UL 127/1482/103/441). No EPA limits.","Lesson + 10 items (verified EPA 2.0/2.5 g/h, edition adoption, UL 1618)."],[10,"38 items (24 are R-series variants); no hearth-extension numbers or protector sizing.","Lesson + 13 items (verified IRC 16/8 & 20/12, Type 1/2, protector area, shields)."],[11,"17 items; 3-2-10 correct; no numeric termination or EVL problems beyond a template.","Lesson + 13 items (3-2-10 calculations, stack effect, oversized flue, EVL limit)."],[12,"10 items, mostly basic.","Lesson + 7 emergency/handoff items."],[13,"47 items (30 moisture variants); cord, EPA <20% correct.","Lesson + 13 items (basis conversion, face cord, catalytic bypass, NFPA 211 levels)."],[14,"55 items (32 consumption/pressure variants); good control coverage.","Lesson + 16 items (static vs operating, orifice size, altitude derate, EIA heating values)."],[15,"80 items (64 feed/runtime/EVL variants, 6 with '0.0 h' distractors).","Lesson + 11 items (verified PFI 2017 grade limits, switches, positive-pressure venting)."],[16,"31 items (20 electrical variants).","Lesson + 6 items (amps/Btu, media, outdoor listing, doors)."]]},"chapters":[{"id":1,"title":"What Is a Hearth Design Specialist?","focus":"The specialist as an advisor","points":["Client qualification","Appliance selection","Installation planning","Owner education"],"caution":"A confident but unverified technical claim is a red flag."},{"id":2,"title":"Using Your Sales Knowledge","focus":"Consultative sales techniques","points":["Understand before presenting","Features versus customer-specific benefits","Accurate technical claims","Direct the decision without overselling"],"caution":"Do not confuse a high product price with a suitable recommendation."},{"id":3,"title":"Using Your Client Knowledge","focus":"Understanding the customer and home","points":["Fuel and lifestyle preferences","Ambiance versus supplemental or primary heat","Operation and maintenance preferences","Existing versus new fireplace conditions"],"caution":"Do not promise emergency heat without checking outage operation."},{"id":4,"title":"Using Your Hearth Systems Knowledge","focus":"Product knowledge in the showroom","points":["Model-specific information","Sizing and location","Approved vent configuration","Heat distribution and accessories"],"caution":"A brochure cannot replace installation instructions."},{"id":5,"title":"Communication With Staff and Clients","focus":"Accurate communication and handoffs","points":["Record confirmed facts","Ask precise technical questions","Explain uncertainties to customers","Document responsibility and follow-up"],"caution":"A desired layout is not an approved installation."},{"id":6,"title":"Principles of Combustion","focus":"Combustion fundamentals","points":["Fuel + oxidizer + heat; 3 Ts: time, temperature, turbulence. Complete methane: CH₄ + 2O₂ → CO₂ + 2H₂O. Incomplete combustion can yield CO and soot.","Fuel, oxygen, and heat","Adequate combustion air","Complete versus incomplete combustion","Carbon monoxide hazards","Complete oxidation of methane produces CO₂ and H₂O; heat is released.","The balanced reaction conserves one carbon, four hydrogen and four oxygen atoms.","Theoretical air supplies the stoichiometric oxygen requirement.","Additional air can carry heat out of the system; adequate mixing and temperature still matter.","Secondary air helps burn gases released above the fuel bed.","Heating wood breaks down its constituents and produces gases and char.","Incomplete combustion can produce CO and soot.","Flash point concerns ignitable vapor from a liquid with an ignition source; autoignition concerns spontaneous ignition under specified conditions.","Evaporation requires energy that would otherwise heat the system."],"caution":"Odor and appearance cannot prove that combustion is safe."},{"id":7,"title":"Efficiency and Heat Transfer","focus":"How useful heat is delivered","points":["Output = input × efficiency; input = output ÷ efficiency. 1 W ≈ 3.412 BTU/h. R values add in series; if k is per inch in compatible units, R = thickness/k. HHV includes condensation heat; LHV excludes it.","Temperature, turbulence, time","Combustion versus heat-transfer efficiency","Conduction, convection, radiation","Compare ratings using the same basis","Heating value basis changes the denominator of an efficiency calculation.","Conduction transfers energy through a material by temperature difference.","Radiant energy travels across space without requiring contact.","A convection blower circulates room air across heated surfaces.","Output equals input multiplied by overall efficiency as a decimal.","Different rating methods may yield different percentages for similar performance.","R measures resistance to heat flow; for layers in series, compatible R-values add."],"caution":"Input rating alone is not delivered heat."},{"id":8,"title":"Appliance Types and Construction","focus":"Recognizing appliance families","points":["Factory-built fireplace systems","High-efficiency and freestanding heaters","Inserts and existing fireplaces","Heat delivery and construction","The installation form and listing determine how and where it may be used.","Factory-built systems must retain their evaluated configurations.","Direct vent systems are designed to isolate combustion air from room air.","Decorative products and heaters have different design and rating purposes.","Electric appliances may need electrical and clearance checks but do not combust fuel."],"caution":"Similar-looking system parts are not automatically interchangeable."},{"id":9,"title":"Codes and Standards for Hearth Appliances","focus":"Rules and approval structure","points":["Codes versus standards","Listing and labeling","Manufacturer instructions","Authority having jurisdiction and adopted editions","NFPA 54 is the National Fuel Gas Code; confirm the locally adopted code and edition.","NFPA 211 addresses these systems; exact requirements depend on adoption and application.","UL 127 covers factory-built fireplaces.","UL 1482 concerns solid-fuel room heaters.","UL 103 addresses factory-built chimneys.","UL 441 covers gas vents; select a vent approved for the appliance.","Emissions and safety evaluation serve separate purposes.","The AHJ administers applicable local requirements.","Codes regulate installation; listings establish evaluated product conditions."],"caution":"A first-edition book is not a current local code."},{"id":10,"title":"Installation Planning","focus":"From design concept to installation","points":["Compare the exact model clearance diagram, framing, hearth protection type and thermal requirement. Example R 0.7 + 0.6 = 1.3; this does not meet a required R 1.5.","Clearances to combustibles","Hearth and floor protection","Framing, location, and vent route","Service access and qualified review","A model may require one or both; verify construction and dimensions.","Clearance requirements may apply to concealed combustible material.","Use applicable fuel gas tables and qualified design; demand and pressure losses matter.","Requirements depend on construction, opening and listing.","Use the model's approved mantel clearance diagram.","Confirm the specific reference point in the installation documents."],"caution":"Noncombustible surface finishes do not automatically exempt hidden framing."},{"id":11,"title":"Venting Systems","focus":"Managing combustion exhaust","points":["3-2-10 common chimney roof rule: 3 ft above penetration and 2 ft above building portions within 10 horizontal ft. Not a generic direct-vent terminal rule. Draft depends on buoyancy, resistance and pressure.","Natural draft and house pressure","Masonry and factory-built chimneys","Gas and pellet venting families","Routing, sizing, and termination","Buoyancy drives a pressure difference influenced by height and temperature.","Cooling reduces the density difference and may encourage condensation.","Reverse flow can draw combustion products into occupied space.","Building depressurization can compete with natural draft.","This is a common chimney roof rule; verify exact applicability and exceptions.","Connector and chimney serve different purposes; use approved penetration assemblies.","Coaxial venting uses concentric paths, as specified by the listing.","Manufacturer vent tables account for fittings and layout.","Type B vent is not a universal vent for all fuels."],"caution":"A mechanical blower does not make any vent route acceptable."},{"id":12,"title":"Communication With Owners","focus":"The owner handoff","points":["Model-specific operation","Hot surfaces and safety barriers","Maintenance and inspection","Service contacts and manuals","Leave for fresh air and follow emergency guidance; do not troubleshoot an active CO hazard.","The glass and gasket can be functional parts of the tested assembly.","Owner service must remain within prescribed operating and maintenance tasks."],"caution":"Ease of operation does not mean maintenance-free."},{"id":13,"title":"Wood-Burning Hearth Systems","focus":"Wood appliance systems","points":["A full cord = 128 ft³ stacked. Wet basis = water/total wet mass; dry basis = water/dry mass. EPA recommends below 20% moisture for best burning; follow meter guidance.","Seasoned fuel and combustion","Open fireplaces, inserts, and stoves","Chimneys, creosote, and draft","Ash safety and periodic service","A nominal 4 × 4 × 8 ft stack has 128 cubic feet including air spaces.","EPA advises testing the interior of freshly split wood using the meter instructions.","EPA Burn Wise recommends dry firewood below 20%; follow fuel and meter guidance.","A coated catalyst lowers the temperature needed for oxidation of combustible gases and particles.","These features promote hot, mixed gas-phase combustion.","Unburned organic compounds can condense or deposit in cool flue passages.","Moisture and low temperatures can favor deposits.","An emission rate is not a heat rating.","Level 3 may require removal of concealed components; consult NFPA 211 for exact scope."],"caution":"Never burn unapproved fuel or assume an old chimney is suitable."},{"id":14,"title":"Gas Hearth Systems","focus":"Gas appliance systems","points":["Approximate study values: NG 1,000 BTU/ft³, propane vapor 2,500 BTU/ft³, liquid propane 91,500 BTU/gal. Specific gravity NG ≈ 0.6, LP vapor ≈ 1.5. 1 psi ≈ 27.7 in. w.c. Consumption = input/heating value. Actual specifications vary; never use example pressures as adjustment instructions.","Natural gas versus propane","Input, output, and fuel delivery","Vented, direct-vent, and vent-free categories","Installation, leaks, controls, and maintenance","Natural gas composition varies, but methane usually predominates.","Propane vapor is heavier than air; natural gas is typically around 0.6.","1 psi is about 27.7 inches of water column under standard conversion conditions.","A manometer measures pressure difference.","Inlet and manifold pressures are distinct measurement points.","Pressure can drop when gas demand exposes supply or piping limitations.","The orifice is selected for the approved fuel and burner design.","DSI uses spark at the main burner on approved designs.","A thermocouple uses the thermoelectric effect; a thermopile combines multiple junctions.","Thermopiles are used in some millivolt control systems.","A small current through the flame is used to confirm ignition in suitable electronic systems.","An oxygen depletion sensing pilot is not a CO detector.","Vent-free appliances require their specific listing and jurisdictional permission.","Co-linear uses distinct passages, commonly in approved insert configurations.","Control logic may stop fuel or require reset when a required proof fails."],"caution":"Never give improvised fuel conversions or gas pressure adjustments."},{"id":15,"title":"Pellet Hearth Systems","focus":"Pellet appliances","points":["Input = pellet BTU/lb × lb/h. Runtime = pellet mass ÷ feed rate. Equivalent vent length uses the actual model’s fitting factors and limits.","Hopper, auger, burn pot, blowers","Fuel quality and storage","Combustion-air and venting arrangements","Electrical dependence, cleaning, safety controls","Feed mechanisms meter solid fuel from the hopper.","It is distinct from the convection blower.","The switch is a safety interlock, not a gas analyzer.","Fines can affect fuel handling and feeding.","Fuel properties and combustion conditions may contribute to clinker formation.","Shutdown may include a controlled cool-down period.","Use the actual approved vent sizing instructions.","Ash and deposits can insulate surfaces and reduce transfer."],"caution":"Do not bypass a safety switch or assume operation during a power outage."},{"id":16,"title":"Other Hearth Appliances and Accessories","focus":"Specialty equipment and accessories","points":["Resistive electrical load: P=VI. 1 W ≈ 3.412 BTU/h; 1,500 W at 120 V ≈ 12.5 A and 5,118 BTU/h. Not circuit sizing guidance.","Manufacturer-approved media","Electric flame products","Indoor and outdoor applications","Protective screens, controls, and surrounds","Only the listed design establishes permissible heat routing and clearances.","Watts equal volts multiplied by amperes for a resistive load.","Product approval is conditional on intended environment.","A protective barrier must meet the actual appliance's requirements."],"caution":"A decorative accessory may affect a safety-critical arrangement."}],"questions":[{"id":"C01Q01","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"What should happen before recommending a specific appliance?","choices":["Qualify the customer's needs","Choose the highest priced model","Promise any design will fit"],"answer":0,"explanation":"Qualification makes the recommendation relevant.","source":"First-edition textbook, Chapter 1","difficulty":"Foundation","topicId":"L-C01Q01","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C01Q02","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"What best describes the specialist's role?","choices":["Take payment only","Guide the customer and facilitate the process","Perform every trade without qualifications"],"answer":1,"explanation":"The specialist links customers, products, and installation planning.","source":"First-edition textbook, Chapter 1","difficulty":"Foundation","topicId":"L-C01Q02","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C01Q03","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"Which is part of a proper owner handoff?","choices":["Explain operation and maintenance","Skip all safety discussions","Replace model instructions with guesses"],"answer":0,"explanation":"Customer education extends beyond the purchase.","source":"First-edition textbook, Chapter 1","difficulty":"Foundation","topicId":"L-C01Q03","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C01Q04","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"How should you handle an unknown technical requirement?","choices":["Make a confident estimate","Ignore the question","Verify with authoritative instructions"],"answer":2,"explanation":"Accuracy and trust require verification.","source":"First-edition textbook, Chapter 1","difficulty":"Foundation","topicId":"L-C01Q04","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C01Q05","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"When does a customer relationship ideally end?","choices":["At the quote","When the product is paid for","It can continue through installation and ownership"],"answer":2,"explanation":"The chapter emphasizes the longer customer relationship.","source":"First-edition textbook, Chapter 1","difficulty":"Foundation","topicId":"L-C01Q05","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C01Q06","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"A client wants you to promise that a fireplace can be installed before anyone has assessed the existing chimney. What response best fits the specialist's role?","choices":["Promise it and let the installer figure it out","Explain what can be selected now and what must be verified before installation approval","Refuse to discuss any product until the entire renovation is finished","Assume a masonry chimney is always suitable"],"answer":1,"explanation":"A specialist guides the process and explains uncertainties. Condition and compatibility of an existing chimney are project-specific; making an unverified promise or avoiding all discussion is not sound facilitation.","source":"First-edition textbook, Chapter 1","difficulty":"Applied scenario","topicId":"L-C01Q06","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C01Q07","chapter":1,"chapterName":"What Is a Hearth Design Specialist?","prompt":"At the end of a hearth showroom visit, the customer knows the price but not how the appliance will be maintained. What was missed?","choices":["A decorative upgrade","A standard sales technique","Owner education as part of the specialist's responsibilities","Nothing; maintenance begins only after warranty expires"],"answer":2,"explanation":"The first chapter frames customer education and a continuing relationship as core responsibilities. Owner maintenance and operating expectations belong in the selection process.","source":"First-edition textbook, Chapter 1","difficulty":"Applied scenario","topicId":"L-C01Q07","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q01","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"Which is a benefit rather than just a feature?","choices":["A model number","Convenient operation for a customer who values simplicity","A printed brochure"],"answer":1,"explanation":"Benefits connect product features to customer needs.","source":"First-edition textbook, Chapter 2","difficulty":"Foundation","topicId":"L-C02Q01","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q02","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"What should guide a product demonstration?","choices":["The customer's priorities","Every possible technical detail","Only the most expensive options"],"answer":0,"explanation":"Relevant demonstrations support decisions.","source":"First-edition textbook, Chapter 2","difficulty":"Foundation","topicId":"L-C02Q02","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q03","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"A product claim is not verified. What next?","choices":["Repeat it as fact","Look it up in the proper product information","Assume the competitor is wrong"],"answer":1,"explanation":"Technical knowledge includes knowing when to check.","source":"First-edition textbook, Chapter 2","difficulty":"Foundation","topicId":"L-C02Q03","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q04","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"Which selling approach is preferable?","choices":["Push a favorite fuel regardless of site","Ignore the budget and use","Listen, compare, and recommend"],"answer":2,"explanation":"Consultative sales is fit-driven.","source":"First-edition textbook, Chapter 2","difficulty":"Foundation","topicId":"L-C02Q04","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q05","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"Does a high input rating by itself guarantee best heating?","choices":["Yes","No","Only if the customer likes the color"],"answer":1,"explanation":"Sizing and delivered heat also matter.","source":"First-edition textbook, Chapter 2","difficulty":"Foundation","topicId":"L-C02Q05","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q06","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"A salesperson says, 'This remote has four buttons.' Which follow-up converts this feature into a customer-specific benefit?","choices":["It comes in a box","You can make simple adjustments without getting up, which matches your accessibility goal","It is our most expensive control","Every manufacturer makes a remote"],"answer":1,"explanation":"A benefit explains why a product feature matters to this buyer. The accessibility goal is what makes convenient remote operation meaningful.","source":"First-edition textbook, Chapter 2","difficulty":"Applied scenario","topicId":"L-C02Q06","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C02Q07","chapter":2,"chapterName":"Using Your Sales Knowledge","prompt":"Two units have similar appearances, but one has maintenance demands the client dislikes. The best recommendation should prioritize...","choices":["The unit with the larger margin regardless of use","Which unit is positioned closest to the entrance","The client's stated operating preferences and documented product characteristics","The unit with the most buttons"],"answe Eligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C03Q04","chapter":3,"chapterName":"Using Your Client Knowledge","prompt":"Which question explores an ownership preference?","choices":["How much cleaning are you comfortable with?","Would you like the tallest sales display?","Can I skip discussing maintenance?"],"answer":0,"explanation":"Operational burden affects suitability.","source":"First-edition textbook, Chapter 3","difficulty":"Foundation","topicId":"L-C03Q04","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C03Q05","chapter":3,"chapterName":"Using Your Client Knowledge","prompt":"Is one fuel always best for every customer?","choices":["Yes","No","Only in the first edition"],"answer":1,"explanation":"Evaluate needs and restrictions.","source":"First-edition textbook, Chapter 3","difficulty":"Foundation","topicId":"L-C03Q05","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C03Q06","chapter":3,"chapterName":"Using Your Client Knowledge","prompt":"The client says 'I need heat if the electricity goes out.' Which question most directly reduces the risk of a poor product choice?","choices":["What color of trim is preferred?","What is the appliance's documented electrical dependence and approved backup capability?","How tall is the display in the store?","Can we assume every gas pilot works during an outage?"],"answer":1,"explanation":"Emergency heating is a separate goal from ambiance. Operation during an outage must be verified for the exact appliance and its controls.","source":"First-edition textbook, Chapter 3","difficulty":"Applied scenario","topicId":"L-C03Q06","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C03Q07","chapter":3,"chapterName":"Using Your Client Knowledge","prompt":"A homeowner values quiet ambiance more than significant room heating. Which initial recommendation approach is strongest?","choices":["Treat maximum input as the only metric","Ignore noise and maintenance preferences","Screen options by appearance, operating experience, and the intended heating role","Always select the largest freestanding heater"],"answer":2,"explanation":"The customer has identified ambiance and a quiet operating experience. Suitability requires exploring those preferences as well as site and product constraints.","source":"First-edition textbook, Chapter 3","difficulty":"Applied scenario","topicId":"L-C03Q07","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q01","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"Which is the best installation reference?","choices":["A social-media photo","Specific product instructions and applicable rules","A generic advertisement"],"answer":1,"explanation":"The actual model controls installation details.","source":"First-edition textbook, Chapter 4","difficulty":"Foundation","topicId":"L-C04Q01","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q02","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"Is a physically fitting accessory automatically approved?","choices":["Yes","No","If it is the same color"],"answer":1,"explanation":"Compatibility is a listed design issue.","source":"First-edition textbook, Chapter 4","difficulty":"Foundation","topicId":"L-C04Q02","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q03","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"What belongs in a product-location discussion?","choices":["Approved clearances and vent route","Only appearance","Only the shipping weight"],"answer":0,"explanation":"Location affects safety and performance.","source":"First-edition textbook, Chapter 4","difficulty":"Foundation","topicId":"L-C04Q03","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q04","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"Which statement about venting is correct?","choices":["Any pipe will do","Venting is purely decorative","It is part of the designed hearth system"],"answer":2,"explanation":"Venting must be compatible and properly planned.","source":"First-edition textbook, Chapter 4","difficulty":"Foundation","topicId":"L-C04Q04","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q05","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"A customer wants whole-house heat from an appliance. Should you...","choices":["Promise it immediately","Clarify heating goals and system capabilities","Refer only to the fire color"],"answer":1,"explanation":"Performance expectations must be realistic.","source":"First-edition textbook, Chapter 4","difficulty":"Foundation","topicId":"L-C04Q05","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q06","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"A wall layout looks attractive but requires vent components from a different appliance brand. What should happen?","choices":["Use the parts if diameter matches","Check the exact listing and approved vent components before proposing the layout","Use adhesive to connect the components","Assume all vent systems are generic"],"answer":1,"explanation":"A listed appliance is designed for particular component systems and configurations. Similar dimensions do not establish compatibility.","source":"First-edition textbook, Chapter 4","difficulty":"Applied scenario","topicId":"L-C04Q06","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C04Q07","chapter":4,"chapterName":"Using Your Hearth Systems Knowledge","prompt":"A customer asks whether a high-input appliance will heat all rooms in a multi-story home. The best technical response is...","choices":["Input alone guarantees even heat distribution","The manufacturer's model number determines the room temperatures","Discuss useful output, distribution, the building, and the actual heating objective","Any circulating fireplace replaces a central heating system"],"answer":2,"explanation":"Heating experience depends on more than nominal input. Heat distribution, building conditions, and product function need evaluation.","source":"First-edition textbook, Chapter 4","difficulty":"Applied scenario","topicId":"L-C04Q07","quality":"legacy","examEligible":true,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C05Q01","chapter":5,"chapterName":"Communication With Staff and Clients","prompt":"Which is a confirmed fact?","choices":["Customer hopes vent can run through an attic","Manufacturer documents approve the route for the identified model","Salesperson thinks it looks possible"],"answer":1,"explanation":"Distinguish verified information from wishes.","source":"First-edition textbook, Chapter 5","difficulty":"Foundation","topicId":"L-C05Q01","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C05Q02","chapter":5,"chapterName":"Communication With Staff and Clients","prompt":"A technical question to a manufacturer should include...","choices":["Model and site context","Only a first name","An unrelated product photo"],"answer":0,"explanation":"Specific context helps produce a useful answer.","source":"First-edition textbook, Chapter 5","difficulty":"Foundation","topicId":"L-C05Q02","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C05Q03","chapter":5,"chapterName":"Communication With Staff and Clients","prompt":"Why record open questions?","choices":["To hide them","To make a sale appear complete","So responsibility and follow-up are clear"],"answer":2,"explanation":"Unresolved items should remain visible.","source":"First-edition textbook, Chapter 5","difficulty":"Foundation","topicId":"L-C05Q03","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C05Q04","chapter":5,"chapterName":"Communication With Staff and Clients","prompt":"What is the best way to discuss a delay?","choices":["State what is known and what is uncertain","Make up an ETA","Do not answer inquiries"],"answer":0,"explanation":"Clarity builds trust.","source":"First-edition textbook, Chapter 5","difficulty":"Foundation","topicId":"L-C05Q04","quality":"legacy-basic","examEligible":false,"ks":"pending-manual","ref":"HDS Reference Manual 1st ed. (2017) — page not yet mapped","why":null,"holdout":false,"origin":"v3"},{"id":"C05Q05","chapter":5,"cha inciples of Combustion","prompt":"How many molecules of O₂ are required to completely burn one molecule of propane (C₃H₈)?","choices":["5","2","3","8"],"answer":0,"explanation":"C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O: 10 oxygen atoms are needed (6 in CO₂ + 4 in H₂O).","why":[null,"2 O₂ balances methane, not propane.","3 matches the carbon count, not the oxygen demand.","8 matches the hydrogen atoms, not the O₂ molecules."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c6-propane-eq","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N002","chapter":6,"chapterName":"Principles of Combustion","prompt":"Air is roughly what fraction oxygen by volume, which is why burners must move far more air than the oxygen requirement alone?","choices":["About one-half","About four-fifths","About one-fifth","About one-tenth"],"answer":2,"explanation":"Air is ~21% oxygen (~78% nitrogen), so each unit of O₂ arrives with about four units of nitrogen.","why":["Oxygen is well under half of air.","Four-fifths is roughly the nitrogen fraction.",null,"One-tenth understates oxygen content."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c6-air-o2","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N003","chapter":6,"chapterName":"Principles of Combustion","prompt":"In a gas burner with a venturi and air shutter, the air drawn in and mixed with gas before the burner ports is called:","choices":["Secondary air","Dilution air","Excess air","Primary air"],"answer":3,"explanation":"Primary air is premixed with the fuel before or at ignition; secondary air reaches the flame from around it.","why":["Secondary air joins the flame after the ports.","Dilution air enters at a draft hood, downstream of combustion.","Excess air describes a quantity beyond stoichiometric, not where it enters.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c6-primary-secondary","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N004","chapter":6,"chapterName":"Principles of Combustion","prompt":"A stove operator leaves the primary air fully open on a small, hot coal bed for hours. Compared with a properly adjusted burn, the most likely effect is:","choices":["Higher overall efficiency because more oxygen is always better","More heat carried up the chimney by the extra air","Elimination of creosote under all conditions","Conversion of carbon dioxide into carbon monoxide"],"answer":1,"explanation":"Air beyond what combustion needs is heated and exhausted, carrying useful heat away and lowering efficiency.","why":["More air is not always better — excess air wastes heat.",null,"Air setting alone does not guarantee no creosote; temperature and fuel matter.","Excess air does not convert CO₂ to CO."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c6-excess-air","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N005","chapter":6,"chapterName":"Principles of Combustion","prompt":"In a wood fire, most of the visible flame during the main burn comes from:","choices":["Solid carbon burning at the log surface","Water vapor igniting after evaporation","Nitrogen from the air oxidizing","Combustible gases released by pyrolysis burning above the wood"],"answer":3,"explanation":"Pyrolysis releases volatile gases that burn as flame; char later burns as glowing coals.","why":["Surface char combustion produces glowing coals with little flame.","Water vapor is not a fuel.","Nitrogen is essentially inert in this context.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c6-pyrolysis-stage","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N006","chapter":6,"chapterName":"Principles of Combustion","prompt":"Carbon monoxide forms in a flame mainly because:","choices":["Carbon is only partially oxidized when oxygen, temperature, mixing or time is inadequate","Nitrogen combines with carbon","Too much hydrogen is present in natural gas","Water vapor reacts with carbon dioxide"],"answer":0,"explanation":"CO is the product of incomplete oxidation of carbon.","why":[null,"Nitrogen does not form CO.","Hydrogen content is not the cause.","This is not the mechanism in appliance flames."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c6-co-formation","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N007","chapter":6,"chapterName":"Principles of Combustion","prompt":"A homeowner rearranged the logs on a vented gas set so flames now strike the logs directly and black streaks appear. The best explanation is:","choices":["The gas pressure has increased automatically","Flame impingement is cooling the flame and causing incomplete combustion","The logs are too dry","The thermocouple is producing too much voltage"],"answer":1,"explanation":"Flame contacting a cooler surface quenches it, leaving unburned carbon (soot) and potentially CO. Logs must be placed per the manual.","why":["Rearranging logs doesn't change supply pressure.",null,"Ceramic logs don't have a moisture issue.","Thermocouple output does not cause sooting."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c6-flame-impingement","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N008","chapter":6,"chapterName":"Principles of Combustion","prompt":"Why does a load of wet firewood reduce firebox temperature?","choices":["Water raises the wood's heating value","Wet wood releases more oxygen","Heat is consumed evaporating the water","Moisture makes the baffle more efficient"],"answer":2,"explanation":"Energy goes into vaporizing water instead of heating the firebox.","why":["Water lowers usable heat.","Wood moisture is not an oxygen source.",null,"Moisture does not improve baffle performance."],"source":"Original v4 item; sources: S06","sources":["S06"],"difficulty":"Foundation","kind":"concept","topicId":"N-c6-wet-wood-temp","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N009","chapter":6,"chapterName":"Principles of Combustion","prompt":"A secondary-air tube array under a baffle mainly improves which of the three Ts for smoke combustion?","choices":["Turbulence (mixing) and temperature","Time only, by slowing the fire","Neither — it only cools the glass","Turbulence only by lowering temperature"],"answer":0,"explanation":"Preheated jets of secondary air mix oxygen into hot smoke, improving mixing and keeping reaction temperature up.","why":[null,"Time is helped by the baffle path, but the tubes primarily add mixing and heat.","Air-wash is a different feature.","They raise, not lower, temperature."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"concept","topicId":"N-c6-three-ts","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N010","chapter":6,"chapterName":"Principles of Combustion","prompt":"Which describes autoignition temperature?","choices":["The lowest temperature at which a liquid gives off ignitable vapor with a pilot present","The temperature at which wood begins to dry","The temperature at which a material ignites without an external flame or spark","The flame temperature of natural gas"],"answer":2,"explanation":"Autoignition requires no outside ignition source; flash point (choice A) does.","why":["That defines flash point.","Drying is not ignition.",null,"Flame temperature is a different property."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c6-autoignition","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N011","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"A rating of 40,000 Btu/h describes:","choices":["A quantity of energy","A temperature","A pressure","A rate of energy use"],"answer":3,"explanation":"Btu is a quantity; Btu per hour is a rate.","why":["Btu alone is a quantity.","Temperature is in °F.","Pressure is in in. w.c. or psi.",null],"source":"Original v4 item; sources: S13","sources":["S13"],"difficulty":"Foundation","kind":"concept","topicId":"N-c7-btu-vs-rate","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N012","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"An appliance burns at 25,000 Btu/h for 8 hours. How many therms of fuel energy are used?","choices":["0.2 therm","2.0 therms","20 therms","200 therms"],"answer":1,"explanation":"25,000 × 8 = 200,000 Btu ÷ 100,000 Btu/therm = 2.0 therms.","why":["Off by a factor of 10.",null,"Off by a factor of 10.","Confuses Btu with therms."],"source":"Original v4 item; sources: S13","sources":["S13"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c7-therms","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N013","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"Approximately how many Btu/h does a 2.5 kW resistance heater deliver?","choices":["733 Btu/h","2,500 Btu/h","34,120 Btu/h","8,530 Btu/h"],"answer":3,"explanation":"2.5 kW × 3,412 Btu/h per kW ≈ 8,530 Btu/h.","why":["Divides instead of multiplies.","Ignores the conversion factor.","Uses 10× the power.",null],"source":"Original v4 item; sources: S13","sources":["S13"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c7-kw","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N014","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"Combustion efficiency is 92% and heat-transfer efficiency is 78%. In the course's teaching model, overall efficiency is closest to:","choices":["72%","85%","170%","14%"],"answer":0,"explanation":"0.92 × 0.78 = 0.718 ≈ 72%.","why":[null,"Averages instead of multiplies.","Adds the percentages.","Subtracts the percentages."],"source":"Original v4 item; sources: MANUAL","sources":["MANUAL"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c7-overall","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N015","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"The same appliance test result is reported once on an HHV basis and once on an LHV basis. Which statement is correct?","choices":["Both percentages will be identical","The LHV-based efficiency will appear higher","The HHV-based efficiency will appear higher","Heating-value basis only affects electric appliances"],"answer":1,"explanation":"LHV is the smaller denominator, so the efficiency percentage appears higher.","why":["Basis changes the denominator.",null,"HHV is larger, giving a lower percentage.","Combustion fuels are the ones affected."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c7-hhv-lhv","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N016","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"Fireplace A: 45,000 Btu/h input at 55%. Fireplace B: 32,000 Btu/h input at 80%. Which delivers more heat to the room?","choices":["A, because input is higher","They are equal","B, about 25,600 vs 24,750 Btu/h","Cannot be compared using input and efficiency"],"answer":2,"explanation":"A: 45,000 × 0.55 = 24,750; B: 32,000 × 0.80 = 25,600 Btu/h.","why":["Input alone ignores efficiency.","The outputs differ slightly.",null,"Output = input × efficiency allows the comparison (if efficiencies share a basis)."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c7-input-compare","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N017","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"A space needs 22,500 Btu/h delivered. Using a 75% efficient appliance, the input required is:","choices":["30,000 Btu/h","16,875 Btu/h","22,500 Btu/h","28,125 Btu/h"],"answer":0,"explanation":"22,500 ÷ 0.75 = 30,000 Btu/h.","why":[null,"Multiplies instead of divides.","Ignores efficiency.","Adds 25% of output instead of dividing."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c7-input-needed","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N018","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"A stove sits on a stone slab over a wood subfloor. Heat reaching the subfloor through the stone is transferred mainly by:","choices":["Radiation","Forced convection","Conduction","Evaporation"],"answer":2,"explanation":"Heat passes through solid materials in contact by conduction.","why":["Radiation crosses open space.","No fan moves air through the stone.",null,"Not an evaporation process."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"concept","topicId":"N-c7-conduction","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N019","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"A ventilated wall shield spaced 1 in. off the wall reduces heat to the wall mainly by:","choices":["Increasing the stove's efficiency","Converting radiant heat into light","Raising the wall's k-value","Blocking radiation and letting convection carry heat away through the air gap"],"answer":3,"explanation":"The shield intercepts radiation; the ventilated gap lets air carry absorbed heat away.","why":["Shields do not change appliance efficiency.","Not how shields work.","Higher k would mean more conduction — the opposite.",null],"source":"Original v4 item; sources: S15","sources":["S15"],"difficulty":"Technical","kind":"concept","topicId":"N-c7-shield","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N020","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"Material X has k = 0.5 per inch and material Y has k = 1.0 per inch, both 1 in. thick. Which is true?","choices":["Y insulates better","X has R = 2.0 and insulates better","Both have R = 1.0","R cannot be found from k"],"answer":1,"explanation":"R = thickness ÷ k: X = 1 ÷ 0.5 = 2.0; Y = 1.0. Higher R = better insulator.","why":["Higher k conducts more heat.",null,"Only Y has R = 1.0.","R = thickness/k for a uniform layer."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c7-k-vs-r","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N021","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"A floor protector must total R ≥ 1.40. Layer 1: 3/4 in. of material with k = 0.75 per inch. Layer 2: R = 0.45. Does the assembly meet the requirement? (HYPO values)","choices":["No, R = 1.20","Yes, R = 1.80","No, R = 0.95","Yes, R = 1.45"],"answer":3,"explanation":"Layer 1 R = 0.75 ÷ 0.75 = 1.00; total = 1.00 + 0.45 = 1.45 ≥ 1.40.","why":["Arithmetic error.","Overstates layer 1.","Forgets layer 1's thickness.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c7-r-series","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N022","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"Which heat transfer mode lets glass warm a person's face before room air temperature changes?","choices":["Radiation","Conduction","Convection","Combustion"],"answer":0,"explanation":"Radiant (infrared) energy travels across space and warms surfaces it strikes.","why":[null,"Requires contact.","Requires moving air.","Combustion is the heat source, not the transfer mode."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"concept","topicId":"N-c7-radiant-feel","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N023","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"A circulating fireplace's room-air blower increases delivered heat primarily by:","choices":["Increasing burner input","Forced convection across the heat exchanger","Raising flue gas temperature","Improving combustion efficiency of the flame"],"answer":1,"explanation":"The blower moves more room air across hot surfaces, increasing heat transfer to the room.","why":["Input is set by the orifice/valve.",null,"Better heat transfer typically lowers flue temperature.","It acts on the room side, not the flame."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c7-blower","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N024","chapter":7,"chapterName":"Efficiency and Heat Transfer","prompt":"Why is a resistance electric heater described as converting essentially all electrical input to heat in the room?","choices":["It has a chimney that recovers heat","Electric heat is measured on an HHV basis","There is no flue loss; the energy is dissipated in the room","It uses a heat pump"],"answer":2,"explanation":"No combustion products leave the house, so nearly all input becomes room heat (generation losses occur at the power plant).","why":["No chimney exists.","Heating-value basis applies to fuels.",null,"Resistance heat is not a heat pump."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c7-elec-eff","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N025","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"A direct-vent gas fireplace:","choices":["Draws outdoor combustion air and exhausts outdoors through a sealed system","Uses room air for combustion and a B-vent","Exhausts into the room","Requires a masonry chimney"],"answer":0,"explanation":"Direct vent is sealed from the room air (coaxial or co-linear).","why":[null,"That describes natural-draft vented.","That describes vent-free.","It uses its own listed vent."],"source":"Original v4 item; sources: S12","sources":["S12"],"difficulty":"Foundation","kind":"concept","topicId":"N-c8-direct-vent","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N026","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"A co-linear direct-vent system in an existing chimney typically consists of:","choices":["One liner carrying exhaust; combustion air from the room","A pipe inside a pipe","Two parallel liners — one for air intake, one for exhaust","A Type B vent"],"answer":2,"explanation":"Co-linear uses two separate side-by-side passages; coaxial is pipe-in-pipe.","why":["That's natural-draft.","That's coaxial.",null,"B-vent is not direct vent."],"source":"Original v4 item; sources: S12","sources":["S12"],"difficulty":"Technical","kind":"concept","topicId":"N-c8-colinear","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N027","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"A wood-burning factory-built fireplace in the US is generally listed to:","choices":["UL 1482","ANSI Z21.88","UL 441","UL 127"],"answer":3,"explanation":"UL 127 covers factory-built fireplaces.","why":["UL 1482 is solid-fuel room heaters.","Z21.88 is vented gas fireplace heaters.","UL 441 is gas vents.",null],"source":"Original v4 item; sources: S16","sources":["S16"],"difficulty":"Technical","kind":"code","topicId":"N-c8-ul127","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N028","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"A customer wants a wood insert installed into a factory-built (zero-clearance) wood fireplace. What must be confirmed?","choices":["Only that the insert fits the opening","That both the insert listing and the fireplace manufacturer permit that combination, with the specified liner","That the existing chimney is masonry","Nothing, inserts are universal"],"answer":1,"explanation":"Many factory-built fireplaces prohibit inserts or permit only specific ones; the insert must also be listed for that host.","why":["Fit is not approval.",null,"A factory-built fireplace has a metal chimney.","Inserts are not universal."],"source":"Original v4 item; sources: S16","sources":["S16"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c8-insert-host","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N029","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"Compared with a radiant design, a circulating (convection) appliance:","choices":["Has no outer jacket","Cannot have a blower","Produces only radiant heat","Moves room air through a jacket or heat exchanger and may have different clearances"],"answer":3,"explanation":"The air jacket carries heat by convection and often cools the outer surfaces, which can change listed clearances.","why":["Circulating units have a jacket.","Many use blowers.","It adds convective delivery.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c8-circulating","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N030","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"Decorative vented gas logs are installed in a working masonry fireplace. Which is typically required?","choices":["A damper that is fixed open or a damper clamp per the instructions","Closing the damper completely during use","Replacing the chimney with B-vent","Removing the hearth extension"],"answer":0,"explanation":"Vented log sets rely on the fireplace flue; a permanently open damper or listed clamp prevents products spilling into the room.","why":[null,"A closed damper would spill combustion products.","The existing chimney is used if suitable.","The hearth extension remains."],"source":"Original v4 item; sources: S12","sources":["S12"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c8-logset-damper","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N031","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"Which is true of most pellet stoves?","choices":["They operate on natural draft only","They require electricity for the auger, blowers and controls","They need no vent","They burn cordwood"],"answer":1,"explanation":"Augers, combustion blowers and controls need power.","why":["Most rely on a combustion blower.",null,"They require a listed vent.","They burn pellets."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"concept","topicId":"N-c8-pellet-elec","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N032","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"Which feature is characteristic of a vent-free gas appliance?","choices":["Combustion products exhausted outdoors","A sealed glass front with outside air","An oxygen depletion sensing (ODS) pilot","A 3-2-10 chimney"],"answer":2,"explanation":"Vent-free units release products into the room and rely on an ODS, input limits and room size rules.","why":["That is vented.","That is direct vent.",null,"Vent-free units have no chimney."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c8-ventfree-room","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N033","chapter":8,"chapterName":"Appliance Types and Construction","prompt":"Which installation requires a listing specifically for that application?","choices":["A freestanding stove placed in a fireplace opening as an insert","A stove on a listed floor protector in the open room per its manual","An electric fireplace plugged into an outlet per its manual","A gas fireplace installed per its framing diagram"],"answer":0,"explanation":"A freestanding stove is not automatically approved as an insert; the hearth-mount or insert application must be in its listing.","why":[null,"That is its normal listed use.","That follows its instructions.","That follows its listing."],"source":"Original v4 item; sources: S16","sources":["S16"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c8-stove-insert","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N034","chapter":9,"chapterName":"Codes and Standards for Hearth Appliances","prompt":"Who determines whether an installation meets the requirements in force at the site?","choices":["The appliance salesperson","The appliance's testing laboratory","The authority having jurisdiction","The homeowner"],"answer":2,"explanation":"The AHJ enforces and interprets adopted requirements.","why":["Sales staff can advise, not approve.","The lab lists products, not site installations.",null,"Homeowners can't waive code."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"code","topicId":"N-c9-ahj","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N035","chapter":9,"chapterName":"Codes and Standards for Hearth Appliances","prompt":"ANSI Z223.1 and NFPA 54 are:","choices":["Competing gas codes with different content","A chimney standard and a stove standard","An EPA emission rule","The same National Fuel Gas Code published jointly"],"answer":3,"explanation":"The National Fuel Gas Code is jointly published as ANSI Z223.1 / NFPA 54.","why":["They are one document.","Both designations refer to the gas code.","Not EPA.",null],"source":"Original v4 item; sources: S10","sources":["S10"],"difficulty":"Technical","kind":"code","topicId":"N-c9-nfpa54","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N036","chapter":9,"chapterName":"Codes and Standards for Hearth Appliances","prompt":"Inspection levels for existing chimneys (Level I, II, III) are defined in:","choices":["NFPA 54","NFPA 211","UL 103","ASTM E1509"],"answer":1,"explanation":"NFPA 211 Chapter 15 covers inspection of existing chimneys.","why":["NFPA 54 is the gas code.",null,"UL 103 is a chimney product standard.","E1509 covers pellet heaters."],"source":"Original v4 item; sources: S11","sources":["S11"],"difficulty":"Technical","kind":"code","topicId":"N-c9-nfpa211","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N037","chapter":9,"chapterName":"Codes and Standards for Hearth Appliances","prompt":"Under the 2020 EPA NSPS step, a new wood room heater tested with crib wood must not exceed:","choices":["7.5 g/h","4.5 g/h","0.5 g/h","2.0 g/h"],"answer":3,"explanation":"2.0 g/h with crib wood (2.5 g/h if tested with cord wood).","why":["An older, superseded limit — far above the 2020 value.","4.5 g/h was the 2015 Step 1 limit.","Too
