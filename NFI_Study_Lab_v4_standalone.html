ocation.","Plastic and deck are combustible.",null,"Combustible and too close."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"scenario","topicId":"N-c12-ash","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N073","chapter":12,"chapterName":"Communication With Owners","prompt":"Owner reports a loud roaring sound and sparks from the chimney top. Correct response:","choices":["Get out, call the fire department, and have a professional inspection before reuse","Add more wood to finish the burn quickly","Open all windows and keep burning","Pour water down the chimney from the roof"],"answer":0,"explanation":"These are chimney fire signs; after any chimney fire NFPA 211 calls for a Level II inspection.","why":[null,"Feeds the fire.","Dangerous.","Dangerous and not a homeowner task."],"source":"Original v4 item; sources: S11","sources":["S11"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c12-chimney-fire","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N074","chapter":12,"chapterName":"Communication With Owners","prompt":"Why must owners keep children away from fireplace glass after shutdown?","choices":["Glass cools instantly","Glass becomes electrically charged","Glass and surrounding surfaces stay hot well after the flame is off","Only vent-free units get hot"],"answer":2,"explanation":"Surfaces retain heat.","why":["False.","Not the hazard.",null,"All types can be hot."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"concept","topicId":"N-c12-glass-hot","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N075","chapter":12,"chapterName":"Communication With Owners","prompt":"An owner asks how to jumper the pellet stove's vacuum switch to stop nuisance shutdowns. The specialist should:","choices":["Explain how to jumper it","Suggest taping the door gasket","Suggest increasing feed rate","Explain the switch is a safety, advise not to operate if faulting persists, and schedule service"],"answer":3,"explanation":"Never coach bypassing safeties; nuisance trips usually indicate a dirty vent, gasket or blower issue.","why":["Unsafe.","Improvised.","Improvised.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c12-bypass","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N076","chapter":12,"chapterName":"Communication With Owners","prompt":"Which handoff item is most important to leave with the owner?","choices":["The showroom brochure","The installed model's owner manual with model/serial and service contacts","A competitor's price list","A generic manual for a similar model"],"answer":1,"explanation":"Operation and maintenance are model-specific.","why":["Not operating instructions.",null,"Irrelevant.","Wrong model."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"concept","topicId":"N-c12-handoff-docs","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N077","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"A full cord of stacked wood occupies:","choices":["64 ft³","100 ft³","256 ft³","128 ft³"],"answer":3,"explanation":"4 × 4 × 8 ft = 128 ft³.","why":["Half a cord.","Not a standard.","Two cords.",null],"source":"Original v4 item; sources: MANUAL","sources":["MANUAL"],"difficulty":"Foundation","kind":"calculation","topicId":"N-c13-cord","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N078","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"A stack 4 ft high × 8 ft long of 12-in. pieces is approximately what fraction of a full cord?","choices":["1/4","1/3","1/2","Full cord"],"answer":0,"explanation":"4 × 8 × 1 = 32 ft³ ÷ 128 = 0.25.","why":[null,"That's for 16-in. pieces.","Would need 24-in. pieces.","Needs 4-ft depth."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c13-face-cord","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N079","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"A split weighs 15 lb; oven-dried it weighs 12 lb. Wet-basis moisture content:","choices":["25%","20%","12%","80%"],"answer":1,"explanation":"Water = 3 lb; 3 ÷ 15 = 20% wet basis (25% dry basis).","why":["That's dry basis.",null,"Arithmetic error.","Dry fraction, not moisture."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c13-mc-wet","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N080","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"Wood measured at 25% dry basis is how much on a wet basis?","choices":["25%","33%","20%","15%"],"answer":2,"explanation":"MC_wet = 0.25 ÷ 1.25 = 0.20.","why":["Basis changes the number.","That's 25% wet → 33% dry, reversed.",null,"Arithmetic error."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"calculation","topicId":"N-c13-mc-convert","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N081","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"Where should a moisture meter reading be taken?","choices":["On a freshly split interior face","On the bark","On the end grain after rain","On the stove top"],"answer":0,"explanation":"EPA guidance: split the piece and test the newly split face.","why":[null,"Bark misleads.","Wet end grain misleads.","Irrelevant."],"source":"Original v4 item; sources: S06","sources":["S06"],"difficulty":"Foundation","kind":"concept","topicId":"N-c13-meter","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N082","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"Which practice best seasons firewood?","choices":["Unsplit logs under a full tarp on the ground","Indoors next to the stove for a week","Split, stacked off the ground with airflow, top covered","Stacked against the house siding uncovered"],"answer":2,"explanation":"Splitting and airflow speed drying; covering the top sheds rain.","why":["Traps moisture.","Too short and a fire hazard.",null,"Moisture and fire-safety issues."],"source":"Original v4 item; sources: S06","sources":["S06"],"difficulty":"Foundation","kind":"concept","topicId":"N-c13-seasoning","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N083","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"A catalytic combustor:","choices":["Eliminates the need for dry fuel","Never needs replacement","Increases fuel moisture","Lets smoke oxidize at a lower temperature than normal"],"answer":3,"explanation":"The catalyst coating lowers the temperature needed to burn smoke; it degrades over time.","why":["Wet wood still harms it.","It wears out.","Irrelevant.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c13-catalyst","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N084","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"Why does a catalytic stove have a bypass damper?","choices":["To reduce clearance","To route smoke around the catalyst during startup and reloading until it reaches operating temperature","To meter pellets","To measure draft"],"answer":1,"explanation":"A cold catalyst adds restriction and won't light off; the bypass is opened at startup.","why":["Not its purpose.",null,"Not a pellet appliance.","Not a gauge."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c13-bypass-damper","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N085","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"Which group of features characterizes a noncatalytic clean-burn stove?","choices":["Catalyst and bypass damper","Auger and hopper","ODS pilot","Insulated firebox, baffle and preheated secondary air tubes"],"answer":3,"explanation":"These maintain temperature, time and turbulence for smoke combustion.","why":["That is catalytic.","That is pellet.","That is vent-free gas.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Technical","kind":"concept","topicId":"N-c13-noncat","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N086","chapter":13,"chapterName":"Wood-Burning Hearth Systems","prompt":"The most difficult form of creosote to remove is typically:","choices":["Hard, glazed (tar-like, shiny) deposits","Light flaky soot","Fly ash","Pellet fines"],"answer":0,"explanation":"Glazed creosote is chapterName":"Wood-Burning Hearth Systems","prompt":"A wood insert is going into a masonry fireplace with a 12 × 16 in. clay flue. Typical requirement?","choices":["A full-length listed liner sized to the insert outlet, per the insert instructions and code","Vent into the smoke chamber with no liner","A Type B vent liner","Only a top-sealing cap"],"answer":0,"explanation":"Many listings and codes require a full-length liner from the insert to the top of the chimney.","why":[null,"Creates an oversized, cold flue path.","B-vent is never for wood.","Doesn't address sizing."],"source":"Original v4 item; sources: S16","sources":["S16"],"difficulty":"Applied scenario","kind":"scenario","topicId":"N-c13-insert-liner","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N090","chapter":14,"chapterName":"Gas Hearth Systems","prompt":"Propane vapor, with a specific gravity of about 1.5, will tend to:","choices":["Rise to the ceiling","Mix evenly instantly","Settle in low areas","Turn to liquid at room pressure"],"answer":2,"explanation":"Heavier than air: leaks collect low.","why":["Natural gas (≈0.6) rises.","Not instantly.",null,"Propane is vapor at room pressure."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Foundation","kind":"concept","topicId":"N-c14-sg","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N091","chapter":14,"chapterName":"Gas Hearth Systems","prompt":"A propane second-stage regulator outlet of 11 in. w.c. equals about:","choices":["2.5 psi","11 psi","27.7 psi","0.4 psi"],"answer":3,"explanation":"11 ÷ 27.7 ≈ 0.40 psi.","why":["Off by a factor.","Confuses units.","That's 1 psi in w.c.",null],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c14-psi-wc","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N092","chapter":14,"chapterName":"Gas Hearth Systems","prompt":"2 psi delivered by an elevated-pressure system equals about:","choices":["13.9 in. w.c.","55.4 in. w.c.","27.7 in. w.c.","7.0 in. w.c."],"answer":1,"explanation":"2 × 27.7 = 55.4 in. w.c.","why":["That's 0.5 psi.",null,"That's 1 psi.","Typical NG supply, not 2 psi."],"source":"Original v4 item; sources: HYPO","sources":["HYPO"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c14-wc-psi2","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origin":"v4"},{"id":"N093","chapter":14,"chapterName":"Gas Hearth Systems","prompt":"A 31,080 Btu/h natural-gas appliance at the EIA average of 1,036 Btu/ft³ uses about:","choices":["3 ft³/h","300 ft³/h","1,036 ft³/h","30 ft³/h"],"answer":3,"explanation":"31,080 ÷ 1,036 = 30 ft³/h.","why":["Off by 10.","Off by 10.","Confuses units.",null],"source":"Original v4 item; sources: S13","sources":["S13"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c14-ng-flow","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":true,"origin":"v4"},{"id":"N094","chapter":14,"chapterName":"Gas Hearth Systems","prompt":"A 30,000 Btu/h propane fireplace runs 10 hours. Using 91,452 Btu/gal, liquid propane used is about:","choices":["3.3 gal","0.33 gal","33 gal","10 gal"],"answer":0,"explanation":"300,000 ÷ 91,452 ≈ 3.28 gal.","why":[null,"That's one hour.","Off by 10.","Not related."],"source":"Original v4 item; sources: S13","sources":["S13"],"difficulty":"Applied scenario","kind":"calculation","topicId":"N-c14-lp-gal","quality":"v4","examEligible":true,"ks":"pending-manual","ref":"Exam-reference page pending (manual not received)","holdout":false,"origi :"EXAM","title":"Final Certification Review and Practice Exam","secs":126.395,"url":"https://resource2.heygen.ai/text_to_speech/0fbce8d83fbf41b7be8e3211b433f2a2/1d9e45674c7b487fa61ff0cbaed0d1d4/id=ffce54adaeb4491096b70d22349f73f0.mp3","chapter":0,"duration":"2:06","kind":"quick-review","remoteUrl":"https://resource2.heygen.ai/text_to_speech/0fbce8d83fbf41b7be8e3211b433f2a2/1d9e45674c7b487fa61ff0cbaed0d1d4/id=ffce54adaeb4491096b70d22349f73f0.mp3","file":"audio/tori-exam-final-certification-review-a.mp3","status":"remote-verified","check":{"status":206,"contentType":"audio/mpeg","bytes":2022922,"cors":"*","byteRange":true,"checkedAt":"2026-11-24","checkedIn":"Claude desktop built-in browser (Chromium/Electron 45, Windows)"},"transcript":null}],"masteryTracks":[{"id":"CH06-01","lessonId":"ch06-01","title":"Combustion fundamentals: what has to happen for fuel to burn cleanly","chapter":6,"secs":491,"duration":null,"kind":"mastery","file":"audio/ch06-01-combustion-fundamentals-.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH07-01","lessonId":"ch07-01","title":"Energy, efficiency and heat transfer","chapter":7,"secs":391,"duration":null,"kind":"mastery","file":"audio/ch07-01-energy-efficiency-and-he.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH08-01","lessonId":"ch08-01","title":"Hearth appliance families and why listing defines the application","chapter":8,"secs":308,"duration":null,"kind":"mastery","file":"audio/ch08-01-hearth-appliance-familie.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH09-01","lessonId":"ch09-01","title":"Codes, standards, listings and the AHJ","chapter":9,"secs":302,"duration":null,"kind":"mastery","file":"audio/ch09-01-codes-standards-listings.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH10-01","lessonId":"ch10-01","title":"Installation planning: clearances, protection and access","chapter":10,"secs":342,"duration":null,"kind":"mastery","file":"audio/ch10-01-installation-planning-cl.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH11-01","lessonId":"ch11-01","title":"Venting: draft, pressure and vent systems","chapter":11,"secs":355,"duration":null,"kind":"mastery","file":"audio/ch11-01-venting-draft-pressure-a.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH12-01","lessonId":"ch12-01","title":"Communicating with owners: operation, safety and handoff","chapter":12,"secs":264,"duration":null,"kind":"mastery","file":"audio/ch12-01-communicating-with-owner.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH13-01","lessonId":"ch13-01","title":"Wood systems: fuel, technology, creosote and chimneys","chapter":13,"secs":353,"duration":null,"kind":"mastery","file":"audio/ch13-01-wood-systems-fuel-techno.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH14-01","lessonId":"ch14-01","title":"Gas systems: fuels, pressure, controls and safety","chapter":14,"secs":401,"duration":null,"kind":"mastery","file":"audio/ch14-01-gas-systems-fuels-pressu.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH15-01","lessonId":"ch15-01","title":"Pellet systems: fuel, feed, airflow and venting","chapter":15,"secs":306,"duration":null,"kind":"mastery","file":"audio/ch15-01-pellet-systems-fuel-feed.mp3","url":null,"status":"script-ready-audio-not-generated"},{"id":"CH16-01","lessonId":"ch16-01","title":"Other appliances and accessories","chapter":16,"secs":220,"duration":null,"kind":"mastery","file":"audio/ch16-01-other-appliances-and-acc.mp3","url":null,"status":"script-ready-audio-not-generated"}],"lessons":[{"id":"ch06-01","chapter":6,"title":"Combustion fundamentals: what has to happen for fuel to burn cleanly","objectives":["Name the three conditions for combustion and explain how each is controlled in a hearth appliance.","Write and balance the complete combustion equation for methane and state its products.","Distinguish theoretical (stoichiometric) air, excess air, primary air and secondary air.","Explain pyrolysis and why wood burns in stages.","Explain how carbon monoxide forms and why flame appearance cannot rule it out."],"sections":[{"h":"The fire triangle — and why the specialist cares","body":"Combustion needs fuel, oxygen and heat at the same time and place. Remove any one and the fire goes out; starve or cool any one and the fire burns poorly. Every hearth product is a machine for controlling those three things: the fuel is metered (a gas orifice, a pellet auger, a log load the owner chooses), oxygen arrives through designed air paths, and heat is held where combustion happens by the firebox, refractory and baffles. When a customer proposes a change — different media on a burner, a blocked air inlet, a different fuel — the question to ask is which side of the triangle the change disturbs."},{"h":"Complete combustion and its chemistry","body":"In complete combustion every carbon atom in the fuel ends up as carbon dioxide and every hydrogen atom ends up as water vapor, and heat is released. For methane, the main component of natural gas, the balanced reaction is: one CH4 plus two O2 gives one CO2 plus two H2O. Count it: one carbon on each side, four hydrogens on each side, four oxygens on each side. Propane, C3H8, needs five O2 per molecule and produces three CO2 and four H2O — more oxygen per unit of fuel, which is one reason propane and natural gas burners are not interchangeable without an approved conversion. Air is roughly one-fifth oxygen, so the burner must draw in a much larger volume of air than the oxygen figure alone suggests."},{"h":"Theoretical air, excess air, primary and secondary air","body":"Theoretical, or stoichiometric, air is the exact amount of air that contains just enough oxygen to burn the fuel completely. Real appliances never mix fuel and air perfectly, so they are designed with some excess air to make sure every fuel molecule finds oxygen. Too little excess air leaves unburned fuel and carbon monoxide. Too much excess air carries heat up the vent and can cool the flame, which lowers efficiency and, in a wood fire, can itself cause smoky, incomplete combustion. Primary air is mixed with the fuel before or at the point of ignition — the air drawn into a gas burner's venturi, or the air entering under or into a wood fuel bed. Secondary air is introduced above or after the primary flame zone to finish burning the gases that primary combustion released. In a modern noncatalytic wood stove, preheated secondary air enters through tubes under the baffle so the smoke burns before it leaves the firebox."},{"h":"Ignition, flash point and autoignition","body":"A fuel must reach its ignition temperature before it will sustain combustion. Flash point applies to liquids: it is the lowest temperature at which the liquid gives off enough vapor to ignite briefly when an outside ignition source is present. Autoignition temperature is the temperature at which a substance ignites with no spark or flame at all. A pilot or spark supplies the ignition source for gas; for wood, kindling supplies enough heat to start pyrolysis."},{"h":"Pyrolysis and the stages of a wood fire","body":"Wood does not burn as a solid at first. When heated it first gives up water, then — roughly as it passes a few hundred degrees Fahrenheit — begins pyrolysis, the thermal breakdown of the wood into combustible gases, tar droplets and a carbon-rich char. The visible flames of a wood fire are mostly those gases burning above the wood. When the volatiles are gone, the remaining charcoal burns at the surface as glowing coals with little flame. That is why a wood appliance needs both an air supply to the fuel bed and secondary air to the gases above it, and why a load of wet wood, which must spend energy boiling off water, burns cooler and smokier."},{"h":"Incomplete combustion and carbon monoxide","body":"When oxygen, temperature, mixing or time is inadequate, combustion stops part-way. Carbon is only partly oxidized to carbon monoxide, and unburned hydrocarbons and soot leave the flame. Carbon monoxide is colorless and odorless and is a poison because it binds to hemoglobin far more readily than oxygen. A tidy-looking flame does not prove that combustion is complete, and a lack of smell proves nothing. Signs worth escalating include new or unusual sooting, flame impingement on logs or glass, a smell of exhaust, condensation or staining near terminations, and of course any CO alarm. The specialist's job is not to diagnose combustion with eyes and nose, but to recognize these signs, stop improvised fixes, and route the problem to qualified service."},{"h":"The three Ts","body":"A useful summary of combustion quality is temperature, turbulence and time. The gases must be hot enough to react, mixed well enough with oxygen, and kept in the hot zone long enough to finish burning. Baffles lengthen the path and time; insulated fireboxes and refractory keep temperature up; secondary air jets add turbulence. Each modern clean-burn feature can be explained as improving one or more of the three Ts."}],"worked":[{"q":"Balance propane combustion.","a":"C3H8 + 5 O2 → 3 CO2 + 4 H2O. Carbon 3 = 3; hydrogen 8 = 8; oxygen 10 = 6 + 4."},{"q":"Why does a smoldering, air-starved wood fire make more creosote than a hot fire?","a":"Low temperature and low oxygen interrupt pyrolysis-gas combustion (temperature and turbulence fail), so tar vapors leave unburned and condense in a cool flue."}],"misconceptions":["More air always means cleaner, safer combustion — false: excess air cools the flame and wastes heat; airflow must match the tested design.","A blue flame means no carbon monoxide — false: appearance cannot rule out CO.","Primary and secondary air are the same air at different times — they enter different zones for different jobs."],"src":["HYPO"],"manualCheck":"Confirm the manual's exact definitions of theoretical air, excess air and the stages of wood combustion; note page numbers.","segments":["[Chapter 6. Combustion fundamentals: what has to happen for fuel to burn cleanly.] [pause 1s]\n\nIn this lesson you will learn to: Name the three conditions for combustion and explain how each is controlled in a hearth appliance; Write and balance the complete combustion equation for methane and state its products; Distinguish theoretical (stoichiometric) air, excess air, primary air and secondary air; Explain pyrolysis and why wood burns in stages; Explain how carbon monoxide forms and why flame appearance cannot rule it out. [pause 1s]\n\nThe fire triangle — and why the specialist cares. [pause 0.5s] Combustion needs fuel, oxygen and heat at the same time and place. Remove any one and the fire goes out; starve or cool any one and the fire burns poorly. Every hearth product is a machine for controlling those three things: the fuel is metered (a gas orifice, a pellet auger, a log load the owner chooses), oxygen arrives through designed air paths, and heat is held where combustion happens by the firebox, refractory and baffles. When a customer proposes a change — different media on a burner, a blocked air inlet, a different fuel — the question to ask is which side of the triangle the change disturbs.\n\nComplete combustion and its chemistry. [pause 0.5s] In complete combustion every carbon atom in the fuel ends up as carbon dioxide and every hydrogen atom ends up as water vapor, and heat is released. For methane, the main component of natural gas, the balanced reaction is: one C-H-four plus two O-two gives one C-O-two plus two H-two-O. Count it: one carbon on each side, four hydrogens on each side, four oxygens on each side. Propane, C-three-H-eight, needs five O-two per molecule and produces three C-O-two and four H-two-O — more oxygen per unit of fuel, which is one reason propane and natural gas burners are not interchangeable without an approved conversion. Air is roughly one-fifth oxygen, so the burner must draw in a much larger volume of air than the oxygen figure alone suggests.\n\nTheoretical air, excess air, primary and secondary air. [pause 0.5s] Theoretical, or stoichiometric, air is the exact amount of air that contains just enough oxygen to burn the fuel completely. Real appliances never mix fuel and air perfectly, so they are designed with some excess air to make sure every fuel molecule finds oxygen. Too little excess air leaves unburned fuel and carbon monoxide. Too much excess air carries heat up the vent and can cool the flame, which lowers efficiency and, in a wood fire, can itself cause smoky, incomplete combustion. Primary air is mixed with the fuel before or at the point of ignition — the air drawn into a gas burner's venturi, or the air entering under or into a wood fuel bed. Secondary air is introduced above or after the primary flame zone to finish burning the gases that primary combustion released. In a modern noncatalytic wood stove, preheated secondary air enters through tubes under the baffle so the smoke burns before it leaves the firebox.\n\nIgnition, flash point and autoignition. [pause 0.5s] A fuel must reach its ignition temperature before it will sustain combustion. Flash point applies to liquids: it is the lowest temperature at which the liquid gives off enough vapor to ignite briefly when an outside ignition source is present. Autoignition temperature is the temperature at which a substance ignites with no spark or flame at all. A pilot or spark supplies the ignition source for gas; for wood, kindling supplies enough heat to start pyrolysis.\n\nPyrolysis and the stages of a wood fire. [pause 0.5s] Wood does not burn as a solid at first. When heated it first gives up water, then — roughly as it passes a few hundred degrees Fahrenheit — begins pyrolysis, the thermal breakdown of the wood into combustible gases, tar droplets and a carbon-rich char. The visible flames of a wood fire are mostly those gases burning above the wood. When the volatiles are gone, the remaining charcoal burns at the surface as glowing coals with little flame. That is why a wood appliance needs both an air supply to the fuel bed and secondary air to the gases above it, and why a load of wet wood, which must spend energy boiling off water, burns cooler and smokier.","Incomplete combustion and carbon monoxide. [pause 0.5s] When oxygen, temperature, mixing or time is inadequate, combustion stops part-way. Carbon is only partly oxidized to carbon monoxide, and unburned hydrocarbons and soot leave the flame. Carbon monoxide is colorless and odorless and is a poison because it binds to hemoglobin far more readily than oxygen. A tidy-looking flame does not prove that combustion is complete, and a lack of smell proves nothing. Signs worth escalating include new or unusual sooting, flame impingement on logs or glass, a smell of exhaust, condensation or staining near terminations, and of course any C-O alarm. The specialist's job is not to diagnose combustion with eyes and nose, but to recognize these signs, stop improvised fixes, and route the problem to qualified service.\n\nThe three Ts. [pause 0.5s] A useful summary of combustion quality is temperature, turbulence and time. The gases must be hot enough to react, mixed well enough with oxygen, and kept in the hot zone long enough to finish burning. Baffles lengthen the path and time; insulated fireboxes and refractory keep temperature up; secondary air jets add turbulence. Each modern clean-burn feature can be explained as improving one or more of the three Ts.\n\nWorked example 1. Balance propane combustion. [pause 3s — try it before the answer] Here is the solution. C-three-H-eight + 5 O-two , so 3 C-O-two + 4 H-two-O. Carbon 3 = 3; hydrogen 8 = 8; oxygen 10 = 6 + 4.\n\nWorked example 2. Why does a smoldering, air-starved wood fire make more creosote than a hot fire? [pause 3s — try it before the answer] Here is the solution. Low temperature and low oxygen interrupt pyrolysis-gas combustion (temperature and turbulence fail), so tar vapors leave unburned and condense in a cool flue.\n\nCommon misconceptions. Misconception: More air always means cleaner, safer combustion — false: excess air cools the flame and wastes heat; airflow must match the tested design. Misconception: A blue flame means no carbon monoxide — false: appearance cannot rule out C-O. Misconception: Primary and secondary air are the same air at different times — they enter different zones for different jobs.\n\nQuick check. Pause the audio and answer: Name the three conditions for combustion and explain how each is controlled in a hearth appliance. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":1145,"estSecs":491},{"id":"ch07-01","chapter":7,"title":"Energy, efficiency and heat transfer","objectives":["Distinguish a Btu (quantity) from Btu per hour (rate) and convert watts to Btu/h.","Calculate output from input and efficiency, and input from a required output.","Explain combustion, heat-transfer and overall efficiency and why HHV/LHV basis matters.","Classify heat movement as conduction, convection or radiation in hearth scenarios.","Use R-values and k-values for layers in series."],"sections":[{"h":"Btu versus Btu per hour","body":"A British thermal unit is a quantity of heat: the energy needed to raise one pound of water by one degree Fahrenheit. A Btu per hour is a rate — how fast an appliance converts fuel energy. Ratings on hearth appliances are rates. If a fireplace burns at 40,000 Btu per hour for three hours, it consumes 120,000 Btu, or 1.2 therms, because one therm equals 100,000 Btu. Electric heat converts at 3,412 Btu per hour per kilowatt, so a 1,500-watt heater delivers about 5,118 Btu per hour."},{"h":"Input is not output","body":"Input is the rate at which fuel energy enters the appliance. Output is the rate at which useful heat reaches the room. The ratio is efficiency. Output equals input times efficiency as a decimal; input equals the required output divided by efficiency. A 50,000 Btu per hour decorative fireplace with poor efficiency may deliver less heat to the room than a 30,000 Btu per hour high-efficiency heater. When a customer compares appliances, make sure you compare output to output, or efficiency figures measured the same way."},{"h":"Combustion, heat-transfer and overall efficiency","body":"Combustion efficiency describes how completely the fuel is burned. Heat-transfer efficiency describes how much of the heat produced is transferred into the living space instead of leaving through the vent. Overall efficiency combines the two; in training it is often expressed as combustion efficiency times heat-transfer efficiency. A stove that burns cleanly but sends very hot gases up the chimney has good combustion and poor heat transfer. Published efficiencies are produced by specific test methods, and the same appliance can show different percentages under different methods."},{"h":"Higher and lower heating value","body":"Burning hydrogen-containing fuels creates water vapor. Higher heating value (HHV) counts the heat that would be recovered if that vapor condensed; lower heating value (LHV) does not. Because HHV is the larger number, an efficiency calculated on an LHV basis looks higher than the same performance expressed on an HHV basis. Two efficiency numbers are comparable only if they share the same basis and test method."},{"h":"Conduction, convection and radiation","body":"Conduction moves heat through or between materials in contact — through a steel stove body, through a fastener into framing, or from a hot hearth into the floor beneath. Convection moves heat with a moving fluid: room air rising past a hot stove, or a blower pushing air through a heat exchanger. Natural convection relies on buoyancy; forced convection uses a fan. Radiation moves heat as infrared energy across open space and warms the surfaces it strikes without first warming the air — the warmth on your face from glass or a fire. Clearances to combustibles exist mostly because of radiant and conducted heat; heat shields work by blocking radiation and creating a ventilated air space so convection carries heat away."},{"h":"Thermal resistance: R and k","body":"The k-value, or thermal conductivity, describes how easily heat passes through a material, usually per inch of thickness. R-value is resistance to heat flow. For a uniform material, R equals thickness divided by k. Higher R means better insulation, higher k means worse. For layers in series, R-values add. Floor-protector requirements are sometimes stated as a minimum R-value; the specialist must compare the R of the proposed materials — from their documentation — with the value the appliance listing requires, and never assume a decorative tile is an insulator."}],"worked":[{"q":"A gas insert has 32,000 Btu/h input and 75% efficiency. Output?","a":"32,000 × 0.75 = 24,000 Btu/h."},{"q":"A room needs 20,000 Btu/h delivered. With an 80% efficient appliance, what input?","a":"20,000 ÷ 0.80 = 25,000 Btu/h."},{"q":"A floor protector needs R ≥ 1.00. Material A has k = 0.80 per inch. Is one 1/2-inch board enough? (HYPO values)","a":"R = 0.5 ÷ 0.80 = 0.625 — not enough. Two boards → 1.25 — meets the hypothetical requirement."}],"misconceptions":["A bigger input rating always means more heat in the room — only if efficiency is equal.","A lower k-value means a worse insulator — reversed: low k = low conductivity = better insulator.","Tile or stone over wood makes the floor noncombustible — the combustible beneath still conducts and can char."],"src":["S13","HYPO"],"manualCheck":"Confirm the manual's terms for efficiency (e.g., 'overall' vs 'AFUE'/'steady-state') and any R/k tables it uses.","segments":["[Chapter 7. Energy, efficiency and heat transfer.] [pause 1s]\n\nIn this lesson you will learn to: Distinguish a B-T-U (quantity) from B-T-U per hour (rate) and convert watts to B-T-U per hour; Calculate output from input and efficiency, and input from a required output; Explain combustion, heat-transfer and overall efficiency and why H-H-V/L-H-V basis matters; Classify heat movement as conduction, convection or radiation in hearth scenarios; Use R-values and k-values for layers in series. [pause 1s]\n\nB-T-U versus B-T-U per hour. [pause 0.5s] A British thermal unit is a quantity of heat: the energy needed to raise one pound of water by one degree Fahrenheit. A B-T-U per hour is a rate — how fast an appliance converts fuel energy. Ratings on hearth appliances are rates. If a fireplace burns at 40,000 B-T-U per hour for three hours, it consumes 120,000 B-T-U, or 1.2 therms, because one therm equals 100,000 B-T-U. Electric heat converts at 3,412 B-T-U per hour per kilowatt, so a 1,500-watt heater delivers about 5,118 B-T-U per hour.\n\nInput is not output. [pause 0.5s] Input is the rate at which fuel energy enters the appliance. Output is the rate at which useful heat reaches the room. The ratio is efficiency. Output equals input times efficiency as a decimal; input equals the required output divided by efficiency. A 50,000 B-T-U per hour decorative fireplace with poor efficiency may deliver less heat to the room than a 30,000 B-T-U per hour high-efficiency heater. When a customer compares appliances, make sure you compare output to output, or efficiency figures measured the same way.\n\nCombustion, heat-transfer and overall efficiency. [pause 0.5s] Combustion efficiency describes how completely the fuel is burned. Heat-transfer efficiency describes how much of the heat produced is transferred into the living space instead of leaving through the vent. Overall efficiency combines the two; in training it is often expressed as combustion efficiency times heat-transfer efficiency. A stove that burns cleanly but sends very hot gases up the chimney has good combustion and poor heat transfer. Published efficiencies are produced by specific test methods, and the same appliance can show different percentages under different methods.\n\nHigher and lower heating value. [pause 0.5s] Burning hydrogen-containing fuels creates water vapor. Higher heating value (H-H-V) counts the heat that would be recovered if that vapor condensed; lower heating value (L-H-V) does not. Because H-H-V is the larger number, an efficiency calculated on an L-H-V basis looks higher than the same performance expressed on an H-H-V basis. Two efficiency numbers are comparable only if they share the same basis and test method.\n\nConduction, convection and radiation. [pause 0.5s] Conduction moves heat through or between materials in contact — through a steel stove body, through a fastener into framing, or from a hot hearth into the floor beneath. Convection moves heat with a moving fluid: room air rising past a hot stove, or a blower pushing air through a heat exchanger. Natural convection relies on buoyancy; forced convection uses a fan. Radiation moves heat as infrared energy across open space and warms the surfaces it strikes without first warming the air — the warmth on your face from glass or a fire. Clearances to combustibles exist mostly because of radiant and conducted heat; heat shields work by blocking radiation and creating a ventilated air space so convection carries heat away.\n\nThermal resistance: R and k. [pause 0.5s] The k-value, or thermal conductivity, describes how easily heat passes through a material, usually per inch of thickness. R-value is resistance to heat flow. For a uniform material, R equals thickness divided by k. Higher R means better insulation, higher k means worse. For layers in series, R-values add. Floor-protector requirements are sometimes stated as a minimum R-value; the specialist must compare the R of the proposed materials — from their documentation — with the value the appliance listing requires, and never assume a decorative tile is an insulator.\n\nWorked example 1. A gas insert has 32,000 B-T-U per hour input and 75 percent efficiency. Output? [pause 3s — try it before the answer] Here is the solution. 32,000 times 0.75 = 24,000 B-T-U per hour.","Worked example 2. A room needs 20,000 B-T-U per hour delivered. With an 80 percent efficient appliance, what input? [pause 3s — try it before the answer] Here is the solution. 20,000 divided by 0.80 = 25,000 B-T-U per hour.\n\nWorked example 3. A floor protector needs R at least 1.00. Material A has k = 0.80 per inch. Is one 1/2-inch board enough? (hypothetical values) [pause 3s — try it before the answer] Here is the solution. R = 0.5 divided by 0.80 = 0.625 — not enough. Two boards , so 1.25 — meets the hypothetical requirement.\n\nCommon misconceptions. Misconception: A bigger input rating always means more heat in the room — only if efficiency is equal. Misconception: A lower k-value means a worse insulator — reversed: low k = low conductivity = better insulator. Misconception: Tile or stone over wood makes the floor noncombustible — the combustible beneath still conducts and can char.\n\nQuick check. Pause the audio and answer: Distinguish a B-T-U (quantity) from B-T-U per hour (rate) and convert watts to B-T-U per hour. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":912,"estSecs":391},{"id":"ch08-01","chapter":8,"title":"Hearth appliance families and why listing defines the application","objectives":["Differentiate masonry fireplaces, factory-built fireplaces, freestanding stoves, inserts and log sets.","Explain vented, direct-vent and vent-free gas configurations.","Explain radiant vs. circulating designs and pellet/electric distinctions.","Apply the rule that the listing, not appearance, defines the approved application."],"sections":[{"h":"Masonry fireplaces","body":"A site-built masonry fireplace is constructed of brick, block or stone with a firebrick-lined firebox, smoke chamber and masonry chimney. Its dimensions and clearances come from the adopted building code rather than a product listing. It is heavy, needs a footing, and as an open fire is a poor heater. Many inserts and log sets are installed into existing masonry fireplaces, so the specialist needs to know how to qualify one: its condition, flue size, damper, hearth and any history of chimney fire."},{"h":"Factory-built fireplaces","body":"A factory-built fireplace is a manufactured, listed assembly — firebox, outer casing, chimney system and specified components — tested together. Solid-fuel factory-built fireplaces in the US are listed to UL 127. Gas fireplaces are listed to the appropriate CSA/ANSI Z21 standard. The tested configuration includes clearances, framing dimensions, chimney or vent components and accessories. Substituting another manufacturer's chimney section or omitting a required part takes the installation outside its listing."},{"h":"Freestanding stoves and inserts","body":"A freestanding stove sits on a protected floor away from walls and connects to a chimney through a connector or vent. Wood stoves are commonly listed as solid-fuel room heaters (UL 1482) or fireplace stoves (UL 737). An insert is designed to sit inside an existing fireplace — masonry or a factory-built fireplace approved for that use — and normally vents through a liner up the existing chimney. A stove is not an insert merely because it fits in the opening; it must be listed for that application, and the host fireplace must be approved to receive it."},{"h":"Gas configurations","body":"A natural-draft vented gas appliance takes combustion air from the room and sends products up a vent or chimney using buoyancy. A direct-vent appliance is sealed from the room: it draws outside air and exhausts outside through a sealed two-passage system — coaxial (pipe within a pipe) or co-linear (two parallel liners), as the listing allows. A vent-free (unvented) appliance releases its combustion products into the room and relies on its listing, an oxygen depletion sensing pilot, input limits and the room's size and ventilation; many jurisdictions restrict or prohibit it. Decorative gas log sets installed in a working wood-burning fireplace are a separate category with their own standard and may require the damper to be fixed open."},{"h":"Radiant, circulating, pellet and electric","body":"A radiant appliance delivers most of its heat as radiation from hot surfaces. A circulating appliance has an outer jacket or heat exchanger so room air passes over the hot surfaces and out, often with a blower; it may permit closer clearances because its outer skin runs cooler. Pellet stoves and inserts are automatically fed by an auger and depend on electricity for feed, combustion blower and controls. Electric fireplaces have no combustion and no vent but still have electrical, clearance and listing requirements."}],"worked":[{"q":"Customer: 'This freestanding stove fits my fireplace — can it go in there?'","a":"Only if the stove's listing permits installation into that type of fireplace, with the specified liner, clearances, hearth protection and any blocking plate — and only if the fireplace is suitable to receive it."}],"misconceptions":["A gas log set is a heater — most decorative sets are not designed or rated as heaters.","Any metal pipe of the same diameter can extend a factory-built chimney — only listed, specified components.","Direct-vent and B-vent appliances are interchangeable because both vent outdoors — different listings and vent systems."],"src":["S12","S16"],"manualCheck":"Map the manual's appliance taxonomy (especially its definitions of 'radiant', 'circulating', 'zero-clearance').","segments":["[Chapter 8. Hearth appliance families and why listing defines the application.] [pause 1s]\n\nIn this lesson you will learn to: Differentiate masonry fireplaces, factory-built fireplaces, freestanding stoves, inserts and log sets; Explain vented, direct-vent and vent-free gas configurations; Explain radiant vs. circulating designs and pellet/electric distinctions; Apply the rule that the listing, not appearance, defines the approved application. [pause 1s]\n\nMasonry fireplaces. [pause 0.5s] A site-built masonry fireplace is constructed of brick, block or stone with a firebrick-lined firebox, smoke chamber and masonry chimney. Its dimensions and clearances come from the adopted building code rather than a product listing. It is heavy, needs a footing, and as an open fire is a poor heater. Many inserts and log sets are installed into existing masonry fireplaces, so the specialist needs to know how to qualify one: its condition, flue size, damper, hearth and any history of chimney fire.\n\nFactory-built fireplaces. [pause 0.5s] A factory-built fireplace is a manufactured, listed assembly — firebox, outer casing, chimney system and specified components — tested together. Solid-fuel factory-built fireplaces in the US are listed to U-L 127. Gas fireplaces are listed to the appropriate CSA/ANSI Z21 standard. The tested configuration includes clearances, framing dimensions, chimney or vent components and accessories. Substituting another manufacturer's chimney section or omitting a required part takes the installation outside its listing.\n\nFreestanding stoves and inserts. [pause 0.5s] A freestanding stove sits on a protected floor away from walls and connects to a chimney through a connector or vent. Wood stoves are commonly listed as solid-fuel room heaters (U-L 1482) or fireplace stoves (U-L 737). An insert is designed to sit inside an existing fireplace — masonry or a factory-built fireplace approved for that use — and normally vents through a liner up the existing chimney. A stove is not an insert merely because it fits in the opening; it must be listed for that application, and the host fireplace must be approved to receive it.\n\nGas configurations. [pause 0.5s] A natural-draft vented gas appliance takes combustion air from the room and sends products up a vent or chimney using buoyancy. A direct-vent appliance is sealed from the room: it draws outside air and exhausts outside through a sealed two-passage system — coaxial (pipe within a pipe) or co-linear (two parallel liners), as the listing allows. A vent-free (unvented) appliance releases its combustion products into the room and relies on its listing, an oxygen depletion sensing pilot, input limits and the room's size and ventilation; many jurisdictions restrict or prohibit it. Decorative gas log sets installed in a working wood-burning fireplace are a separate category with their own standard and may require the damper to be fixed open.\n\nRadiant, circulating, pellet and electric. [pause 0.5s] A radiant appliance delivers most of its heat as radiation from hot surfaces. A circulating appliance has an outer jacket or heat exchanger so room air passes over the hot surfaces and out, often with a blower; it may permit closer clearances because its outer skin runs cooler. Pellet stoves and inserts are automatically fed by an auger and depend on electricity for feed, combustion blower and controls. Electric fireplaces have no combustion and no vent but still have electrical, clearance and listing requirements.\n\nWorked example 1. Customer: 'This freestanding stove fits my fireplace — can it go in there?' [pause 3s — try it before the answer] Here is the solution. Only if the stove's listing permits installation into that type of fireplace, with the specified liner, clearances, hearth protection and any blocking plate — and only if the fireplace is suitable to receive it.\n\nCommon misconceptions. Misconception: A gas log set is a heater — most decorative sets are not designed or rated as heaters. Misconception: Any metal pipe of the same diameter can extend a factory-built chimney — only listed, specified components. Misconception: Direct-vent and B-vent appliances are interchangeable because both vent outdoors — different listings and vent systems.\n\nQuick check. Pause the audio and answer: Differentiate masonry fireplaces, factory-built fireplaces, freestanding stoves, inserts and log sets. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]","Reminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":718,"estSecs":308},{"id":"ch09-01","chapter":9,"title":"Codes, standards, listings and the AHJ","objectives":["Distinguish code, standard, listing, label, certification and manufacturer instructions.","Explain how adoption and local amendment determine what applies.","Match key standards to the products they cover.","Explain EPA emission certification versus safety listing."],"sections":[{"h":"Code, standard and law","body":"A standard describes how to build, test or install something. A code is a set of minimum requirements intended to be adopted into law. Neither is enforceable until a jurisdiction adopts it, often with local amendments and often an older edition. The authority having jurisdiction — the AHJ — is the official or office responsible for enforcing requirements and approving installations: a building official, fire marshal or gas inspector. When the national model code and a local amendment differ, the adopted local requirement and the AHJ's interpretation govern."},{"h":"Listing, labeling and instructions","body":"A listed product has been evaluated by a recognized testing laboratory against a standard and appears in that laboratory's published list. The label on the appliance identifies the listing and key ratings. The listing is conditional: it covers the product installed according to its instructions. Codes normally require installation according to the listing and the manufacturer's instructions, so the installation manual effectively becomes part of the code requirement. Where a manual and a code differ, the more restrictive normally applies, but the AHJ decides."},{"h":"Key documents by product","body":"NFPA 211 covers chimneys, fireplaces, vents and solid-fuel-burning appliances, including inspection levels for existing chimneys. The National Fuel Gas Code, published jointly as ANSI Z223.1 and NFPA 54, covers fuel-gas piping and appliance installation; its current edition is 2024. Product standards include UL 127 for factory-built fireplaces, UL 1482 for solid-fuel room heaters, UL 737 for fireplace stoves, UL 103 for factory-built chimneys, UL 441 for gas vents, UL 1777 for chimney liners, UL 1618 for wall protectors, floor protectors and hearth extensions, ASTM E1509 for pellet room heaters, and CSA/ANSI Z21.88 for vented gas fireplace heaters, Z21.50 for vented gas fireplaces and Z21.60 for decorative gas appliances for solid-fuel fireplaces. The International Residential, Mechanical and Fuel Gas Codes contain the model installation rules many states adopt."},{"h":"EPA certification is not a safety listing","body":"The EPA's New Source Performance Standards limit particulate emissions from new wood and pellet heaters. Since the 2020 step, the limit for room heaters is 2.0 grams per hour when tested with crib wood, or 2.5 grams per hour with cord wood. EPA certification says nothing about clearances or fire safety, and a UL listing says nothing about emissions. A legal, safe wood stove sale in the US needs both — and a local air-quality rule may be stricter still."},{"h":"Editions matter","body":"Your HDS First Edition manual was published in 2017. Standards and codes have since been revised; NFPA 211 is now in its 2027 edition and the gas code in its 2024 edition. For the exam, learn the concepts the manual tests; for real projects, verify the edition your jurisdiction has adopted and the appliance's current instructions."}],"worked":[{"q":"Installation manual allows 6 in. to a sidewall; local amendment requires 12 in. for all solid-fuel appliances. Which governs?","a":"Plan for the more restrictive 12 in. and confirm with the AHJ; the listing permits 6 in. but does not override adopted local law."}],"misconceptions":["A UL listing means the product meets every local code — the listing is product evaluation, adoption is local.","The newest edition of a code automatically applies — only the adopted edition applies.","EPA-certified means safety-tested — emissions and safety are separate evaluations."],"src":["S05","S10","S11","S12","S15","S16"],"manualCheck":"Record exactly which standards and editions the manual lists; exam items may reference those editions.","segments":["[Chapter 9. Codes, standards, listings and the A-H-J, the authority having jurisdiction.] [pause 1s]\n\nIn this lesson you will learn to: Distinguish code, standard, listing, label, certification and manufacturer instructions; Explain how adoption and local amendment determine what applies; Match key standards to the products they cover; Explain E-P-A emission certification versus safety listing. [pause 1s]\n\nCode, standard and law. [pause 0.5s] A standard describes how to build, test or install something. A code is a set of minimum requirements intended to be adopted into law. Neither is enforceable until a jurisdiction adopts it, often with local amendments and often an older edition. The authority having jurisdiction — the A-H-J, the authority having jurisdiction — is the official or office responsible for enforcing requirements and approving installations: a building official, fire marshal or gas inspector. When the national model code and a local amendment differ, the adopted local requirement and the A-H-J, the authority having jurisdiction's interpretation govern.\n\nListing, labeling and instructions. [pause 0.5s] A listed product has been evaluated by a recognized testing laboratory against a standard and appears in that laboratory's published list. The label on the appliance identifies the listing and key ratings. The listing is conditional: it covers the product installed according to its instructions. Codes normally require installation according to the listing and the manufacturer's instructions, so the installation manual effectively becomes part of the code requirement. Where a manual and a code differ, the more restrictive normally applies, but the A-H-J, the authority having jurisdiction decides.\n\nKey documents by product. [pause 0.5s] N-F-P-A 211 covers chimneys, fireplaces, vents and solid-fuel-burning appliances, including inspection levels for existing chimneys. The National Fuel Gas Code, published jointly as ANSI Z223.1 and N-F-P-A 54, covers fuel-gas piping and appliance installation; its current edition is 2024. Product standards include U-L 127 for factory-built fireplaces, U-L 1482 for solid-fuel room heaters, U-L 737 for fireplace stoves, U-L 103 for factory-built chimneys, U-L 441 for gas vents, U-L 1777 for chimney liners, U-L 1618 for wall protectors, floor protectors and hearth extensions, ASTM E1509 for pellet room heaters, and CSA/ANSI Z21.88 for vented gas fireplace heaters, Z21.50 for vented gas fireplaces and Z21.60 for decorative gas appliances for solid-fuel fireplaces. The International Residential, Mechanical and Fuel Gas Codes contain the model installation rules many states adopt.\n\nE-P-A certification is not a safety listing. [pause 0.5s] The E-P-A's New Source Performance Standards limit particulate emissions from new wood and pellet heaters. Since the 2020 step, the limit for room heaters is 2.0 grams per hour when tested with crib wood, or 2.5 grams per hour with cord wood. E-P-A certification says nothing about clearances or fire safety, and a U-L listing says nothing about emissions. A legal, safe wood stove sale in the US needs both — and a local air-quality rule may be stricter still.\n\nEditions matter. [pause 0.5s] Your HDS First Edition manual was published in 2017. Standards and codes have since been revised; N-F-P-A 211 is now in its 2027 edition and the gas code in its 2024 edition. For the exam, learn the concepts the manual tests; for real projects, verify the edition your jurisdiction has adopted and the appliance's current instructions.\n\nWorked example 1. Installation manual allows 6 inches to a sidewall; local amendment requires 12 inches for all solid-fuel appliances. Which governs? [pause 3s — try it before the answer] Here is the solution. Plan for the more restrictive 12 inches and confirm with the A-H-J, the authority having jurisdiction; the listing permits 6 inches but does not override adopted local law.\n\nCommon misconceptions. Misconception: A U-L listing means the product meets every local code — the listing is product evaluation, adoption is local. Misconception: The newest edition of a code automatically applies — only the adopted edition applies. Misconception: E-P-A-certified means safety-tested — emissions and safety are separate evaluations.","Quick check. Pause the audio and answer: Distinguish code, standard, listing, label, certification and manufacturer instructions. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":704,"estSecs":302},{"id":"ch10-01","chapter":10,"title":"Installation planning: clearances, protection and access","objectives":["Interpret clearance diagrams and identify the reference point and combustible being protected.","Distinguish ember (Type 1) and thermal (Type 2) floor protection and calculate a protector's size.","Apply masonry hearth-extension rules and know when the listing governs instead.","Plan mantels, facings, structural load, utilities and service access before the sale closes."],"sections":[{"h":"Clearance is distance to combustibles","body":"A clearance is the minimum air space between a hot appliance, connector or vent and the nearest combustible material, measured from the reference point the instructions define — the stove body, the top of the opening, the outer pipe wall. Drywall's paper face, wood framing, trim, furniture and many finishes are combustible. Covering a combustible with tile or stone does not make it noncombustible; heat conducts through and can char wood over time at temperatures far below its normal ignition point. Clearances for listed appliances come from the listing; unlisted appliances fall back to code tables that are usually much larger."},{"h":"Reduced clearances","body":"Codes and listings may allow clearance reduction with specific shield systems — commonly a noncombustible panel spaced off the wall on noncombustible spacers with ventilation at top and bottom. The ventilated air space is what does the work: it lets convection carry away heat the shield absorbs. A shield fastened tight to the wall, or blocked at top or bottom, does not provide the reduction. Some listings prohibit reductions altogether."},{"h":"Floor protection and hearth extensions","body":"Floor protection prevents embers and heat from igniting a combustible floor. UL 1618 recognizes Type 1 (ember) protection — a continuous noncombustible surface — and Type 2 (thermal) protection, which also limits heat conducted to the floor and is typically expressed as an R-value. The appliance listing states which type, its dimensions (front, sides, rear, often measured from the loading door), and any R-value. For site-built masonry fireplaces under the IRC, the hearth extension must reach 16 inches in front and 8 inches beyond each side of openings under 6 square feet, and 20 inches in front and 12 inches beyond each side for openings of 6 square feet or more; factory-built fireplaces follow their listing."},{"h":"Mantels, facings and framing","body":"Mantel and trim clearance diagrams typically allow a deeper projection the higher the mantel is above the opening. Measure both projection and height. For factory-built units, combustible framing must stay outside the specified header and side zones, and facing materials within the 'noncombustible zone' must be noncombustible. Televisions and electronics above fireplaces need the manufacturer's guidance on surface temperatures."},{"h":"Structure, utilities and access","body":"Heavy masonry surrounds, stone veneers and stoves can exceed floor design loads; a stove on a raised wood floor plus a stone hearth may require an engineer's review. Plan the gas line, electrical outlet for blowers or pellet units, outside air kit, and vent route at the design stage. Control valves, blowers, and pellet hoppers need service access that the finished surround must not block. Fuel demand — the total connected gas load — affects pipe sizing and meter capacity; the specialist collects the information and the qualified gas installer sizes the pipe."}],"worked":[{"q":"Masonry fireplace opening 40 in. wide × 30 in. high. Required IRC hearth extension?","a":"Area = 1,200 in² = 8.33 ft² ≥ 6 ft² → at least 20 in. in front and 12 in. beyond each side."},{"q":"HYPO stove listing: Type 2 floor protector R ≥ 1.2, extending 16 in. in front of the door and 8 in. at sides/rear. Stove 22 in. wide × 24 in. deep. Protector size?","a":"Width 22 + 8 + 8 = 38 in.; depth 8 (rear) + 24 + 16 = 48 in. → 38 × 48 in. = 1,824 in² ≈ 12.7 ft², with materials totaling R ≥ 1.2."}],"misconceptions":["Ember protection is enough for any stove — many listings require thermal protection.","A wall shield can be screwed flat to the drywall — the ventilated gap is essential.","Hearth extension sizes from the IRC apply to factory-built fireplaces — the listing governs those."],"src":["S07","S15","HYPO"],"manualCheck":"Find the manual's clearance-reduction table, floor-protection example and any mantel diagram; record page numbers.","segments":["[Chapter 10. Installation planning: clearances, protection and access.] [pause 1s]\n\nIn this lesson you will learn to: Interpret clearance diagrams and identify the reference point and combustible being protected; Distinguish ember (Type 1) and thermal (Type 2) floor protection and calculate a protector's size; Apply masonry hearth-extension rules and know when the listing governs instead; Plan mantels, facings, structural load, utilities and service access before the sale closes. [pause 1s]\n\nClearance is distance to combustibles. [pause 0.5s] A clearance is the minimum air space between a hot appliance, connector or vent and the nearest combustible material, measured from the reference point the instructions define — the stove body, the top of the opening, the outer pipe wall. Drywall's paper face, wood framing, trim, furniture and many finishes are combustible. Covering a combustible with tile or stone does not make it noncombustible; heat conducts through and can char wood over time at temperatures far below its normal ignition point. Clearances for listed appliances come from the listing; unlisted appliances fall back to code tables that are usually much larger.\n\nReduced clearances. [pause 0.5s] Codes and listings may allow clearance reduction with specific shield systems — commonly a noncombustible panel spaced off the wall on noncombustible spacers with ventilation at top and bottom. The ventilated air space is what does the work: it lets convection carry away heat the shield absorbs. A shield fastened tight to the wall, or blocked at top or bottom, does not provide the reduction. Some listings prohibit reductions altogether.\n\nFloor protection and hearth extensions. [pause 0.5s] Floor protection prevents embers and heat from igniting a combustible floor. U-L 1618 recognizes Type 1 (ember) protection — a continuous noncombustible surface — and Type 2 (thermal) protection, which also limits heat conducted to the floor and is typically expressed as an R-value. The appliance listing states which type, its dimensions (front, sides, rear, often measured from the loading door), and any R-value. For site-built masonry fireplaces under the I-R-C, the hearth extension must reach 16 inches in front and 8 inches beyond each side of openings under 6 square feet, and 20 inches in front and 12 inches beyond each side for openings of 6 square feet or more; factory-built fireplaces follow their listing.\n\nMantels, facings and framing. [pause 0.5s] Mantel and trim clearance diagrams typically allow a deeper projection the higher the mantel is above the opening. Measure both projection and height. For factory-built units, combustible framing must stay outside the specified header and side zones, and facing materials within the 'noncombustible zone' must be noncombustible. Televisions and electronics above fireplaces need the manufacturer's guidance on surface temperatures.\n\nStructure, utilities and access. [pause 0.5s] Heavy masonry surrounds, stone veneers and stoves can exceed floor design loads; a stove on a raised wood floor plus a stone hearth may require an engineer's review. Plan the gas line, electrical outlet for blowers or pellet units, outside air kit, and vent route at the design stage. Control valves, blowers, and pellet hoppers need service access that the finished surround must not block. Fuel demand — the total connected gas load — affects pipe sizing and meter capacity; the specialist collects the information and the qualified gas installer sizes the pipe.\n\nWorked example 1. Masonry fireplace opening 40 inches wide times 30 inches high. Required I-R-C hearth extension? [pause 3s — try it before the answer] Here is the solution. Area = 1,200 square inches = 8.33 square feet at least 6 square feet , so at least 20 inches in front and 12 inches beyond each side.\n\nWorked example 2. hypothetical stove listing: Type 2 floor protector R at least 1.2, extending 16 inches in front of the door and 8 inches at sides/rear. Stove 22 inches wide times 24 inches deep. Protector size? [pause 3s — try it before the answer] Here is the solution. Width 22 + 8 + 8 = 38 inches; depth 8 (rear) + 24 + 16 = 48 inches , so 38 times 48 inches = 1,824 square inches about 12.7 square feet, with materials totaling R at least 1.2.","Common misconceptions. Misconception: Ember protection is enough for any stove — many listings require thermal protection. Misconception: A wall shield can be screwed flat to the drywall — the ventilated gap is essential. Misconception: Hearth extension sizes from the I-R-C apply to factory-built fireplaces — the listing governs those.\n\nQuick check. Pause the audio and answer: Interpret clearance diagrams and identify the reference point and combustible being protected. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":797,"estSecs":342},{"id":"ch11-01","chapter":11,"title":"Venting: draft, pressure and vent systems","objectives":["Explain natural draft and the factors that increase or weaken it.","Explain stack effect, house depressurization, spillage and backdrafting.","Apply the masonry chimney 3-2-10 rule and know where it does not apply.","Distinguish chimney, connector, B-vent, direct-vent and pellet vent systems and calculate equivalent length."],"sections":[{"h":"Natural draft","body":"Hot flue gases are less dense than the colder outdoor air. A column of hot gas in a chimney therefore weighs less than an equal column of outdoor air, and the pressure difference pulls air into the appliance and pushes products up. Draft increases with taller chimneys and with a larger temperature difference. It weakens when the flue is cold, oversized, leaky, too short, or exposed on an exterior wall — and a cold flue also encourages condensation and creosote. Draft is measured in very small pressures, inches of water column, with a manometer."},{"h":"The house is part of the system","body":"In cold weather, warm air in a house rises and leaks out near the top while outside air leaks in near the bottom — the stack effect — leaving the lower parts of the house at lower pressure than outdoors. Exhaust fans, range hoods, clothes dryers and other chimneys also remove air. If the house is depressurized more than the appliance's draft can overcome, flue gases spill into the room at startup or the flow reverses entirely: backdrafting. A fireplace that smokes only when the kitchen hood runs is a classic pressure problem. Solutions include makeup air, sealed (direct-vent) appliances and proper design, not simply a taller chimney."},{"h":"Chimney height and termination","body":"For masonry chimneys the model code requires the top to be at least 3 feet above the highest point where it passes through the roof and at least 2 feet higher than any part of the building within 10 feet horizontally — the 3-2-10 rule. Factory-built chimneys follow their listing, which commonly uses the same rule. Gas vents (Type B) use a roof-pitch table and the gas code instead, and direct-vent terminals have their own clearances to windows, doors, soffits, grade and air inlets from the listing and fuel gas code."},{"h":"Components are systems","body":"A chimney is the vertical structure that carries products to the outdoors; a chimney connector is the pipe between a solid-fuel appliance and the chimney and is not listed to pass through walls or ceilings without a listed pass-through. Factory-built chimneys (UL 103, with high-temperature 'HT' ratings for solid fuel) must be assembled only from that manufacturer's listed parts. Type B gas vent (UL 441) is for listed Category I gas appliances and never for wood or pellets. Direct-vent systems use the specific coaxial or co-linear components the appliance lists. Pellet vent is a sealed vent specified by the pellet appliance manufacturer — the appliance's exhaust is under positive pressure, so joints must be gas-tight."},{"h":"Sizing and equivalent length","body":"A flue that is too large lets gases slow and cool, weakening draft; too small restricts flow. Masonry fireplaces historically used a ratio of flue area to fireplace opening area. Powered and direct-vent systems are sized from the manufacturer's vent tables, which limit total length, number of elbows and rise-to-run combinations. Equivalent vent length converts each fitting into an equivalent length of straight pipe so the total can be compared with the table's maximum. Altitude can require a larger diameter."}],"worked":[{"q":"Chimney penetrates the roof 4 ft below the ridge, 7 ft horizontally from it. Minimum height above penetration?","a":"Ridge is within 10 ft: must be 2 ft above it → 4 + 2 = 6 ft above the penetration (which also exceeds the 3 ft minimum)."},{"q":"HYPO pellet table: 90° elbow = 5 ft, 45° = 3 ft, tee = 5 ft, max EVL 15 ft. Route: tee + 3 ft horizontal + 90° + 4 ft vertical.","a":"5 + 3 + 5 + 4 = 17 ft → exceeds 15 ft; redesign or use the larger diameter the manual permits."}],"misconceptions":["A taller chimney fixes every draft problem — not if the house is depressurized or the flue is oversized and cold.","B-vent can carry pellet exhaust because pellets are 'low temperature' — never; pellet vent is specified separately.","Equivalent length allowances are universal — they are model-specific."],"src":["S08","S16","HYPO"],"manualCheck":"Record the manual's draft definitions, any flue-ratio rule (1/10, 1/12), and its stated termination rules.","segments":["[Chapter 11. Venting: draft, pressure and vent systems.] [pause 1s]\n\nIn this lesson you will learn to: Explain natural draft and the factors that increase or weaken it; Explain stack effect, house depressurization, spillage and backdrafting; Apply the masonry chimney 3-2-10 rule and know where it does not apply; Distinguish chimney, connector, B-vent, direct-vent and pellet vent systems and calculate equivalent length. [pause 1s]\n\nNatural draft. [pause 0.5s] Hot flue gases are less dense than the colder outdoor air. A column of hot gas in a chimney therefore weighs less than an equal column of outdoor air, and the pressure difference pulls air into the appliance and pushes products up. Draft increases with taller chimneys and with a larger temperature difference. It weakens when the flue is cold, oversized, leaky, too short, or exposed on an exterior wall — and a cold flue also encourages condensation and creosote. Draft is measured in very small pressures, inches of water column, with a manometer.\n\nThe house is part of the system. [pause 0.5s] In cold weather, warm air in a house rises and leaks out near the top while outside air leaks in near the bottom — the stack effect — leaving the lower parts of the house at lower pressure than outdoors. Exhaust fans, range hoods, clothes dryers and other chimneys also remove air. If the house is depressurized more than the appliance's draft can overcome, flue gases spill into the room at startup or the flow reverses entirely: backdrafting. A fireplace that smokes only when the kitchen hood runs is a classic pressure problem. Solutions include makeup air, sealed (direct-vent) appliances and proper design, not simply a taller chimney.\n\nChimney height and termination. [pause 0.5s] For masonry chimneys the model code requires the top to be at least 3 feet above the highest point where it passes through the roof and at least 2 feet higher than any part of the building within 10 feet horizontally — the 3-2-10 rule. Factory-built chimneys follow their listing, which commonly uses the same rule. Gas vents (Type B) use a roof-pitch table and the gas code instead, and direct-vent terminals have their own clearances to windows, doors, soffits, grade and air inlets from the listing and fuel gas code.\n\nComponents are systems. [pause 0.5s] A chimney is the vertical structure that carries products to the outdoors; a chimney connector is the pipe between a solid-fuel appliance and the chimney and is not listed to pass through walls or ceilings without a listed pass-through. Factory-built chimneys (U-L 103, with high-temperature 'HT' ratings for solid fuel) must be assembled only from that manufacturer's listed parts. Type B gas vent (U-L 441) is for listed Category I gas appliances and never for wood or pellets. Direct-vent systems use the specific coaxial or co-linear components the appliance lists. Pellet vent is a sealed vent specified by the pellet appliance manufacturer — the appliance's exhaust is under positive pressure, so joints must be gas-tight.\n\nSizing and equivalent length. [pause 0.5s] A flue that is too large lets gases slow and cool, weakening draft; too small restricts flow. Masonry fireplaces historically used a ratio of flue area to fireplace opening area. Powered and direct-vent systems are sized from the manufacturer's vent tables, which limit total length, number of elbows and rise-to-run combinations. Equivalent vent length converts each fitting into an equivalent length of straight pipe so the total can be compared with the table's maximum. Altitude can require a larger diameter.\n\nWorked example 1. Chimney penetrates the roof 4 feet below the ridge, 7 feet horizontally from it. Minimum height above penetration? [pause 3s — try it before the answer] Here is the solution. Ridge is within 10 feet: must be 2 feet above it , so 4 + 2 = 6 feet above the penetration (which also exceeds the 3 feet minimum).\n\nWorked example 2. hypothetical pellet table: 90° elbow = 5 feet, 45° = 3 feet, tee = 5 feet, max E-V-L 15 feet. Route: tee + 3 feet horizontal + 90° + 4 feet vertical. [pause 3s — try it before the answer] Here is the solution. 5 + 3 + 5 + 4 = 17 feet , so exceeds 15 feet; redesign or use the larger diameter the manual permits.","Common misconceptions. Misconception: A taller chimney fixes every draft problem — not if the house is depressurized or the flue is oversized and cold. Misconception: B-vent can carry pellet exhaust because pellets are 'low temperature' — never; pellet vent is specified separately. Misconception: Equivalent length allowances are universal — they are model-specific.\n\nQuick check. Pause the audio and answer: Explain natural draft and the factors that increase or weaken it. [pause 5s] Then open the chapter quiz in the course to test yourself. [pause 1s]\n\nReminder: worked-example numbers in this lesson are teaching examples. Your appliance listing, the manufacturer's instructions and the codes adopted by your authority having jurisdiction always govern a real installation."],"words":829,"estSecs":355},{"id":"ch12-01","chapter":12,"title":"Communicating with owners: operation, safety and handoff","objectives":["Build a model-specific owner handoff covering operation, maintenance, fuel, ash and alarms.","Explain hot-surface, glass-barrier and child-safety points.","Recognize conditions that require emergency action versus routine service.","Document and escalate unsafe conditions appropriately."],"sections":[{"h":"The handoff is part of the installation","body":"Owners operate what they understand. A strong handoff uses the actual owner's manual for the installed model: lighting and shutdown, normal sounds and smells during the first fires as paint cures, how to use the remote or thermostat, what the owner may clean and what requires a technician, the service interval, and who to call. Leave the manual with the appliance and record model, serial number, installer and date."},{"h":"Hot surfaces and barriers","body":"Glass, metal surrounds, and the hearth can
